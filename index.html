    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TELEGRAM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STATE

        const reloadPfpBtn = document.getElementById('reload-pfp-btn');

        const WIN_GIFS = [
            'https://i.postimg.cc/rmQPRSzF/ezgif-20d222277768f496.gif',
            'https://i.postimg.cc/NfyzL2tt/ezgif-2378686847977dc7.gif',

        ];

        const PRIZE_GIFS = {
            first: 'https://i.postimg.cc/gJbCZf8c/ezgif-251770c86b1ec433.gif',
            second: 'https://i.postimg.cc/9F1cjFTj/ezgif-21ab08378515e1ba.gif',

        };
        const DIAMOND_GIF = 'https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ROBUST PFP LOADER (with fallback & caching)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const pfpCache = new Map();
        let defaultAvatarImg = null;

        function loadPFP(src, maxRetries = 3) {
            return new Promise((resolve) => {
                if (!src || src === '') src = state.defaultAvatar;
                if (pfpCache.has(src)) {
                    const cached = pfpCache.get(src);
                    if (cached.loaded) {
                        resolve(cached.img);
                        return;
                    }
                    if (cached.promise) {
                        cached.promise.then(resolve);
                        return;
                    }
                }

                const img = new Image();
                let attempts = 0;
                let resolved = false;

                const tryLoad = () => {
                    if (!src.startsWith('data:') && !src.startsWith('blob:')) {
                        img.crossOrigin = 'anonymous';
                    } else {
                        img.crossOrigin = undefined;
                    }

                    img.onload = () => {
                        if (resolved) return;
                        resolved = true;
                        pfpCache.set(src, { img, loaded: true, promise: null });
                        resolve(img);
                    };

                    img.onerror = () => {
                        attempts++;
                        if (attempts < maxRetries) {
                            const separator = src.includes('?') ? '&' : '?';
                            img.src = src + separator + 'retry=' + attempts + '&t=' + Date.now();
                        } else {
                            if (resolved) return;
                            resolved = true;
                            if (src !== state.defaultAvatar) {
                                loadPFP(state.defaultAvatar).then(defImg => resolve(defImg));
                            } else {
                                pfpCache.set(src, { img: null, loaded: false, promise: null });
                                resolve(null);
                            }
                        }
                    };

                    img.src = src;
                };

                const promise = new Promise((res) => {});
                const cacheEntry = { img: null, loaded: false, promise: promise };
                pfpCache.set(src, cacheEntry);

                tryLoad();

                const timeoutId = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        if (src !== state.defaultAvatar) {
                            loadPFP(state.defaultAvatar).then(defImg => resolve(defImg));
                        } else {
                            resolve(null);
                        }
                    }
                }, 8000);

                const wrappedResolve = (val) => {
                    clearTimeout(timeoutId);
                    resolve(val);
                };

                const origOnload = img.onload;
                const origOnerror = img.onerror;
                img.onload = () => {
                    if (resolved) return;
                    resolved = true;
                    pfpCache.set(src, { img, loaded: true, promise: null });
                    wrappedResolve(img);
                };
                img.onerror = () => {
                    attempts++;
                    if (attempts < maxRetries) {
                        const separator = src.includes('?') ? '&' : '?';
                        img.src = src + separator + 'retry=' + attempts + '&t=' + Date.now();
                        return;
                    }
                    if (resolved) return;
                    resolved = true;
                    if (src !== state.defaultAvatar) {
                        loadPFP(state.defaultAvatar).then(defImg => wrappedResolve(defImg));
                    } else {
                        pfpCache.set(src, { img: null, loaded: false, promise: null });
                        wrappedResolve(null);
                    }
                };
                const currentSrc = img.src;
                if (currentSrc && currentSrc !== 'about:blank') {
                    img.src = '';
                    setTimeout(() => { img.src = currentSrc; }, 10);
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PERIMETER GENERATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generatePerimeter(size, cornerRadius, numPoints = 300) {
            const half = size / 2;
            const r = Math.min(cornerRadius, half);
            const points = [];
            const sections = [
                { type: 'line', x1: -half + r, y1: -half, x2: half - r, y2: -half },
                { type: 'arc', cx: half - r, cy: -half + r, start: -Math.PI / 2, end: 0 },
                { type: 'line', x1: half, y1: -half + r, x2: half, y2: half - r },
                { type: 'arc', cx: half - r, cy: half - r, start: 0, end: Math.PI / 2 },
                { type: 'line', x1: half - r, y1: half, x2: -half + r, y2: half },
                { type: 'arc', cx: -half + r, cy: half - r, start: Math.PI / 2, end: Math.PI },
                { type: 'line', x1: -half, y1: half - r, x2: -half, y2: -half + r },
                { type: 'arc', cx: -half + r, cy: -half + r, start: Math.PI, end: 3 * Math.PI / 2 }
            ];

            let totalLen = 0;
            const segLengths = sections.map(seg => {
                if (seg.type === 'line') {
                    const dx = seg.x2 - seg.x1,
                        dy = seg.y2 - seg.y1;
                    return Math.sqrt(dx * dx + dy * dy);
                } else {
                    return r * (seg.end - seg.start);
                }
            });
            totalLen = segLengths.reduce((a, b) => a + b, 0);

            const step = totalLen / numPoints;
            let accumulated = 0;
            let segIdx = 0;
            for (let i = 0; i < numPoints; i++) {
                const target = i * step;
                while (accumulated + segLengths[segIdx] < target) {
                    accumulated += segLengths[segIdx];
                    segIdx = (segIdx + 1) % sections.length;
                }
                const localT = (target - accumulated) / segLengths[segIdx];
                const seg = sections[segIdx];
                let px, py;
                if (seg.type === 'line') {
                    px = seg.x1 + localT * (seg.x2 - seg.x1);
                    py = seg.y1 + localT * (seg.y2 - seg.y1);
                } else {
                    const angle = seg.start + localT * (seg.end - seg.start);
                    px = seg.cx + r * Math.cos(angle);
                    py = seg.cy + r * Math.sin(angle);
                }
                points.push({ x: px + half, y: py + half });
            }
            return points;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CANVAS SIZING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width - 16, rect.height - 16, 440);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            state.arenaSize = size;
            state.cornerRadius = size * 0.15;
            ctx.scale(dpr, dpr);
            state.perimeterPoints = generatePerimeter(size, state.cornerRadius, 300);
            if (state.opening && state.opening.startIdx !== undefined) {
                const total = state.perimeterPoints.length;
                const startIdx = Math.floor(state.opening.startIdx / (state.opening._total || total) * total);
                const endIdx = Math.floor(state.opening.endIdx / (state.opening._total || total) * total);
                state.opening.startIdx = startIdx % total;
                state.opening.endIdx = endIdx % total;
                state.opening._total = total;
            }
            const half = size / 2;
            state.players.forEach(p => {
                if (p.x === undefined || p.x === 0) {
                    p.x = half + (Math.random() - 0.5) * (size * 0.4);
                    p.y = half + (Math.random() - 0.5) * (size * 0.4);
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // FROG VISIBILITY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateFrogVisibility() {
            const alive = getAlive();
            const showFrog = alive.length < 2 && state.gameState === 'idle';
            frogGif.classList.toggle('show', showFrog);
            waitingText.style.display = showFrog ? 'none' : 'block';
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // WIN HISTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function addWinToHistory(name, pfp) {
            state.winHistory.unshift({ name, pfp, timestamp: Date.now() });
            if (state.winHistory.length > state.maxHistory) {
                state.winHistory.pop();
            }
            updateWinHistoryUI();
        }

        function updateWinHistoryUI() {
            if (state.winHistory.length === 0) {
                winHistoryEl.innerHTML = '';
                return;
            }
            let html = '';
            state.winHistory.forEach(entry => {
                const avatarSrc = entry.pfp || state.defaultAvatar;
                html +=
                    `<div class="win-entry"><img src="${avatarSrc}" onerror="this.src='${state.defaultAvatar}'" /></div>`;
            });
            winHistoryEl.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TOP LEADERBOARD
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generateTopPlayers() {
            const names = ['CryptoKing', 'DiamondHands', 'BumpMaster', 'LuckyStar', 'MoonRider', 'ShadowDoge', 'GoldenGod',
                'SilverFox', 'NeonNinja', 'PixelPirate'
            ];
            const top = [];
            for (let i = 0; i < 10; i++) {
                const wins = Math.floor(Math.random() * 50) + 5;
                const score = Math.floor(Math.random() * 3000) + 100;
                const pfp = 'https://i.pravatar.cc/100?img=' + (i + 20);
                top.push({
                    name: names[i % names.length] + (i > 4 ? '' : ''),
                    pfp: pfp,
                    wins: wins,
                    score: score,
                    rank: i + 1
                });
            }
            top.sort((a, b) => b.score - a.score);
            top.forEach((p, idx) => p.rank = idx + 1);
            return top;
        }

        function getPrizeForRank(rank) {
            if (rank === 1) return { label: 'Gift Box', gif: PRIZE_GIFS.first };
            if (rank === 2 || rank === 3) return { label: 'Bear', gif: PRIZE_GIFS.second };
            if (rank === 4 || rank === 5) return { label: '1500', gif: DIAMOND_GIF };
            if (rank >= 6 && rank <= 10) return { label: '100', gif: DIAMOND_GIF };
            return null;
        }

        function updateTopUI() {
            const players = state.topPlayers.length ? state.topPlayers : generateTopPlayers();
            if (!state.topPlayers.length) state.topPlayers = players;

            const top3 = players.slice(0, 3);
            const podiumOrder = [
                { player: top3[2] || top3[0], cls: 'bronze', label: '🥉', base: 'bronze', colClass: 'p3' },
                { player: top3[0] || top3[1], cls: 'gold', label: '🥇', base: 'gold', colClass: 'p1' },
                { player: top3[1] || top3[2], cls: 'silver', label: '🥈', base: 'silver', colClass: 'p2' }
            ];

            let podiumHtml = '';
            podiumOrder.forEach((info) => {
                const p = info.player;
                if (!p) return;
                const prize = getPrizeForRank(p.rank);
                let prizeHtml = '';
                if (prize) {
                    if (prize.gif) {
                        prizeHtml = `<img src="${prize.gif}" alt="${prize.label}" /> ${prize.label}`;
                    } else {
                        prizeHtml = prize.label;
                    }
                }
                podiumHtml += `<div class="podium-col ${info.colClass}">
                            <div class="rank-badge ${info.cls}">${info.label}</div>
                            <img class="podium-pfp ${info.cls}" src="${p.pfp}" onerror="this.src='${state.defaultAvatar}'" />
                            <div class="podium-name">${p.name}</div>
                            <div class="podium-prize">${prizeHtml}</div>
                            <div class="podium-stats">${p.wins} wins · ${p.score}</div>
                            <div class="podium-base ${info.base}"></div>
                        </div>`;
            });
            podiumEl.innerHTML = podiumHtml;

            const rest = players.slice(3);
            if (rest.length === 0) {
                topList.innerHTML = '';
                return;
            }
            let listHtml = '';
            rest.forEach(p => {
                const rank = p.rank;
                let rClass = 'rank';
                if (rank === 4) rClass += ' gold';
                else if (rank === 5) rClass += ' silver';
                else if (rank === 6) rClass += ' bronze';

                const prize = getPrizeForRank(rank);
                let prizeHtml = '';
                if (prize) {
                    if (prize.gif) {
                        prizeHtml = `<img src="${prize.gif}" alt="${prize.label}" /> ${prize.label}`;
                    } else {
                        prizeHtml = prize.label;
                    }
                }

                listHtml += `<div class="top-entry">
                            <div class="${rClass}">#${rank}</div>
                            <img class="t-pfp" src="${p.pfp}" onerror="this.src='${state.defaultAvatar}'" />
                            <div class="t-name">${p.name}</div>
                            <div class="t-wins">${p.wins} wins</div>
                            <div class="t-score">${p.score}</div>
                            <div class="t-prize">${prizeHtml}</div>
                        </div>`;
            });
            topList.innerHTML = listHtml;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER FACTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function computeRadii() {
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            if (totalBet === 0) return;
            state.players.forEach(p => {
                const ratio = p.bet / totalBet;
                const r = 18 + ratio * 34;
                const newTarget = Math.min(Math.max(r, 14), 52);
                p.targetRadius = newTarget;
            });
        }

        function makePlayer(id, bet, name, pfp) {
            const half = state.arenaSize / 2;
            const radius = 18;
            let x, y, attempts = 0,
                overlap = true;
            while (overlap && attempts < 100) {
                x = half + (Math.random() - 0.5) * (state.arenaSize * 0.6);
                y = half + (Math.random() - 0.5) * (state.arenaSize * 0.6);
                overlap = state.players.some(p => Math.hypot(p.x - x, p.y - y) < p.radius + radius + 5);
                attempts++;
            }
            const avatarSrc = pfp || state.defaultAvatar;
            const p = {
                id,
                bet,
                name: name || 'player',
                pfp: avatarSrc,
                radius: radius,
                displayRadius: radius,
                targetRadius: radius,
                mass: radius * radius * 1.2,
                x: x || half,
                y: y || half,
                vx: 0,
                vy: 0,
                alive: true,
                isPopping: true,
                popStartTime: performance.now(),
                popDuration: 550,
                pulseTime: 0,
                isPulsing: false,
                pulseStartTime: 0,
                pfpLoaded: false,
                pfpImg: null,
            };

            // Load PFP
            loadPFP(avatarSrc).then(img => {
                if (img && img.naturalWidth > 0) {
                    p.pfpLoaded = true;
                    p.pfpImg = img;
                } else {
                    p.pfpLoaded = false;
                    p.pfpImg = null;
                }
                updatePlayerList();
            });

            state.players.push(p);
            computeRadii();
            haptic('medium');
            updatePlayerList();
            return p;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER LIST UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updatePlayerList() {
            const alive = state.players.filter(p => p.alive);
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            if (alive.length === 0) {
                playerListContainer.innerHTML = '';
                return;
            }
            let html = '';
            alive.forEach(p => {
                const chance = totalBet > 0 ? ((p.bet / totalBet) * 100).toFixed(1) : 0;
                const isYou = p.id === state.userId;
                html += `<div class="pl-entry ${isYou ? 'you' : ''}">
                            <div class="pl-avatar"><img src="${p.pfp}" onerror="this.src='${state.defaultAvatar}'" /></div>
                            <span class="pl-name">${p.name}</span>
                            <span class="pl-bet">${p.bet}</span>
                            <span class="pl-chance">${chance}%</span>
                        </div>`;
            });
            playerListContainer.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BET OVERLAY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateBetOverlayVisibility() {
            const shouldHide = state.gameState === 'playing' || state.gameState === 'finished';
            betOverlayWrap.classList.toggle('hidden', shouldHide);
            playerListContainer.classList.toggle('shift-up', shouldHide);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ANIMATION HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function easePopBounce(t) {
            if (t >= 1) return 1;
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        function getPopScale(player) {
            if (!player.isPopping) return 1;
            const elapsed = performance.now() - player.popStartTime;
            const progress = Math.min(elapsed / player.popDuration, 1);
            const scale = easePopBounce(progress);
            if (progress >= 1) {
                player.isPopping = false;
                return 1;
            }
            return scale;
        }

        function getPlayerDisplayRadius(player) {
            const diff = player.targetRadius - player.displayRadius;
            if (Math.abs(diff) < 0.01) {
                player.displayRadius = player.targetRadius;
                return player.displayRadius;
            }
            const speed = 8.0;
            player.displayRadius += diff * Math.min(1, speed * 0.016);
            return player.displayRadius;
        }

        function updatePlayerAnimations() {
            state.players.forEach(p => {
                getPlayerDisplayRadius(p);
                if (p.isPulsing) {
                    const elapsed = (performance.now() - p.pulseStartTime) / 1000;
                    if (elapsed > 0.6) {
                        p.isPulsing = false;
                        p.pulseTime = 0;
                    } else {
                        p.pulseTime = elapsed;
                    }
                }
            });
        }

        function triggerPulse(player) {
            player.isPulsing = true;
            player.pulseStartTime = performance.now();
            player.pulseTime = 0;
            haptic('light');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ANIMATED BALANCE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let balanceAnimInterval = null;

        function animateBalanceTo(target) {
            const current = parseInt(balanceEl.textContent) || 0;
            if (current === target) {
                balanceEl.textContent = target;
                return;
            }
            const diff = target - current;
            const steps = Math.min(Math.abs(diff), 40);
            const stepSize = diff / steps;
            let step = 0;

            if (balanceAnimInterval) {
                clearInterval(balanceAnimInterval);
                balanceAnimInterval = null;
            }

            balanceAnimInterval = setInterval(() => {
                step++;
                const newVal = Math.round(current + stepSize * step);
                if (step >= steps || Math.abs(newVal - target) < 1) {
                    balanceEl.textContent = target;
                    clearInterval(balanceAnimInterval);
                    balanceAnimInterval = null;
                } else {
                    balanceEl.textContent = newVal;
                }
            }, 25);
        }

        function updateBalance() {
            const target = Math.floor(state.balance);
            pBalance.textContent = target;
            animateBalanceTo(target);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // VICTORY SOUND
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let audioCtx = null;
        let victorySoundPlaying = false;

        function playVictorySound() {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (victorySoundPlaying) return;
                victorySoundPlaying = true;

                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                const durations = [0.12, 0.12, 0.12, 0.2];
                const startTimes = [0, 0.14, 0.28, 0.45];

                for (let i = 0; i < notes.length; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[i], now + startTimes[i]);
                    gain.gain.setValueAtTime(0.18, now + startTimes[i]);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + startTimes[i] + durations[i]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + startTimes[i]);
                    osc.stop(now + startTimes[i] + durations[i]);
                }

                setTimeout(() => {
                    victorySoundPlaying = false;
                }, 800);
            } catch (e) {
                console.log('Audio not available');
                victorySoundPlaying = false;
            }
        }

        function stopVictorySound() {
            victorySoundPlaying = false;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BET OVERLAY COLLAPSE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let betCollapsed = false;

        betToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            betCollapsed = !betCollapsed;
            betOverlay.classList.toggle('collapsed', betCollapsed);
            if (betCollapsed) {
                this.innerHTML = '<span class="bet-toggle-text">bet</span>';
            } else {
                this.innerHTML = '<span class="bet-toggle-text">bet</span>';
            }
            haptic('light');
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ADD BOT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        addBotBtn.addEventListener('click', function() {
            if (state.gameState === 'playing' || state.gameState === 'finished') return;
            const botName = 'Bot' + (state.players.filter(p => p.id.startsWith('bot_')).length + 1);
            const bet = Math.floor(Math.random() * 40) + 10;
            const botPfp = 'https://i.pravatar.cc/150?img=' + (Math.floor(Math.random() * 70) + 1);
            const bot = makePlayer('bot_' + Date.now(), bet, botName, botPfp);
            state.pot += bet;
            state.botSpawned = true;
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            updatePlayerList();
            updateFrogVisibility();
            haptic('medium');
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BOT AI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const BOT_NAME = 'Bot';

        function spawnBot() {
            if (!state.botEnabled || state.botSpawned) return;
            if (state.gameState === 'playing' || state.gameState === 'finished') return;
            if (state.players.some(p => p.id.startsWith('bot_'))) return;
            if (state.players.length >= state.maxPlayers) return;
            const bet = Math.floor(Math.random() * 30) + 10;
            const botPfp = 'https://i.pravatar.cc/150?img=' + (Math.floor(Math.random() * 70) + 1);
            const bot = makePlayer('bot_' + Date.now(), bet, BOT_NAME, botPfp);
            state.pot += bet;
            state.botSpawned = true;
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            updatePlayerList();
            updateBetOverlayVisibility();
            updateFrogVisibility();
            haptic('light');
        }

        function botAI(dt) {
            const bot = state.players.find(p => p.id.startsWith('bot_'));
            if (!bot || !bot.alive || state.gameState !== 'playing') return;
            bot.vx += (Math.random() - 0.5) * 1.2 * dt;
            bot.vy += (Math.random() - 0.5) * 1.2 * dt;
            const maxSp = speedForRadius(bot.displayRadius || bot.radius);
            const sp = Math.sqrt(bot.vx * bot.vx + bot.vy * bot.vy);
            if (sp > maxSp) {
                bot.vx = (bot.vx / sp) * maxSp;
                bot.vy = (bot.vy / sp) * maxSp;
            }
            if (sp < 3.0 && sp > 0.01) {
                const ratio = 3.0 / sp;
                bot.vx *= ratio;
                bot.vy *= ratio;
            }
        }

        function speedForRadius(radius) {
            const minR = 14,
                maxR = 52;
            const norm = Math.min(1, Math.max(0, (radius - minR) / (maxR - minR)));
            const speed = 6.0 - norm * 3.0;
            return Math.max(3.0, Math.min(6.0, speed));
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOGIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function startCountdown() {
            if (state.gameState !== 'idle') return;
            if (getAlive().length < 2) return;
            state.gameState = 'countdown';
            state.countdown = 3.0;
            state.countdownStartTime = performance.now();
            waitingText.style.display = 'none';
            frogGif.classList.remove('show');
            countdownTimer.style.display = 'block';
            haptic('heavy');
            updateBetUI();
            updateBetOverlayVisibility();
        }

        function startPrestart() {
            state.gameState = 'prestart';
            state.prestartTimer = 2.0;
            countdownTimer.textContent = 'GO!';
            haptic('heavy');
            updateBetOverlayVisibility();
        }

        function startGame() {
            state.gameState = 'playing';
            state.gameTime = 0;
            state.openingTimer = 0;
            state.opening = null;
            state.winnerId = null;
            waitingText.style.display = 'none';
            countdownTimer.style.display = 'none';
            updateBetOverlayVisibility();

            const alive = getAlive();
            const half = state.arenaSize / 2;
            alive.forEach((p, i) => {
                const angle = (i / alive.length) * Math.PI * 2 + Math.random() * 0.3;
                const baseSpeed = speedForRadius(p.displayRadius || p.radius);
                const speed = baseSpeed * (0.9 + Math.random() * 0.2);
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.x = half + Math.cos(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.y = half + Math.sin(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.alive = true;
                p.isPopping = false;
            });
            state.openingTimer = 3.5 + Math.random() * 2.5;
            updatePlayerList();
        }

        function endGame(winnerId) {
            if (state.gameState === 'finished') return;
            state.gameState = 'finished';
            state.winnerId = winnerId;
            const winner = getPlayer(winnerId);

            if (winner) {
                const totalPot = state.pot;
                const winnerBet = winner.bet;
                const losersBets = totalPot - winnerBet;
                const commission = Math.floor(losersBets * 0.02);
                const winnings = totalPot - commission;

                if (winner.id === state.userId) {
                    state.balance += winnings;
                    state.wins++;
                    playVictorySound();
                } else {
                    state.losses++;
                }
                updateBalance();
                updateProfile();
                updateTopUI();

                addWinToHistory(winner.name, winner.pfp);

                const randomGif = WIN_GIFS[Math.floor(Math.random() * WIN_GIFS.length)];
                winGif.src = randomGif;
                winAvatar.src = winner.pfp;
                winName.textContent = winner.name + ' wins!';
                winMultiplier.textContent = 'x' + (winnings / winnerBet).toFixed(1);

                winPanel.classList.add('show');
                haptic('heavy');

                state.pot = 0;
                state.opening = null;
                updatePlayerList();
                updateBetOverlayVisibility();

                if (window.winTimeout) clearTimeout(window.winTimeout);
                window.winTimeout = setTimeout(() => {
                    hideWinPanelAndReset();
                }, 3000);

            } else {
                state.gameState = 'idle';
                state.players = [];
                state.botSpawned = false;
                state.opening = null;
                waitingText.style.display = 'block';
                countdownTimer.style.display = 'none';
                updateWaitingText();
                updateBetUI();
                updateStatsBar();
                updatePlayerList();
                updateBetOverlayVisibility();
                updateFrogVisibility();
            }
        }

        function hideWinPanelAndReset() {
            winPanel.classList.remove('show');
            stopVictorySound();
            if (window.winTimeout) {
                clearTimeout(window.winTimeout);
                window.winTimeout = null;
            }
            state.players = [];
            state.gameState = 'idle';
            state.botSpawned = false;
            state.opening = null;
            state.pot = 0;
            waitingText.style.display = 'block';
            countdownTimer.style.display = 'none';
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            updatePlayerList();
            updateBetOverlayVisibility();
            updateFrogVisibility();
            if (state.botEnabled) spawnBot();
        }

        winContinueBtn.addEventListener('click', () => {
            hideWinPanelAndReset();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PHYSICS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updatePhysics(dt) {
            if (state.gameState !== 'playing') return;
            state.gameTime += dt;

            const alive = getAlive();
            if (alive.length <= 1) {
                if (alive.length === 1) endGame(alive[0].id);
                else {
                    state.gameState = 'idle';
                    state.players = [];
                    state.botSpawned = false;
                    state.opening = null;
                    waitingText.style.display = 'block';
                    countdownTimer.style.display = 'none';
                    updateWaitingText();
                    updateBetUI();
                    updateStatsBar();
                    updatePlayerList();
                    updateBetOverlayVisibility();
                    updateFrogVisibility();
                }
                return;
            }

            const size = state.arenaSize;
            const pts = state.perimeterPoints;
            const totalPts = pts.length;
            const half = size / 2;

            state.openingTimer -= dt;
            if (state.openingTimer <= 0) {
                if (!state.opening) {
                    const gameTime = state.gameTime;
                    let minGap, maxGap;
                    if (gameTime < 4) {
                        minGap = 0.08;
                        maxGap = 0.18;
                    } else {
                        minGap = 0.15;
                        maxGap = 0.35;
                    }
                    const gapSize = Math.floor((minGap + Math.random() * (maxGap - minGap)) * totalPts);
                    const startIdx = Math.floor(Math.random() * totalPts);
                    const endIdx = (startIdx + gapSize) % totalPts;
                    state.opening = {
                        startIdx: startIdx,
                        endIdx: endIdx,
                        flashCount: 0,
                        flashTimer: 0,
                        state: 'flashing',
                        _total: totalPts,
                    };
                    state.openingTimer = 3.5 + Math.random() * 2.5;
                    haptic('light');
                } else {
                    state.opening = null;
                    state.openingTimer = 1.5 + Math.random() * 2.0;
                }
            }

            const opening = state.opening;
            if (opening && opening.state === 'flashing') {
                opening.flashTimer += dt;
                if (opening.flashTimer > 0.25) {
                    opening.flashTimer = 0;
                    opening.flashCount++;
                    if (opening.flashCount >= 4) {
                        opening.state = 'open';
                        haptic('medium');
                    }
                }
            }

            function isInGap(idx) {
                if (!opening) return false;
                if (opening.state !== 'open') return false;
                const start = opening.startIdx;
                const end = opening.endIdx;
                if (start < end) {
                    return idx >= start && idx <= end;
                } else {
                    return idx >= start || idx <= end;
                }
            }

            const subSteps = 6;
            const subDt = dt / subSteps;

            for (let step = 0; step < subSteps; step++) {
                alive.forEach(p => {
                    p.x += p.vx * subDt * 60;
                    p.y += p.vy * subDt * 60;

                    const radius = p.displayRadius || p.radius;
                    for (let i = 0; i < totalPts; i++) {
                        const j = (i + 1) % totalPts;
                        if (opening && opening.state === 'open' && isInGap(i) && isInGap(j)) continue;
                        const ax = pts[i].x,
                            ay = pts[i].y;
                        const bx = pts[j].x,
                            by = pts[j].y;
                        const dx = bx - ax,
                            dy = by - ay;
                        const lenSq = dx * dx + dy * dy;
                        if (lenSq === 0) continue;
                        let t = ((p.x - ax) * dx + (p.y - ay) * dy) / lenSq;
                        t = Math.max(0, Math.min(1, t));
                        const nearX = ax + t * dx;
                        const nearY = ay + t * dy;
                        const distX = p.x - nearX;
                        const distY = p.y - nearY;
                        const dist = Math.sqrt(distX * distX + distY * distY);
                        if (dist < radius) {
                            const nx = distX / dist;
                            const ny = distY / dist;
                            const overlap = radius - dist;
                            p.x += nx * overlap;
                            p.y += ny * overlap;
                            const vn = p.vx * nx + p.vy * ny;
                            if (vn < 0) {
                                p.vx -= 2 * vn * nx;
                                p.vy -= 2 * vn * ny;
                            }
                            break;
                        }
                    }

                    if (opening && opening.state === 'open') {
                        const cx = half,
                            cy = half;
                        const dx = p.x - cx,
                            dy = p.y - cy;
                        const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                        const escapeThreshold = half * 1.12 + radius;
                        if (distFromCenter > escapeThreshold) {
                            let nearestGapIdx = -1;
                            let minDist = Infinity;
                            for (let i = 0; i < totalPts; i++) {
                                if (isInGap(i)) {
                                    const d = (p.x - pts[i].x) ** 2 + (p.y - pts[i].y) ** 2;
                                    if (d < minDist) {
                                        minDist = d;
                                        nearestGapIdx = i;
                                    }
                                }
                            }
                            if (nearestGapIdx >= 0) {
                                const angle = Math.atan2(dy, dx);
                                const gapAngle = Math.atan2(pts[nearestGapIdx].y - cy, pts[nearestGapIdx].x - cx);
                                let diff = Math.abs(angle - gapAngle);
                                diff = Math.min(diff, 2 * Math.PI - diff);
                                const vOut = p.vx * dx + p.vy * dy;
                                if (diff < 0.8 && vOut > 0) {
                                    p.alive = false;
                                    haptic('medium');
                                    updatePlayerList();
                                    return;
                                }
                            }
                        }
                    }
                });

                for (let i = 0; i < alive.length; i++) {
                    for (let j = i + 1; j < alive.length; j++) {
                        const a = alive[i],
                            b = alive[j];
                        const dx = b.x - a.x,
                            dy = b.y - a.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const rA = a.displayRadius || a.radius;
                        const rB = b.displayRadius || b.radius;
                        const minDist = rA + rB;
                        if (dist < minDist && dist > 0.001) {
                            haptic('light');
                            const nx = dx / dist,
                                ny = dy / dist;
                            const overlap = (minDist - dist) * 0.5;
                            a.x -= nx * overlap;
                            a.y -= ny * overlap;
                            b.x += nx * overlap;
                            b.y += ny * overlap;

                            const dvx = a.vx - b.vx,
                                dvy = a.vy - b.vy;
                            const dvn = dvx * nx + dvy * ny;
                            if (dvn > 0) {
                                const totalMass = a.mass + b.mass;
                                const impulse = 2 * dvn / (1 / a.mass + 1 / b.mass);
                                const aFactor = 1 - (a.mass / totalMass) * 0.6;
                                const bFactor = 1 - (b.mass / totalMass) * 0.6;
                                a.vx -= (impulse / a.mass) * aFactor * nx;
                                a.vy -= (impulse / a.mass) * aFactor * ny;
                                b.vx += (impulse / b.mass) * bFactor * nx;
                                b.vy += (impulse / b.mass) * bFactor * ny;
                            }
                        }
                    }
                }

                alive.forEach(p => {
                    const maxSp = speedForRadius(p.displayRadius || p.radius);
                    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (sp > maxSp) {
                        p.vx = (p.vx / sp) * maxSp;
                        p.vy = (p.vy / sp) * maxSp;
                    }
                    const minSp = 3.0;
                    if (sp < minSp && sp > 0.01) {
                        const ratio = minSp / sp;
                        p.vx *= ratio;
                        p.vy *= ratio;
                    }
                });
            }

            botAI(dt);
            updatePlayerList();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER – always uses PFP images (default avatar as fallback)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            const w = state.arenaSize;
            const half = w / 2;
            ctx.clearRect(0, 0, w, w);

            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            const pts = state.perimeterPoints;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#1a1a1e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#28282e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            const opening = state.opening;
            const isFlashing = opening && opening.state === 'flashing';
            const isOpen = opening && opening.state === 'open';
            const total = pts.length;

            ctx.save();
            const hasGap = opening !== null && (isFlashing || isOpen);

            if (hasGap) {
                const start = opening.startIdx;
                const end = opening.endIdx;

                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;

                for (let i = 0; i < total; i++) {
                    const j = (i + 1) % total;
                    let inGap = false;
                    if (start < end) {
                        if (i >= start && i < end) inGap = true;
                        if (j >= start && j < end) inGap = true;
                    } else {
                        if (i >= start || i < end) inGap = true;
                        if (j >= start || j < end) inGap = true;
                    }
                    if (inGap) continue;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }

                if (isFlashing) {
                    const isRed = (opening.flashCount % 2 === 0);
                    ctx.save();
                    const flashColor = isRed ? '#ff0044' : 'rgba(160,160,176,0.25)';

                    let gapSegments = [];
                    if (start < end) {
                        for (let i = start; i < end; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                    } else {
                        for (let i = start; i < total; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                        for (let i = 0; i < end; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                    }

                    ctx.strokeStyle = flashColor;
                    ctx.lineWidth = isRed ? 5 : 3;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';

                    for (const seg of gapSegments) {
                        ctx.beginPath();
                        ctx.moveTo(pts[seg.i].x, pts[seg.i].y);
                        ctx.lineTo(pts[seg.j].x, pts[seg.j].y);
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            } else {
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();

            // ── DRAW PLAYERS – always use PFP images ──
            state.players.forEach(p => {
                if (!p.alive) return;
                const popScale = getPopScale(p);
                const radius = p.displayRadius || p.radius;
                const displayRadius = radius * popScale;

                let pulseScale = 1;
                if (p.isPulsing) {
                    const t = p.pulseTime;
                    if (t < 0.6) {
                        const phase = t / 0.6;
                        pulseScale = 1 + 0.12 * Math.sin(phase * Math.PI * 3) * (1 - phase);
                    }
                }
                const finalRadius = displayRadius * pulseScale;

                ctx.save();

                // Determine image to draw: player's PFP or default avatar
                let imgToDraw = null;
                if (p.pfpLoaded && p.pfpImg && p.pfpImg.naturalWidth > 0) {
                    imgToDraw = p.pfpImg;
                } else if (defaultAvatarImg && defaultAvatarImg.naturalWidth > 0) {
                    imgToDraw = defaultAvatarImg;
                }

                // Draw circle with image
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(finalRadius - 1, 1), 0, Math.PI * 2);
                ctx.closePath();

                // Clip to circle and draw image
                ctx.save();
                ctx.clip();

                if (imgToDraw) {
                    const drawSize = Math.max(finalRadius - 1, 1) * 2;
                    ctx.drawImage(imgToDraw, p.x - (finalRadius - 1), p.y - (finalRadius - 1), drawSize, drawSize);
                } else {
                    // Ultimate fallback: a dark circle (should not happen if default loads)
                    ctx.fillStyle = '#333';
                    ctx.fill();
                }
                ctx.restore();

                // Outline with a cool gold-tinted glow
                ctx.shadowColor = 'rgba(200,168,78,0.3)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, finalRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200,168,78,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // "You" ring
                if (p.id === state.userId) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, finalRadius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(76, 175, 80, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.restore();
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // UI UPDATES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateProfile() {
            pWins.textContent = state.wins;
            pLosses.textContent = state.losses;
            const total = state.wins + state.losses;
            pWinrate.textContent = total > 0 ? Math.round((state.wins / total) * 100) + '%' : '0%';
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            if (state.pfp) profilePfp.src = state.pfp;
            updateBalance();
        }

        function updateStatsBar() {
            const alive = getAlive();
            statsPlayers.textContent = alive.length;
            statsPot.textContent = state.pot;
        }

        function updateWaitingText() {
            const alive = getAlive();
            if (alive.length === 0) {
                waitingText.innerHTML = '<span>waiting for players</span><div class="sub">place a bet to join</div>';
            } else {
                waitingText.innerHTML =
                    `<span>● ${alive.length} player${alive.length > 1 ? 's' : ''} ready</span><div class="sub">need ${Math.max(0, 2 - alive.length)} more to start</div>`;
            }
            updateFrogVisibility();
        }

        function updateBetUI() {
            const existing = state.players.find(p => p.id === state.userId);
            const inGame = !!existing;
            const canBet = (state.gameState === 'idle' || state.gameState === 'countdown' || state.gameState ===
                'prestart');

            if (canBet) {
                betBtn.textContent = inGame ? 'increase' : 'join';
                betBtn.disabled = false;
                betInput.disabled = false;
            } else {
                betBtn.textContent = inGame ? 'in game' : 'waiting';
                betBtn.disabled = true;
                betInput.disabled = true;
            }

            if (existing) {
                currentBetDisplay.textContent = existing.bet;
            } else {
                currentBetDisplay.textContent = '0';
            }

            const val = parseInt(betInput.value) || 10;
            betAmountDisplay.textContent = Math.min(val, state.balance);
            if (betInput.value === '' || parseInt(betInput.value) < 10) {
                betInput.value = 10;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TAB SWITCHING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function switchTab(tabId) {
            if (state.currentTab === tabId) return;
            const oldTab = state.currentTab;
            state.currentTab = tabId;

            const oldEl = tabPages[oldTab];
            if (oldEl) {
                oldEl.classList.remove('active');
                oldEl.classList.add('exit');
                setTimeout(() => {
                    oldEl.classList.remove('exit');
                }, 350);
            }

            const newEl = tabPages[tabId];
            if (newEl) {
                setTimeout(() => {
                    newEl.classList.add('active');
                    if (tabId === 'profile') updateProfile();
                    if (tabId === 'top') updateTopUI();
                }, 50);
            }

            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });

            haptic('light');
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const tab = this.dataset.tab;
                switchTab(tab);
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RELOAD PFP (test button)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        reloadPfpBtn.addEventListener('click', function() {
            // Force reload user's PFP
            const user = state.players.find(p => p.id === state.userId);
            if (user) {
                // Clear cache and reload
                const src = user.pfp;
                if (pfpCache.has(src)) {
                    pfpCache.delete(src);
                }
                loadPFP(src).then(img => {
                    if (img && img.naturalWidth > 0) {
                        user.pfpLoaded = true;
                        user.pfpImg = img;
                    } else {
                        user.pfpLoaded = false;
                        user.pfpImg = null;
                    }
                    updatePlayerList();
                    haptic('medium');
                });
            } else {
                // If not in game, just reload profile avatar
                if (state.pfp) {
                    const src = state.pfp;
                    if (pfpCache.has(src)) {
                        pfpCache.delete(src);
                    }
                    loadPFP(src).then(img => {
                        if (img && img.naturalWidth > 0) {
                            profilePfp.src = src;
                        } else {
                            profilePfp.src = state.defaultAvatar;
                        }
                        haptic('medium');
                    });
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let lastTime = 0;
        let accumulator = 0;
        const fixedTimestep = 1 / 60;

        function gameLoop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            updatePlayerAnimations();

            if (state.gameState === 'playing') {
                accumulator += dt;
                while (accumulator >= fixedTimestep) {
                    updatePhysics(fixedTimestep);
                    accumulator -= fixedTimestep;
                }
            }

            if (state.gameState === 'countdown') {
                const elapsed = (performance.now() - state.countdownStartTime) / 1000;
                let remaining = Math.max(0, 3.0 - elapsed);
                if (remaining <= 0) {
                    startPrestart();
                } else {
                    const secs = Math.floor(remaining);
                    const ms = Math.floor((remaining - secs) * 100);
                    countdownTimer.textContent = secs + '.' + String(ms).padStart(2, '0');
                }
            }

            if (state.gameState === 'prestart') {
                state.prestartTimer -= dt;
                if (state.prestartTimer <= 0) {
                    startGame();
                } else {
                    countdownTimer.textContent = 'GO!';
                }
            }

            if (state.gameState === 'idle') {
                if (!state.botSpawned && state.players.length === 0) {
                    setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
                }
                if (getAlive().length >= 2) startCountdown();
                updateBetOverlayVisibility();
                updateFrogVisibility();
            }

            updateStatsBar();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getPlayer(id) { return state.players.find(p => p.id === id); }

        function getAlive() { return state.players.filter(p => p.alive); }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        betBtn.addEventListener('click', () => {
            if (state.gameState !== 'idle' && state.gameState !== 'countdown' && state.gameState !== 'prestart')
                return;
            let addAmount = parseInt(betInput.value) || 10;
            if (addAmount < 10) { betInput.value = 10;
                addAmount = 10;
                haptic('light'); }
            if (addAmount > state.balance) { betInput.value = state.balance;
                addAmount = state.balance;
                haptic('light'); }

            const existing = state.players.find(p => p.id === state.userId);
            if (existing) {
                state.balance -= addAmount;
                existing.bet += addAmount;
                state.pot += addAmount;
                computeRadii();
                triggerPulse(existing);
                updateBalance();
                updateBetUI();
                updateProfile();
                updatePlayerList();
                haptic('medium');
            } else {
                if (addAmount > state.balance) { betInput.value = state.balance;
                    addAmount = state.balance;
                    haptic('light'); }
                const player = makePlayer(state.userId, addAmount, state.username, state.pfp);
                state.balance -= addAmount;
                state.pot += addAmount;
                updateBalance();
                updateBetUI();
                updateWaitingText();
                updateProfile();
                updatePlayerList();
                haptic('medium');
                if (!state.botSpawned && state.botEnabled) {
                    setTimeout(() => { if (state.botEnabled && (state.gameState === 'idle' || state.gameState ===
                            'countdown' || state.gameState === 'prestart')) spawnBot(); }, 400);
                }
            }
            betInput.value = 10;
            updateBetUI();
        });

        betInput.addEventListener('input', () => {
            let val = parseInt(betInput.value) || 0;
            if (val < 10) betInput.value = 10;
            if (val > state.balance) betInput.value = state.balance;
            betAmountDisplay.textContent = (parseInt(betInput.value) || 10);
            if (betInput.value === '' || parseInt(betInput.value) < 10) betInput.value = 10;
        });

        betInput.value = 10;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            // Preload default avatar
            loadPFP(state.defaultAvatar).then(img => {
                defaultAvatarImg = img;
            });

            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                state.username = u.username || u.first_name || 'player';
                state.userId = u.id?.toString() || state.userId;
                state.pfp = u.photo_url || '';
                if (state.pfp) {
                    try { new URL(state.pfp); } catch (_) { state.pfp = ''; }
                }
            } else {
                state.username = 'test_user';
                state.pfp = 'https://i.pravatar.cc/100?img=69';
            }
            usernameDisplay.textContent = '@' + state.username;

            // Set profile PFP
            const profilePfpSrc = state.pfp || state.defaultAvatar;
            profilePfp.src = profilePfpSrc;
            if (state.pfp) {
                loadPFP(state.pfp).then(img => {
                    if (img && img.naturalWidth > 0) {
                        profilePfp.src = state.pfp;
                    } else {
                        profilePfp.src = state.defaultAvatar;
                    }
                });
            } else {
                profilePfp.src = state.defaultAvatar;
            }

            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            updateBalance();
            updateProfile();
            state.topPlayers = generateTopPlayers();
            updateTopUI();
            updateWinHistoryUI();
            updateFrogVisibility();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
            Object.keys(tabPages).forEach(key => {
                tabPages[key].classList.toggle('active', key === 'pvp');
            });
            document.getElementById('tabs').style.pointerEvents = 'auto';
            tabBtns.forEach(b => b.style.pointerEvents = 'auto');
            requestAnimationFrame(gameLoop);
            statusDot.className = 'online';
        }
        init();

        window.__state = state;
        console.log('◆ dllump – PFP images always used, cool gold outline added, reload button available.');
    </script>
</body>
</html>

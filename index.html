    <!-- ─── Complete HTML (same as before, unchanged) ────────────── -->
    <div id="app">...</div>
    <script src="..."></script>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // FULL CLIENT LOGIC – adapted for 2D rectangles
        // ═══════════════════════════════════════════════════════════════

        // ─── CONFIG ──────────────────────────────────────────────────
        const SERVER_URL = 'https://dllump-production.up.railway.app';
        // ... (same WIN_GIFS, PRIZE_GIFS, DIAMOND_GIF, etc.) ...

        // ─── STATE ──────────────────────────────────────────────────
        const state = { /* unchanged */ };
        let SERVER_ARENA_SIZE = 400;
        const VISUAL_RADIUS_SCALE = 0.75;

        // ─── ICE STATE ──────────────────────────────────────────────
        const iceState = {
            gameState: 'idle',
            players: [],          // each player: { id, name, pfp, bet, color, x1, y1, x2, y2, pfpImg }
            pot: 0,
            arenaSize: 0,
            perimeterPoints: [],
            cornerRadius: 0,
            countdownStartTime: 0,
            spinStartTime: 0,
            spinDuration: 0,
            spinFinalAngle: 0,
            puck: { x: 200, y: 200 },
            winnerId: null,
            winHistory: [],
            puckScale: 1,
            puckPopStart: 0,
            puckVisible: false,
            pfpPop: new Map(),
            slideStartTime: 0,
            zoom: 1,
            zoomTarget: 1,
            zoomStartTime: 0,
            zoomDuration: 2.0,
            isZoomingIn: false,
            isZoomingOut: false,
            zoomLocked: false,
            zoomOutTriggered: false,
        };

        // ─── ICE STATE APPLICATION ─────────────────────────────────
        function applyIceServerState(snapshot) {
            const prevGameState = iceState.gameState;
            iceState.gameState = snapshot.gameState;
            iceState.pot = snapshot.pot;
            iceState.countdownStartTime = snapshot.countdownStartTime;
            iceState.spinStartTime = snapshot.spinStartTime;
            iceState.spinDuration = snapshot.spinDuration;
            iceState.spinFinalAngle = snapshot.spinFinalAngle;
            iceState.puck.x = snapshot.puck.x;
            iceState.puck.y = snapshot.puck.y;

            // ... (same zoom logic, game state transitions as before) ...

            // ─── UPDATE PLAYERS ────────────────────────────────────
            const seen = new Set();
            snapshot.players.forEach(sp => {
                seen.add(sp.id);
                let local = iceState.players.find(p => p.id === sp.id);
                if (!local) {
                    const colorIdx = iceState.players.length % state.colors.length;
                    local = {
                        id: sp.id,
                        name: sp.name,
                        pfp: sp.pfp,
                        pfpImg: generateDefaultAvatar(sp.name ? sp.name.charAt(0) : '?', colorIdx),
                        x1: sp.x1, y1: sp.y1, x2: sp.x2, y2: sp.y2,
                        color: sp.color,
                        bet: sp.bet,
                    };
                    iceState.players.push(local);
                    loadIcePlayerPFP(local);
                    iceState.pfpPop.set(sp.id, { startTime: performance.now(), duration: 400 });
                } else {
                    // If bet changed, pop PFP again
                    if (Math.abs(local.bet - sp.bet) > 5) {
                        iceState.pfpPop.set(sp.id, { startTime: performance.now(), duration: 400 });
                    }
                    local.x1 = sp.x1; local.y1 = sp.y1;
                    local.x2 = sp.x2; local.y2 = sp.y2;
                    local.color = sp.color;
                    local.bet = sp.bet;
                }
                local.name = sp.name;
            });
            iceState.players = iceState.players.filter(p => seen.has(p.id));

            // ... (rest of UI updates) ...
        }

        // ─── RENDER ICE ────────────────────────────────────────────
        function renderIce() {
            const w = iceState.arenaSize;
            if (!w || !iceState.perimeterPoints.length) return;
            const half = w / 2;
            const s = iceScaleFactor();

            // Clear, draw background, perimeter path (same as before)
            iceCtx.clearRect(0, 0, w, w);
            // ... (gradient, perimeterPath) ...

            // ─── ZOOM LOGIC (same as before) ──────────────────────
            // ... (zoomTx, zoomTy, zoomSc) ...

            iceCtx.save();
            iceCtx.translate(zoomTx, zoomTy);
            iceCtx.scale(zoomSc, zoomSc);

            // Draw rink base
            iceCtx.save();
            iceCtx.shadowColor = 'rgba(0,0,0,0.9)';
            iceCtx.shadowBlur = 30;
            iceCtx.fillStyle = 'rgba(20,28,38,0.85)';
            iceCtx.fill(perimeterPath);
            iceCtx.restore();

            // ─── DRAW PLAYER RECTANGLES ──────────────────────────
            iceCtx.save();
            iceCtx.clip(perimeterPath);
            const now = performance.now();

            iceState.players.forEach(p => {
                const x1 = p.x1 * s;
                const y1 = p.y1 * s;
                const x2 = p.x2 * s;
                const y2 = p.y2 * s;
                const segW = x2 - x1;
                const segH = y2 - y1;
                const isWinner = (iceState.gameState === 'finished' && iceState.winnerId === p.id);

                // Fill rectangle with player color
                const grad = iceCtx.createLinearGradient(x1, y1, x2, y2);
                grad.addColorStop(0, lightenColor(p.color, isWinner ? 70 : 40));
                grad.addColorStop(1, p.color);
                iceCtx.globalAlpha = isWinner ? 1 : 0.93;
                iceCtx.fillStyle = grad;
                iceCtx.fillRect(x1, y1, segW, segH);
                iceCtx.globalAlpha = 1;

                // Winner border
                if (isWinner) {
                    iceCtx.save();
                    iceCtx.strokeStyle = 'rgba(255,255,255,0.85)';
                    iceCtx.lineWidth = 3;
                    iceCtx.shadowColor = hexToRgba(p.color, 0.8);
                    iceCtx.shadowBlur = 16;
                    iceCtx.strokeRect(x1 + 1.5, y1 + 1.5, segW - 3, segH - 3);
                    iceCtx.restore();
                }

                // ─── PFP POP ──────────────────────────────────────
                const centerX = (x1 + x2) / 2;
                const centerY = (y1 + y2) / 2;
                const avatarR = Math.min(segW, segH) * 0.28;

                let pfpScale = 1;
                const popData = iceState.pfpPop.get(p.id);
                if (popData) {
                    const elapsed = (now - popData.startTime) / 1000;
                    const progress = Math.min(elapsed / (popData.duration / 1000), 1);
                    if (progress < 1) {
                        pfpScale = easeOutBack(progress);
                        pfpScale = Math.min(1.2, Math.max(0, pfpScale));
                    } else {
                        iceState.pfpPop.delete(p.id);
                    }
                }

                const drawR = avatarR * pfpScale;
                const cx = centerX;
                const cy = centerY;

                iceCtx.save();
                iceCtx.beginPath();
                iceCtx.arc(cx, cy, drawR, 0, Math.PI * 2);
                iceCtx.closePath();
                iceCtx.clip();
                if (p.pfpImg && p.pfpImg.complete && p.pfpImg.naturalWidth > 0) {
                    iceCtx.drawImage(p.pfpImg, cx - drawR, cy - drawR, drawR * 2, drawR * 2);
                } else {
                    iceCtx.fillStyle = p.color || '#555';
                    iceCtx.fillRect(cx - drawR, cy - drawR, drawR * 2, drawR * 2);
                }
                iceCtx.restore();

                // Avatar ring
                iceCtx.strokeStyle = 'rgba(255,255,255,0.6)';
                iceCtx.lineWidth = 1.5;
                iceCtx.beginPath();
                iceCtx.arc(cx, cy, avatarR, 0, Math.PI * 2);
                iceCtx.stroke();

                // Bet label below avatar
                iceCtx.fillStyle = '#fff';
                iceCtx.font = '600 11px system-ui, sans-serif';
                iceCtx.textAlign = 'center';
                iceCtx.textBaseline = 'middle';
                iceCtx.fillText(p.bet, cx, cy + avatarR + 16);

                // Divider lines (optional – you can remove if you prefer no borders)
                iceCtx.strokeStyle = 'rgba(255,255,255,0.15)';
                iceCtx.lineWidth = 2;
                iceCtx.beginPath();
                iceCtx.moveTo(x2, y1);
                iceCtx.lineTo(x2, y2);
                iceCtx.moveTo(x1, y2);
                iceCtx.lineTo(x2, y2);
                iceCtx.stroke();
            });

            iceCtx.restore();

            // ─── RINK BORDER ──────────────────────────────────────
            iceCtx.save();
            iceCtx.strokeStyle = 'rgba(160,190,220,0.35)';
            iceCtx.lineWidth = 4;
            iceCtx.stroke(perimeterPath);
            iceCtx.restore();

            // ─── SPINNING ARROW (unchanged) ──────────────────────
            // ... (same as before) ...

            // ─── PUCK (unchanged) ──────────────────────────────────
            // ... (same as before) ...

            iceCtx.restore(); // zoom transform
        }

        // ─── INIT ──────────────────────────────────────────────────
        // ... (unchanged) ...
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>dllump · bump arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* ─── LOADING SCREEN ────────────────────────────────────── */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #0e0e14 0%, #050507 100%);
            transition: opacity 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.9s ease;
            opacity: 1;
            visibility: visible;
            will-change: opacity;
            pointer-events: all;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading-screen::before {
            content: '';
            position: absolute;
            width: 70vmin;
            height: 70vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.07) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: orbPulse 4s ease-in-out infinite;
        }
        @keyframes orbPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }
        #grid-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        #loading-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: 4px;
            position: relative;
        }
        .load-square {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(26, 26, 34, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(0, 0, 0, 0.4);
            transform: scale(0) rotate(-6deg);
            opacity: 0;
            will-change: transform, opacity;
        }
        .load-square .gif-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.92;
        }
        .load-square::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 50%, rgba(0, 0, 0, 0.2) 100%);
            pointer-events: none;
            z-index: 1;
        }
        @keyframes squarePop {
            0%   { transform: scale(0) rotate(-6deg); opacity: 0; }
            60%  { transform: scale(1.10) rotate(1deg); opacity: 1; }
            80%  { transform: scale(0.95) rotate(-0.5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .load-square.pop {
            animation: squarePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .load-square.slide {
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-radius 0.6s ease,
                        box-shadow 0.6s ease,
                        opacity 0.5s ease;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8), 0 0 60px rgba(76,175,80,0.08);
            z-index: 5;
            opacity: 1;
        }
        #merged-square {
            position: absolute;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(26, 26, 34, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.9), 0 0 80px rgba(76, 175, 80, 0.08);
            transform: scale(0);
            opacity: 0;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.6s ease;
            pointer-events: none;
            will-change: transform, opacity;
        }
        #merged-square.show {
            transform: scale(1);
            opacity: 1;
        }
        #merged-square .gif-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #merged-square::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, transparent 50%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 1;
        }
        #pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(76, 175, 80, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 120%;
            height: 120%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #pulse-ring.pulse {
            animation: ringPulse 2.2s ease-in-out infinite;
            opacity: 1;
        }
        @keyframes ringPulse {
            0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; border-width: 1.5px; }
            50%  { transform: translate(-50%, -50%) scale(1.6); opacity: 0; border-width: 0.5px; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; border-width: 1.5px; }
        }
        #loading-text {
            margin-top: 36px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.30);
            z-index: 2;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: opacity 0.6s ease;
        }
        #loading-text .dots::after {
            content: '';
            animation: dotsAnim 1.4s steps(4, end) infinite;
            display: inline-block;
            width: 1.2em;
            text-align: left;
        }
        @keyframes dotsAnim {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
        #brand-mark {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 1;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        @media (max-width: 420px) {
            #grid-wrapper { width: 220px; height: 220px; }
            #loading-grid { gap: 6px; padding: 3px; }
            .load-square { border-radius: 14px; }
            .load-square::after { border-radius: 14px; }
            #merged-square { border-radius: 22px; }
            #merged-square::after { border-radius: 22px; }
            #loading-text { font-size: 12px; margin-top: 28px; }
        }
        @media (max-width: 340px) {
            #grid-wrapper { width: 170px; height: 170px; }
            #loading-grid { gap: 4px; padding: 2px; }
            .load-square { border-radius: 10px; }
            .load-square::after { border-radius: 10px; }
            #merged-square { border-radius: 16px; }
            #merged-square::after { border-radius: 16px; }
            #loading-text { font-size: 10px; margin-top: 20px; }
        }

        /* ─── APP STYLES ────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --bg: #08080a;
            --surface: #121214;
            --surface2: #1a1a1e;
            --surface3: #242428;
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.45);
            --text: #e8e8e8;
            --text2: #888;
            --border: #2a2a2e;
            --gold: #c8a84e;
            --gold-dim: rgba(200, 168, 78, 0.2);
            --red: #d45a5a;
            --green: #5ac88a;
            --radius: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #08080a;
            color: var(--text);
            touch-action: none;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: #08080a;
            background-image: url('https://i.postimg.cc/ncz4Kznn/photo-5202192649983563686-y.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }
        #app::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.70);
            z-index: 0;
            pointer-events: none;
        }
        #app>* { position: relative; z-index: 1; }

        /* ─── TOP BAR ───────────────────────────────────────────── */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px 6px 12px;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 40px;
            z-index: 10;
            gap: 6px;
        }
        #top-left { display: flex; align-items: center; gap: 6px; }
        #username-display {
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            transition: 0.3s;
        }
        #status-dot.offline {
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
        }
        #top-right { display: flex; align-items: center; gap: 6px; }
        #balance-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--surface2);
            padding: 2px 10px 2px 4px;
            border-radius: 28px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }
        #balance-wrap:active { transform: scale(0.94); }
        #diamond-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
            animation: glowDiamond 2.8s ease-in-out infinite;
        }
        @keyframes glowDiamond {
            0%,100% { filter: drop-shadow(0 0 6px rgba(200, 168, 78, 0.3)); }
            50% { filter: drop-shadow(0 0 24px rgba(200, 168, 78, 0.7)) brightness(1.2); }
        }
        #balance {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 36px;
        }

        /* ─── MAIN PAGES ────────────────────────────────────────── */
        #main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .tab-page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, visibility 0.35s ease;
            overflow: hidden;
            background: transparent;
            will-change: transform, opacity;
        }
        .tab-page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 2;
        }
        .tab-page.exit {
            opacity: 0;
            transform: translateX(-30px);
            z-index: 1;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s 0.3s;
        }

        /* ─── PVP ARENA ──────────────────────────────────────────── */
        #pvp-page {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #arena-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 10px 0 10px;
            min-height: 0;
            overflow: visible;
            flex-shrink: 0;
        }
        #game-canvas {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius);
            background: rgba(18, 18, 20, 0.60);
            backdrop-filter: blur(6px);
            touch-action: none;
            display: block;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 0 50px rgba(76,175,80,0.05);
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.04);
        }
        #frog-gif {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            width: 40%;
            max-width: 160px;
            aspect-ratio: 1/1;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            opacity: 0.9;
            display: none;
        }
        #frog-gif.show { display: block; }
        #timer-wrap {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            pointer-events: none;
            background: transparent;
            min-width: 50px;
        }
        #countdown-timer {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            line-height: 1;
            display: none;
            background: transparent;
            border: none;
            padding: 0;
        }
        #timer-progress-wrap {
            width: 44px;
            height: 3px;
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        #timer-progress-wrap.visible { display: block; }
        #timer-progress {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,255,255,0.25);
            transition: width 0.06s linear;
        }

        /* ─── WIN PANELS ────────────────────────────────────────── */
        .win-panel {
            position: absolute;
            top: 10px;
            background: rgba(18,18,22,0.80);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 12px 6px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
            font-size: 11px;
            color: var(--text2);
            min-height: 36px;
        }
        .win-panel.left { left: 10px; }
        .win-panel.right { right: 10px; }
        .win-panel .panel-label {
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0.6;
            margin-right: 4px;
            white-space: nowrap;
        }
        .win-panel .panel-content {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .win-panel .panel-pfp {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid var(--gold);
            object-fit: cover;
            flex-shrink: 0;
        }
        .win-panel .panel-amount {
            font-weight: 700;
            color: var(--gold);
            font-size: 13px;
            white-space: nowrap;
        }
        .win-panel .panel-amount.big { color: #fff; font-size: 15px; }

        #waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            pointer-events: none;
            z-index: 2;
            text-align: center;
            color: var(--text2);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
            text-shadow: 0 0 40px rgba(0,0,0,0.9);
            line-height: 1.6;
            display: block;
        }
        #waiting-text .sub {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 2px;
        }

        /* ─── BET OVERLAY ───────────────────────────────────────── */
        #bet-overlay-wrap {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 92%;
            max-width: 360px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #bet-overlay-wrap.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(20px);
        }
        #bet-overlay {
            background: rgba(18,18,22,0.96);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.3s;
            position: relative;
            background-image: url('https://i.postimg.cc/W4jSpS0k/photo-5210812881274873069-y.jpg');
            background-size: cover;
            background-position: center;
        }
        #bet-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            border-radius: 12px;
            z-index: 0;
            pointer-events: none;
        }
        #bet-overlay>* { position: relative; z-index: 1; }
        #bet-overlay.collapsed {
            padding: 6px 12px;
            gap: 4px;
            cursor: pointer;
            flex-direction: row;
            justify-content: center;
        }
        #bet-overlay.collapsed>*:not(.bet-toggle) { display: none; }
        #bet-overlay.collapsed .bet-toggle {
            display: flex;
            width: 100%;
            justify-content: center;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            gap: 6px;
            align-items: center;
        }
        .bet-toggle {
            display: none;
            cursor: pointer;
            user-select: none;
            background: none;
            border: none;
            color: var(--text2);
            font-size: 16px;
            padding: 2px 8px;
            transition: 0.2s;
            font-family: monospace;
        }
        .bet-toggle:active { opacity: 0.6; }
        #bet-overlay:not(.collapsed) .bet-toggle {
            display: flex;
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 16px;
            color: var(--text2);
            opacity: 0.6;
            padding: 2px;
            transform: rotate(0deg);
            z-index: 2;
        }
        #bet-overlay:not(.collapsed) .bet-toggle::before {
            content: '>';
            display: inline-block;
            transform: rotate(90deg);
        }
        #bet-overlay.collapsed .bet-toggle {
            display: flex;
            font-size: 14px;
            gap: 6px;
            color: var(--text2);
        }
        #bet-overlay.collapsed .bet-toggle span { font-size: 11px; opacity: 0.5; }
        #bet-overlay.collapsed .bet-toggle::before {
            content: '>';
            display: inline-block;
            transform: rotate(-90deg);
            margin-right: 4px;
        }
        #bet-overlay:not(.collapsed) .bet-toggle-text { display: none; }
        #bet-overlay.collapsed .bet-toggle-text { display: inline; }
        .bet-row {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            margin-top: 2px;
        }
        #bet-input {
            flex: 1;
            max-width: 120px;
            padding: 2px 6px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.10);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }
        #bet-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 24px var(--primary-glow);
        }
        #all-in-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 8px;
            border: none;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(200,168,78,0.3);
            flex-shrink: 0;
        }
        #all-in-btn:active { transform: scale(0.94); opacity: 0.8; }
        #bet-btn {
            padding: 2px 0;
            height: 26px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 24px var(--primary-glow);
            letter-spacing: 0.2px;
            width: 100%;
            text-align: center;
            margin-top: 2px;
        }
        #bet-btn:active { transform: scale(0.96); opacity: 0.8; }
        #bet-btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        #current-bet-display {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-align: center;
            margin-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 4px;
        }
        #current-bet-display span { color: var(--gold); font-weight: 700; }
        #bet-overlay.collapsed #current-bet-display,
        #bet-overlay.collapsed .bet-row,
        #bet-overlay.collapsed #bet-btn { display: none; }

        /* ─── AUTO-BET ──────────────────────────────────────────── */
        .auto-bet-container {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .auto-bet-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;

        #card-overlay {

            inset: 0;
            z-index: 99998;

            align-items: center;

        /* ─── 3D IDENTITY CARD OVERLAY ──────────────────────────── */

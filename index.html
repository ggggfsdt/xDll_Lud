                    <div class="profile-name" id="profile-name">Player</div>
                    <div class="profile-username" id="profile-username">@username</div>
                    <div class="profile-status" id="profile-status">online</div>
                    <div class="profile-divider"></div>
                    <div class="profile-stats">
                        <div class="stat-item"><div class="num win" id="p-wins">0</div><div class="lbl">wins</div></div>
                        <div class="stat-item"><div class="num loss" id="p-losses">0</div><div class="lbl">losses</div></div>
                        <div class="stat-item"><div class="num rate" id="p-winrate">0%</div><div class="lbl">winrate</div></div>
                    </div>
                    <div class="profile-divider"></div>
                    <div style="font-size:13px;color:var(--text2);opacity:0.6;margin-top:2px;">balance: <span id="p-balance" style="color:var(--gold);font-weight:700;">1000</span></div>
                </div>
            </div>
            <div id="top-page" class="tab-page">
                <div id="podium"></div>
                <div id="top-list"></div>
            </div>
        </div>
        <div id="tabs">
            <button class="tab-btn active" data-tab="pvp">
                <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"/><line x1="20" y1="20" x2="4" y2="4"/><line x1="3" y1="3" x2="7" y2="7"/><line x1="17" y1="17" x2="21" y2="21"/><path d="M6 18 L9 15"/><path d="M18 6 L15 9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></span>PvP</button>
            <button class="tab-btn" data-tab="profile">
                <span class="tab-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="8" r="5"/><path d="M4 20 L4 18 C4 14 7 12 12 12 C17 12 20 14 20 18 L20 20"/></svg></span>Profile</button>
            <button class="tab-btn" data-tab="top">
                <span class="tab-icon" style="display:inline-block;transform:rotate(180deg);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15 L8 21 L12 19 L16 21 L12 15 Z"/><circle cx="12" cy="9" r="6"/><circle cx="12" cy="9" r="3" fill="currentColor"/></svg></span>Top</button>
        </div>
    </div>

    <script>
        // ─── TELEGRAM SETUP ───
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand();
            tg.enableClosingConfirmation(); }

        function haptic(style = 'light') {
            try {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
                else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
            } catch (_) {}
        }

        // ─── STATE ───
        const state = {
            balance: 1000,
            username: 'player',
            userId: null,
            pfp: '',
            wins: 0,
            losses: 0,
            game: null, // server game state
            myPlayer: null,
            arenaSize: 0,
            cornerRadius: 0,
            perimeterPoints: [],
            colors: ['#5b8def', '#50c890', '#e06060', '#d4af37', '#c084e0', '#f0a070', '#60c0d0', '#e8a0a0'],
            defaultAvatar: 'https://i.pravatar.cc/150?img=0',
            winHistory: [],
        };

        // ─── DOM REFS ───
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const balanceEl = document.getElementById('balance');
        const usernameDisplay = document.getElementById('username-display');
        const statusDot = document.getElementById('status-dot');
        const waitingText = document.getElementById('waiting-text');
        const frogGif = document.getElementById('frog-gif');
        const betOverlayWrap = document.getElementById('bet-overlay-wrap');
        const betOverlay = document.getElementById('bet-overlay');
        const betToggleBtn = document.getElementById('bet-toggle-btn');
        const betInput = document.getElementById('bet-input');
        const betBtn = document.getElementById('bet-btn');
        const betAmountDisplay = document.getElementById('bet-amount-display');
        const currentBetDisplay = document.getElementById('current-bet-value');
        const countdownTimer = document.getElementById('countdown-timer');
        const statsPlayers = document.getElementById('stats-players');
        const statsPot = document.getElementById('stats-pot');
        const playerListContainer = document.getElementById('player-list-container');
        const winHistoryEl = document.getElementById('win-history');
        const winPanel = document.getElementById('win-panel');
        const winGif = document.getElementById('win-gif');
        const winAvatar = document.getElementById('win-avatar');
        const winName = document.getElementById('win-name');
        const winMultiplier = document.getElementById('win-multiplier');
        const winContinueBtn = document.getElementById('win-continue-btn');
        const profilePfp = document.getElementById('profile-pfp');
        const profileName = document.getElementById('profile-name');
        const profileUsername = document.getElementById('profile-username');
        const profileStatus = document.getElementById('profile-status');
        const pWins = document.getElementById('p-wins');
        const pLosses = document.getElementById('p-losses');
        const pWinrate = document.getElementById('p-winrate');
        const pBalance = document.getElementById('p-balance');
        const podiumEl = document.getElementById('podium');
        const topList = document.getElementById('top-list');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPages = { pvp: document.getElementById('pvp-page'), profile: document.getElementById('profile-page'),
            top: document.getElementById('top-page') };

        // ─── WEBSOCKET ───
        let ws = null;
        const WS_URL = 'wss://your-server-url.com'; // Change to your server address

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                statusDot.className = 'online';
                // Send join
                const name = state.username;
                const pfp = state.pfp || '';
                ws.send(JSON.stringify({ type: 'join', name, pfp }));
            };
            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'state') {
                        state.game = data.game;
                        updateUI();
                    }
                } catch (err) { console.error(err); }
            };
            ws.onclose = () => { statusDot.className = 'offline'; };
            ws.onerror = () => { statusDot.className = 'offline'; };
        }

        // ─── UPDATE UI FROM SERVER STATE ───
        function updateUI() {
            const g = state.game;
            if (!g) return;
            // Update player list
            const alive = g.players.filter(p => p.alive);
            const totalBet = g.players.reduce((s, p) => s + p.bet, 0);
            let html = '';
            alive.forEach(p => {
                const chance = totalBet > 0 ? ((p.bet / totalBet) * 100).toFixed(1) : 0;
                const isYou = p.id === state.userId;
                html += `<div class="pl-entry ${isYou ? 'you' : ''}">
                            <div class="pl-avatar"><img src="${p.pfp || state.defaultAvatar}" onerror="this.src='${state.defaultAvatar}'" /></div>
                            <span class="pl-name">${p.name}</span>
                            <span class="pl-bet">${p.bet}</span>
                            <span class="pl-chance">${chance}%</span>
                        </div>`;
            });
            playerListContainer.innerHTML = html;

            // Stats
            statsPlayers.textContent = alive.length;
            statsPot.textContent = g.pot;

            // Waiting text
            if (g.state === 'idle') {
                if (alive.length === 0) {
                    waitingText.innerHTML = '<span>waiting for players</span><div class="sub">place a bet to join</div>';
                } else {
                    waitingText.innerHTML =
                        `<span>● ${alive.length} player${alive.length > 1 ? 's' : ''} ready</span><div class="sub">need ${Math.max(0, 2 - alive.length)} more to start</div>`;
                }
                frogGif.classList.toggle('show', alive.length < 2);
                waitingText.style.display = (alive.length < 2) ? 'none' : 'block';
            } else {
                waitingText.style.display = 'none';
                frogGif.classList.remove('show');
            }

            // Countdown
            if (g.state === 'countdown') {
                const elapsed = (Date.now() - g.countdownStart) / 1000;
                let remaining = Math.max(0, 3.0 - elapsed);
                countdownTimer.style.display = 'block';
                countdownTimer.textContent = remaining.toFixed(2);
            } else if (g.state === 'prestart') {
                countdownTimer.style.display = 'block';
                countdownTimer.textContent = 'GO!';
            } else if (g.state === 'playing' || g.state === 'finished') {
                countdownTimer.style.display = 'none';
            } else {
                countdownTimer.style.display = 'none';
            }

            // Bet overlay visibility
            const shouldHide = g.state === 'playing' || g.state === 'finished';
            betOverlayWrap.classList.toggle('hidden', shouldHide);
            playerListContainer.classList.toggle('shift-up', shouldHide);

            // Update my bet display
            const myPlayer = g.players.find(p => p.id === state.userId);
            if (myPlayer) {
                currentBetDisplay.textContent = myPlayer.bet;
                state.balance = myPlayer.balance;
                balanceEl.textContent = state.balance;
                pBalance.textContent = state.balance;
                betBtn.textContent = g.state === 'idle' ? 'increase' : 'waiting';
                betBtn.disabled = g.state !== 'idle';
                betInput.disabled = g.state !== 'idle';
            } else {
                currentBetDisplay.textContent = '0';
                betBtn.textContent = 'join';
                betBtn.disabled = g.state !== 'idle';
                betInput.disabled = g.state !== 'idle';
            }

            // Win panel
            if (g.state === 'finished' && g.winnerId) {
                const winner = g.players.find(p => p.id === g.winnerId);
                if (winner) {
                    // Show win panel if not already shown
                    if (!winPanel.classList.contains('show')) {
                        winGif.src = WIN_GIFS[Math.floor(Math.random() * WIN_GIFS.length)];
                        winAvatar.src = winner.pfp || state.defaultAvatar;
                        winName.textContent = winner.name + ' wins!';
                        const totalPot = g.pot + winner.bet; // approximate
                        const winnings = totalPot - Math.floor((totalPot - winner.bet) * 0.02);
                        winMultiplier.textContent = 'x' + (winnings / winner.bet).toFixed(1);
                        winPanel.classList.add('show');
                        if (winner.id === state.userId) playVictorySound();
                        // Add to history
                        addWinToHistory(winner.name, winner.pfp);
                    }
                }
            } else {
                winPanel.classList.remove('show');
            }

            // Resize canvas if needed
            resizeCanvas();
            // Render will be called in game loop
        }

        // ─── WIN HISTORY ───
        function addWinToHistory(name, pfp) {
            state.winHistory.unshift({ name, pfp, timestamp: Date.now() });
            if (state.winHistory.length > 8) state.winHistory.pop();
            let html = '';
            state.winHistory.forEach(entry => {
                html +=
                    `<div class="win-entry"><img src="${entry.pfp || state.defaultAvatar}" onerror="this.src='${state.defaultAvatar}'" /></div>`;
            });
            winHistoryEl.innerHTML = html;
        }

        // ─── GENERATE DEFAULT AVATAR ───
        function generateDefaultAvatar(initial, colorIndex) {
            const size = 128;
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx2 = c.getContext('2d');
            const colors = ['#5b8def', '#50c890', '#e06060', '#d4af37', '#c084e0', '#f0a070', '#60c0d0', '#e8a0a0'];
            const col = colors[colorIndex % colors.length];
            const grad = ctx2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            grad.addColorStop(0, lightenColor(col, 60));
            grad.addColorStop(1, col);
            ctx2.beginPath();
            ctx2.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
            ctx2.fillStyle = grad;
            ctx2.fill();
            ctx2.beginPath();
            ctx2.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
            ctx2.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx2.lineWidth = 2;
            ctx2.stroke();
            const letter = (initial || '?').charAt(0).toUpperCase();
            ctx2.fillStyle = 'rgba(255,255,255,0.95)';
            ctx2.font = `bold ${size * 0.48}px system-ui, sans-serif`;
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'middle';
            ctx2.shadowColor = 'rgba(0,0,0,0.15)';
            ctx2.shadowBlur = 8;
            ctx2.fillText(letter, size / 2, size / 2 + 3);
            ctx2.shadowBlur = 0;
            const img = new Image();
            img.src = c.toDataURL('image/png');
            return img;
        }

        function lightenColor(hex, amt) {
            let r = parseInt(hex.slice(1, 2), 16) * 17 || parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(2, 3), 16) * 17 || parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(3, 4), 16) * 17 || parseInt(hex.slice(5, 7), 16);
            r = Math.min(255, r + amt);
            g = Math.min(255, g + amt);
            b = Math.min(255, b + amt);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        // ─── CANVAS ───
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width - 16, rect.height - 16, 440);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            state.arenaSize = size;
            state.cornerRadius = size * 0.15;
            ctx.scale(dpr, dpr);
            // Generate perimeter if not set
            if (state.perimeterPoints.length === 0) {
                state.perimeterPoints = generatePerimeter(size, state.cornerRadius, 300);
            }
        }

        function generatePerimeter(size, cornerRadius, numPoints = 300) {
            const half = size / 2;
            const r = Math.min(cornerRadius, half);
            const points = [];
            const sections = [
                { type: 'line', x1: -half + r, y1: -half, x2: half - r, y2: -half },
                { type: 'arc', cx: half - r, cy: -half + r, start: -Math.PI / 2, end: 0 },
                { type: 'line', x1: half, y1: -half + r, x2: half, y2: half - r },
                { type: 'arc', cx: half - r, cy: half - r, start: 0, end: Math.PI / 2 },
                { type: 'line', x1: half - r, y1: half, x2: -half + r, y2: half },
                { type: 'arc', cx: -half + r, cy: half - r, start: Math.PI / 2, end: Math.PI },
                { type: 'line', x1: -half, y1: half - r, x2: -half, y2: -half + r },
                { type: 'arc', cx: -half + r, cy: -half + r, start: Math.PI, end: 3 * Math.PI / 2 }
            ];
            let totalLen = 0;
            const segLengths = sections.map(seg => {
                if (seg.type === 'line') {
                    const dx = seg.x2 - seg.x1,
                        dy = seg.y2 - seg.y1;
                    return Math.sqrt(dx * dx + dy * dy);
                } else {
                    return r * (seg.end - seg.start);
                }
            });
            totalLen = segLengths.reduce((a, b) => a + b, 0);
            const step = totalLen / numPoints;
            let accumulated = 0,
                segIdx = 0;
            for (let i = 0; i < numPoints; i++) {
                const target = i * step;
                while (accumulated + segLengths[segIdx] < target) {
                    accumulated += segLengths[segIdx];
                    segIdx = (segIdx + 1) % sections.length;
                }
                const localT = (target - accumulated) / segLengths[segIdx];
                const seg = sections[segIdx];
                let px, py;
                if (seg.type === 'line') {
                    px = seg.x1 + localT * (seg.x2 - seg.x1);
                    py = seg.y1 + localT * (seg.y2 - seg.y1);
                } else {
                    const angle = seg.start + localT * (seg.end - seg.start);
                    px = seg.cx + r * Math.cos(angle);
                    py = seg.cy + r * Math.sin(angle);
                }
                points.push({ x: px + half, y: py + half });
            }
            return points;
        }

        // ─── RENDER ───
        function render() {
            const g = state.game;
            if (!g) return;
            const w = state.arenaSize;
            const half = w / 2;
            ctx.clearRect(0, 0, w, w);

            // Background
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            // Perimeter
            const pts = state.perimeterPoints;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#1a1a1e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#28282e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            // Opening
            const opening = g.opening;
            const isFlashing = opening && opening.state === 'flashing';
            const isOpen = opening && opening.state === 'open';
            const total = pts.length;

            ctx.save();
            if (opening && (isFlashing || isOpen)) {
                const start = opening.startIdx,
                    end = opening.endIdx;
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                for (let i = 0; i < total; i++) {
                    const j = (i + 1) % total;
                    let inGap = false;
                    if (start < end) {
                        if (i >= start && i < end) inGap = true;
                        if (j >= start && j < end) inGap = true;
                    } else {
                        if (i >= start || i < end) inGap = true;
                        if (j >= start || j < end) inGap = true;
                    }
                    if (inGap) continue;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
                if (isFlashing) {
                    const isRed = (opening.flashCount % 2 === 0);
                    ctx.save();
                    const flashColor = isRed ? '#ff0044' : 'rgba(160,160,176,0.25)';
                    let gapSegments = [];
                    if (start < end) {
                        for (let i = start; i < end; i++) gapSegments.push({ i, j: (i + 1) % total });
                    } else {
                        for (let i = start; i < total; i++) gapSegments.push({ i, j: (i + 1) % total });
                        for (let i = 0; i < end; i++) gapSegments.push({ i, j: (i + 1) % total });
                    }
                    ctx.strokeStyle = flashColor;
                    ctx.lineWidth = isRed ? 5 : 3;
                    ctx.shadowBlur = 0;
                    for (const seg of gapSegments) {
                        ctx.beginPath();
                        ctx.moveTo(pts[seg.i].x, pts[seg.i].y);
                        ctx.lineTo(pts[seg.j].x, pts[seg.j].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            } else {
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();

            // ─── DRAW PLAYERS ───
            g.players.forEach(p => {
                if (!p.alive) return;
                const radius = p.radius || 18;
                const finalRadius = radius;
                const drawRadius = Math.max(finalRadius - 1, 1);

                ctx.save();

                // Try to load avatar from cache or generate default
                let img = null;
                // Use a simple cache by pfp URL
                if (!window._avatarCache) window._avatarCache = {};
                if (p.pfp) {
                    if (window._avatarCache[p.pfp]) {
                        img = window._avatarCache[p.pfp];
                    } else {
                        // Load and cache
                        const tempImg = new Image();
                        tempImg.crossOrigin = 'anonymous';
                        tempImg.onload = () => {
                            window._avatarCache[p.pfp] = tempImg;
                        };
                        tempImg.onerror = () => {
                            // fallback
                            const def = generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', g.players.indexOf(p));
                            window._avatarCache[p.pfp] = def;
                        };
                        tempImg.src = p.pfp;
                        // Use default for now
                        img = generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', g.players.indexOf(p));
                    }
                } else {
                    img = generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', g.players.indexOf(p));
                }

                if (img) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    const size = drawRadius * 2;
                    ctx.drawImage(img, p.x - drawRadius, p.y - drawRadius, size, size);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fillStyle = '#555';
                    ctx.fill();
                }
                ctx.restore();

                // Outline
                ctx.save();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, finalRadius, 0, Math.PI * 2);
                const isYou = p.id === state.userId;
                ctx.strokeStyle = isYou ? 'rgba(255,255,255,1.0)' : 'rgba(255,255,255,0.35)';
                ctx.lineWidth = isYou ? 2.5 : 1.5;
                ctx.stroke();
                ctx.restore();
            });
        }

        // ─── GAME LOOP ───
        let lastTime = 0;

        function gameLoop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            render();
            requestAnimationFrame(gameLoop);
        }

        // ─── EVENTS ───
        betBtn.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (state.game && state.game.state !== 'idle') return;
            let amount = parseInt(betInput.value) || 10;
            if (amount < 10) amount = 10;
            const myPlayer = state.game ? state.game.players.find(p => p.id === state.userId) : null;
            if (myPlayer) {
                if (amount > myPlayer.balance) amount = myPlayer.balance;
                ws.send(JSON.stringify({ type: 'bet', amount }));
            } else {
                // First join, then bet
                // Actually server will handle join on connection, but we need to send join first
                // We already sent join on open, but if not, send it now
                ws.send(JSON.stringify({ type: 'join', name: state.username, pfp: state.pfp }));
                // Then bet after a small delay? Better to send bet after join is processed.
                // We'll send bet immediately, server should handle if player exists.
                ws.send(JSON.stringify({ type: 'bet', amount }));
            }
            betInput.value = 10;
        });

        betInput.addEventListener('input', () => {
            let val = parseInt(betInput.value) || 0;
            if (val < 10) betInput.value = 10;
            if (state.game) {
                const myPlayer = state.game.players.find(p => p.id === state.userId);
                if (myPlayer && val > myPlayer.balance) betInput.value = myPlayer.balance;
            }
            betAmountDisplay.textContent = (parseInt(betInput.value) || 10);
        });

        betToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            betOverlay.classList.toggle('collapsed');
            haptic('light');
        });

        winContinueBtn.addEventListener('click', () => {
            winPanel.classList.remove('show');
            // Reset round on server? Server auto-resets after 3s.
        });

        // ─── TABS ───
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const tab = this.dataset.tab;
                if (tab === state.currentTab) return;
                const oldTab = state.currentTab;
                state.currentTab = tab;
                const oldEl = tabPages[oldTab];
                if (oldEl) { oldEl.classList.remove('active');
                    oldEl.classList.add('exit');
                    setTimeout(() => oldEl.classList.remove('exit'), 350); }
                const newEl = tabPages[tab];
                if (newEl) {
                    setTimeout(() => {
                        newEl.classList.add('active');
                        if (tab === 'profile') updateProfile();
                        if (tab === 'top') updateTopUI();
                    }, 50);
                }
                tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                haptic('light');
            });
        });

        // ─── PROFILE ───
        function updateProfile() {
            // We'll use server data
            const myPlayer = state.game ? state.game.players.find(p => p.id === state.userId) : null;
            if (myPlayer) {
                pWins.textContent = state.wins || 0;
                pLosses.textContent = state.losses || 0;
                const total = state.wins + state.losses;
                pWinrate.textContent = total > 0 ? Math.round((state.wins / total) * 100) + '%' : '0%';
                profileName.textContent = myPlayer.name;
                profileUsername.textContent = '@' + myPlayer.name;
                if (myPlayer.pfp) profilePfp.src = myPlayer.pfp;
                pBalance.textContent = myPlayer.balance;
                balanceEl.textContent = myPlayer.balance;
            }
        }

        // ─── TOP ───
        function updateTopUI() {
            // For simplicity, we'll show top players by balance from game state
            const players = state.game ? [...state.game.players].sort((a, b) => b.balance - a.balance) : [];
            const top3 = players.slice(0, 3);
            // Podium
            const podiumOrder = [
                { player: top3[2], cls: 'bronze', label: '🥉', base: 'bronze', colClass: 'p3' },
                { player: top3[0], cls: 'gold', label: '🥇', base: 'gold', colClass: 'p1' },
                { player: top3[1], cls: 'silver', label: '🥈', base: 'silver', colClass: 'p2' }
            ];
            let podiumHtml = '';
            podiumOrder.forEach(info => {
                const p = info.player;
                if (!p) return;
                podiumHtml += `<div class="podium-col ${info.colClass}">
                            <div class="rank-badge ${info.cls}">${info.label}</div>
                            <img class="podium-pfp ${info.cls}" src="${p.pfp || state.defaultAvatar}" onerror="this.src='${state.defaultAvatar}'" />
                            <div class="podium-name">${p.name}</div>
                            <div class="podium-prize">${p.balance}</div>
                            <div class="podium-stats">${p.bet} bet</div>
                            <div class="podium-base ${info.base}"></div>
                        </div>`;
            });
            podiumEl.innerHTML = podiumHtml;

            // Rest
            const rest = players.slice(3);
            let listHtml = '';
            rest.forEach((p, idx) => {
                const rank = idx + 4;
                let rClass = 'rank';
                if (rank === 4) rClass += ' gold';
                else if (rank === 5) rClass += ' silver';
                else if (rank === 6) rClass += ' bronze';
                listHtml += `<div class="top-entry">
                            <div class="${rClass}">#${rank}</div>
                            <img class="t-pfp" src="${p.pfp || state.defaultAvatar}" onerror="this.src='${state.defaultAvatar}'" />
                            <div class="t-name">${p.name}</div>
                            <div class="t-wins">${p.bet} bet</div>
                            <div class="t-score">${p.balance}</div>
                            <div class="t-prize">${p.balance}</div>
                        </div>`;
            });
            topList.innerHTML = listHtml;
        }

        // ─── INIT ───
        function init() {
            // Get Telegram user info
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                state.username = u.username || u.first_name || 'player';
                state.userId = u.id?.toString() || 'user_' + Date.now().toString(36);
                state.pfp = u.photo_url || '';
                if (state.pfp) {
                    try { new URL(state.pfp); } catch (_) { state.pfp = ''; }
                }
            } else {
                state.username = 'test_user';
                state.userId = 'user_' + Date.now().toString(36);
                state.pfp = '';
            }
            usernameDisplay.textContent = '@' + state.username;

            // Connect WebSocket
            connectWebSocket();

            // Resize canvas
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Start game loop
            requestAnimationFrame(gameLoop);

            // Initial profile
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            if (state.pfp) profilePfp.src = state.pfp;
            else profilePfp.src = state.defaultAvatar;

            // Default tab
            state.currentTab = 'pvp';
            tabPages.pvp.classList.add('active');

            // Status
            statusDot.className = 'online';
        }

        // ─── VICTORY SOUND ───
        let audioCtx = null;
        let victorySoundPlaying = false;

        function playVictorySound() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (victorySoundPlaying) return;
                victorySoundPlaying = true;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                const durations = [0.12, 0.12, 0.12, 0.2];
                const startTimes = [0, 0.14, 0.28, 0.45];
                for (let i = 0; i < notes.length; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[i], now + startTimes[i]);
                    gain.gain.setValueAtTime(0.18, now + startTimes[i]);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + startTimes[i] + durations[i]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + startTimes[i]);
                    osc.stop(now + startTimes[i] + durations[i]);
                }
                setTimeout(() => { victorySoundPlaying = false; }, 800);
            } catch (e) { victorySoundPlaying = false; }
        }

        // ─── WIN GIFS ───
        const WIN_GIFS = [
            'https://i.postimg.cc/rmQPRSzF/ezgif-20d222277768f496.gif',
            'https://i.postimg.cc/NfyzL2tt/ezgif-2378686847977dc7.gif',
            'https://i.postimg.cc/Gt6zvzCK/ezgif-258589f1cd2da73d.gif',
            'https://i.postimg.cc/Dwr5bqMn/ezgif-26d5d53255cd286f.gif',
            'https://i.postimg.cc/qvTSYBPx/ezgif-2529049603c6d1a9.gif',
            'https://i.postimg.cc/4dqF1Xbk/ezgif-286c5293f9b85b07.gif'
        ];

        init();
        console.log('Multiplayer mode enabled — bots removed.');
    </script>

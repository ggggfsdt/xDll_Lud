<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>dllump · bump arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --bg: #08080a;
            --surface: #121214;
            --surface2: #1a1a1e;
            --surface3: #242428;
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.45);
            --text: #e8e8e8;
            --text2: #888;
            --border: #2a2a2e;
            --gold: #c8a84e;
            --gold-dim: rgba(200, 168, 78, 0.2);
            --red: #d45a5a;
            --green: #5ac88a;
            --radius: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: var(--bg);
            overflow: hidden;
        }
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 52px;
            z-index: 10;
            gap: 8px;
        }
        #balance-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            padding: 3px 14px 3px 6px;
            border-radius: 28px;
            border: 1px solid var(--border);
        }
        #diamond-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
            animation: glowDiamond 2.8s ease-in-out infinite;
        }
        @keyframes glowDiamond {
            0%,
            100% {
                filter: drop-shadow(0 0 6px rgba(200, 168, 78, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 24px rgba(200, 168, 78, 0.7)) brightness(1.2);
            }
        }
        #balance {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 40px;
        }
        #top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            transition: 0.3s;
        }
        #status-dot.offline {
            background: var(--red);
            box-shadow: 0 0 12px var(--red);
        }
        #username-display {
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }
        .tab-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, visibility 0.35s ease;
            overflow: hidden;
            background: var(--bg);
            will-change: transform, opacity;
        }
        .tab-page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 2;
        }
        .tab-page.exit {
            opacity: 0;
            transform: translateX(-30px);
            z-index: 1;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s 0.3s;
        }

        #pvp-page {
            background: var(--bg);
        }
        #arena-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 10px 0 10px;
            min-height: 0;
            overflow: visible;
        }
        #game-canvas {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius);
            background: var(--surface);
            touch-action: none;
            display: block;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(76, 175, 80, 0.05);
        }

        /* Timer - top-right corner, no background */
        #countdown-timer {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 0, 0, 0.8);
            z-index: 3;
            pointer-events: none;
            display: none;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            background: transparent;
            border: none;
            backdrop-filter: none;
            padding: 0;
            line-height: 1;
        }

        /* Player list overlay - bottom-left inside arena */
        #player-list {
            position: absolute;
            bottom: 80px;
            left: 10px;
            z-index: 4;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 60%;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: none;
        }
        #player-list::-webkit-scrollbar {
            display: none;
        }
        .player-entry {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 3px 10px 3px 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: #ccc;
            pointer-events: none;
            opacity: 0.8;
            transition: 0.2s;
            max-width: 160px;
            white-space: nowrap;
        }
        .player-entry .pl-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--surface3);
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-entry .pl-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-entry .pl-name {
            flex: 1;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60px;
        }
        .player-entry .pl-bet {
            color: var(--gold);
            font-weight: 700;
        }
        .player-entry .pl-chance {
            color: var(--text2);
            font-size: 10px;
            margin-left: 2px;
        }
        .player-entry.you {
            border-color: var(--primary);
            opacity: 1;
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px 10px 14px;
            flex-shrink: 0;
            color: var(--text2);
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border-top: 1px solid var(--border);
            margin-top: 0;
        }
        #stats-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #stats-bar .stat-item .icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        #stats-bar .stat-item .value {
            color: #fff;
            font-weight: 700;
        }
        #stats-bar .stat-item .label {
            color: var(--text2);
            font-size: 12px;
            margin-right: 2px;
        }

        #waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            text-align: center;
            color: var(--text2);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.7;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            line-height: 1.6;
        }
        #waiting-text .sub {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 2px;
        }

        #bet-overlay {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            z-index: 5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: 0.3s;
            flex-wrap: wrap;
            justify-content: center;
            min-width: 280px;
        }
        #bet-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(16px);
        }
        #bet-info {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0px;
            min-width: 70px;
        }
        #bet-info .label {
            font-size: 9px;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.6px;
        }
        #bet-info .value {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
        }
        #bet-input {
            width: 60px;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface3);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }
        #bet-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 24px var(--primary-glow);
        }
        #bet-btn {
            padding: 6px 18px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 24px var(--primary-glow);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        #bet-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }
        #bet-btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        #current-bet-display {
            color: var(--text2);
            font-size: 12px;
            width: 100%;
            text-align: center;
            margin-top: 2px;
            border-top: 1px solid var(--border);
            padding-top: 4px;
        }
        #current-bet-display span {
            color: var(--gold);
            font-weight: 700;
        }

        #profile-page {
            background: var(--bg);
            padding: 20px 16px 10px;
            overflow-y: auto;
            align-items: center;
        }
        .profile-card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px 20px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
        }
        .profile-pfp {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--surface2);
            border: 2px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 40px var(--primary-glow);
        }
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-top: 2px;
        }
        .profile-username {
            font-size: 14px;
            color: var(--text2);
        }
        .profile-status {
            font-size: 13px;
            padding: 2px 18px;
            border-radius: 30px;
            background: var(--surface2);
            color: var(--text2);
            border: 1px solid var(--border);
            margin-top: 2px;
        }
        .profile-divider {
            width: 70%;
            height: 1px;
            background: var(--border);
            margin: 6px 0 4px;
        }
        .profile-stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            width: 100%;
            justify-content: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-item .lbl {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .stat-item .num.win {
            color: var(--green);
        }
        .stat-item .num.loss {
            color: var(--red);
        }
        .stat-item .num.rate {
            color: var(--primary);
        }
        #p-balance {
            color: var(--gold);
            font-weight: 700;
        }

        #top-page {
            background: var(--bg);
            padding: 14px 14px 10px;
            overflow-y: auto;
        }
        #top-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .top-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border-radius: 12px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .top-entry .rank {
            font-size: 16px;
            font-weight: 800;
            color: var(--text2);
            min-width: 28px;
            text-align: center;
        }
        .top-entry .rank.gold {
            color: var(--gold);
        }
        .top-entry .rank.silver {
            color: #b8b8c8;
        }
        .top-entry .rank.bronze {
            color: #cd8a5a;
        }
        .top-entry .t-pfp {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .top-entry .t-name {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .top-entry .t-wins {
            font-size: 12px;
            color: var(--text2);
            white-space: nowrap;
        }
        .top-entry .t-score {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
            white-space: nowrap;
        }

        #tabs {
            display: flex;
            flex-shrink: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
            padding-top: 2px;
            z-index: 9999 !important;
            position: relative;
            pointer-events: auto !important;
        }
        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            gap: 1px;
            position: relative;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            pointer-events: auto !important;
            touch-action: manipulation;
        }
        .tab-btn .tab-icon {
            font-size: 20px;
            line-height: 1.2;
            transition: 0.2s;
            opacity: 0.7;
            pointer-events: none;
        }
        .tab-btn.active {
            color: #ffffff !important;
        }
        .tab-btn.active .tab-icon {
            opacity: 1;
            transform: translateY(-1px);
            color: #ffffff !important;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 30%;
            right: 30%;
            height: 2px;
            border-radius: 0 0 4px 4px;
            background: #ffffff;
            opacity: 0;
            transition: 0.3s;
        }
        .tab-btn.active::after {
            opacity: 1;
            left: 15%;
            right: 15%;
        }
        .tab-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }
        .tab-btn.active .tab-icon svg {
            stroke: #ffffff !important;
        }
        .no-players-msg {
            text-align: center;
            color: var(--text2);
            padding: 40px 0;
            opacity: 0.4;
            font-size: 14px;
        }

        /* WIN PANEL */
        #win-panel {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%) translateY(100%);
            width: 92%;
            max-width: 380px;
            background: var(--surface2);
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 20px 18px 24px;
            border: 1px solid var(--border);
            border-bottom: none;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.7);
            z-index: 25;
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            max-height: 75vh;
            overflow-y: auto;
        }
        #win-panel.show {
            transform: translateX(-50%) translateY(0%);
            opacity: 1;
            pointer-events: auto;
        }
        #win-gif-container {
            width: 70%;
            max-width: 220px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: transparent;
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #win-gif-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }
        #win-avatar-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            flex-shrink: 0;
            background: var(--surface3);
        }
        #win-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #win-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
        }
        #win-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--gold);
            text-align: center;
        }
        #win-multiplier {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            text-align: center;
        }
        #win-continue-btn {
            padding: 10px 0;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: 0.2s;
            letter-spacing: 0.3px;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }
        #win-continue-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }

        @media (max-width:400px) {
            #balance-wrap {
                padding: 2px 10px 2px 4px;
            }
            #balance {
                font-size: 15px;
            }
            #diamond-icon {
                width: 22px;
                height: 22px;
            }
            #bet-overlay {
                padding: 6px 12px;
                gap: 6px;
                bottom: 12px;
                min-width: auto;
                width: calc(100% - 24px);
            }
            #bet-input {
                width: 48px;
                font-size: 13px;
                padding: 4px 4px;
            }
            #bet-btn {
                padding: 4px 12px;
                font-size: 12px;
            }
            #bet-info .value {
                font-size: 12px;
            }
            .profile-card {
                padding: 16px 14px 20px;
            }
            .profile-pfp {
                width: 60px;
                height: 60px;
            }
            .profile-name {
                font-size: 17px;
            }
            .stat-item .num {
                font-size: 18px;
            }
            #username-display {
                max-width: 60px;
                font-size: 11px;
            }
            #countdown-timer {
                font-size: 18px;
                top: 6px;
                right: 8px;
            }
            #stats-bar {
                font-size: 12px;
                padding: 4px 10px;
            }
            #stats-bar .stat-item .icon {
                width: 16px;
                height: 16px;
            }
            #win-panel {
                width: 96%;
                padding: 16px;
            }
            #win-name {
                font-size: 20px;
            }
            #win-multiplier {
                font-size: 24px;
            }
            #win-gif-container {
                width: 65%;
                max-width: 160px;
            }
            #win-avatar-container {
                width: 50px;
                height: 50px;
            }
            #player-list {
                bottom: 70px;
                left: 6px;
            }
            .player-entry {
                font-size: 10px;
                padding: 2px 8px 2px 3px;
                max-width: 130px;
            }
            .player-entry .pl-name {
                max-width: 40px;
            }
            .player-entry .pl-avatar {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="topbar">
            <div id="balance-wrap">
                <img id="diamond-icon" src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="diamond" />
                <span id="balance">1000</span>
            </div>
            <div id="top-right">
                <span id="username-display">player</span>
                <div id="status-dot"></div>
            </div>
        </div>

        <div id="main">
            <div id="pvp-page" class="tab-page active">
                <div id="arena-wrap">
                    <canvas id="game-canvas"></canvas>
                    <div id="countdown-timer">3.00</div>
                    <div id="waiting-text"><span>waiting for players</span><div class="sub">place a bet to join</div></div>

                    <!-- Player List -->
                    <div id="player-list"></div>

                    <!-- WIN PANEL -->
                    <div id="win-panel">

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TELEGRAM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand();
            tg.enableClosingConfirmation(); }

        function haptic(style = 'light') {
            try {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
                else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
            } catch (_) {}
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {

            opening: null,

            prestartTimer: 0,
            openingTimer: 0,

        };

        // DOM refs
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const balanceEl = document.getElementById('balance');
        const usernameDisplay = document.getElementById('username-display');
        const statusDot = document.getElementById('status-dot');
        const waitingText = document.getElementById('waiting-text');
        const betOverlay = document.getElementById('bet-overlay');
        const betInput = document.getElementById('bet-input');

        const statsPlayers = document.getElementById('stats-players');
        const statsPot = document.getElementById('stats-pot');
        const profilePfp = document.getElementById('profile-pfp');
        const profileName = document.getElementById('profile-name');
        const profileUsername = document.getElementById('profile-username');
        const profileStatus = document.getElementById('profile-status');
        const pWins = document.getElementById('p-wins');
        const pLosses = document.getElementById('p-losses');
        const pWinrate = document.getElementById('p-winrate');
        const pBalance = document.getElementById('p-balance');
        const topList = document.getElementById('top-list');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPages = {
            pvp: document.getElementById('pvp-page'),

            top: document.getElementById('top-page'),
        };
        const winPanel = document.getElementById('win-panel');
        const winGif = document.getElementById('win-gif');
        const winAvatar = document.getElementById('win-avatar');
        const winName = document.getElementById('win-name');
        const winMultiplier = document.getElementById('win-multiplier');
        const winContinueBtn = document.getElementById('win-continue-btn');
        const playerListEl = document.getElementById('player-list');

        const WIN_GIFS = [
            'https://i.postimg.cc/rmQPRSzF/ezgif-20d222277768f496.gif',
            'https://i.postimg.cc/NfyzL2tt/ezgif-2378686847977dc7.gif',
            'https://i.postimg.cc/Gt6zvzCK/ezgif-258589f1cd2da73d.gif',
            'https://i.postimg.cc/Dwr5bqMn/ezgif-26d5d53255cd286f.gif',
            'https://i.postimg.cc/qvTSYBPx/ezgif-2529049603c6d1a9.gif',
            'https://i.postimg.cc/4dqF1Xbk/ezgif-286c5293f9b85b07.gif'
        ];

        const COLORS = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD',
            '#D4A5A5', '#9B59B6', '#FF8C00', '#00B894', '#E17055',
            '#0984E3', '#FDCB6E', '#E84393', '#00CEC9', '#6C5CE7'
        ];

        function getColor(i) { return COLORS[i % COLORS.length]; }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PERIMETER GENERATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generatePerimeter(size, cornerRadius, numPoints = 300) {
            const half = size / 2;
            const r = Math.min(cornerRadius, half);
            const points = [];
            const sections = [
                { type: 'line', x1: -half + r, y1: -half, x2: half - r, y2: -half },
                { type: 'arc', cx: half - r, cy: -half + r, start: -Math.PI / 2, end: 0 },
                { type: 'line', x1: half, y1: -half + r, x2: half, y2: half - r },
                { type: 'arc', cx: half - r, cy: half - r, start: 0, end: Math.PI / 2 },
                { type: 'line', x1: half - r, y1: half, x2: -half + r, y2: half },
                { type: 'arc', cx: -half + r, cy: half - r, start: Math.PI / 2, end: Math.PI },
                { type: 'line', x1: -half, y1: half - r, x2: -half, y2: -half + r },
                { type: 'arc', cx: -half + r, cy: -half + r, start: Math.PI, end: 3 * Math.PI / 2 }
            ];

            let totalLen = 0;
            const segLengths = sections.map(seg => {
                if (seg.type === 'line') {
                    const dx = seg.x2 - seg.x1,
                        dy = seg.y2 - seg.y1;
                    return Math.sqrt(dx * dx + dy * dy);
                } else {
                    return r * (seg.end - seg.start);
                }
            });
            totalLen = segLengths.reduce((a, b) => a + b, 0);

            const step = totalLen / numPoints;
            let accumulated = 0;
            let segIdx = 0;
            for (let i = 0; i < numPoints; i++) {
                const target = i * step;
                while (accumulated + segLengths[segIdx] < target) {
                    accumulated += segLengths[segIdx];
                    segIdx = (segIdx + 1) % sections.length;
                }
                const localT = (target - accumulated) / segLengths[segIdx];
                const seg = sections[segIdx];
                let px, py;
                if (seg.type === 'line') {
                    px = seg.x1 + localT * (seg.x2 - seg.x1);
                    py = seg.y1 + localT * (seg.y2 - seg.y1);
                } else {
                    const angle = seg.start + localT * (seg.end - seg.start);
                    px = seg.cx + r * Math.cos(angle);
                    py = seg.cy + r * Math.sin(angle);
                }
                points.push({ x: px + half, y: py + half });
            }
            return points;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CANVAS SIZING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width - 16, rect.height - 16, 440);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            state.arenaSize = size;
            state.cornerRadius = size * 0.15;
            ctx.scale(dpr, dpr);
            state.perimeterPoints = generatePerimeter(size, state.cornerRadius, 300);
            if (state.opening && state.opening.startIdx !== undefined) {
                const total = state.perimeterPoints.length;
                const startIdx = Math.floor(state.opening.startIdx / (state.opening._total || total) * total);
                const endIdx = Math.floor(state.opening.endIdx / (state.opening._total || total) * total);
                state.opening.startIdx = startIdx % total;
                state.opening.endIdx = endIdx % total;
                state.opening._total = total;
            }
            const half = size / 2;
            state.players.forEach(p => {
                if (p.x === undefined || p.x === 0) {
                    p.x = half + (Math.random() - 0.5) * (size * 0.4);
                    p.y = half + (Math.random() - 0.5) * (size * 0.4);
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ROBUST IMAGE LOADER (with fallback)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const imageCache = {};
        const loadingPromises = {};

        function loadImageWithFallback(src, maxRetries = 2) {
            return new Promise((resolve) => {
                if (!src) src = state.defaultAvatar;
                if (imageCache[src]) {
                    const img = imageCache[src];
                    if (img.complete && img.naturalWidth > 0) {
                        resolve(img);
                        return;
                    } else {
                        // wait for it to load
                        img.onload = () => resolve(img);
                        img.onerror = () => {
                            // fallback
                            const fallback = new Image();
                            fallback.crossOrigin = 'anonymous';
                            fallback.onload = () => {
                                imageCache[src] = fallback;
                                resolve(fallback);
                            };
                            fallback.onerror = () => resolve(null);
                            fallback.src = state.defaultAvatar;
                        };
                        return;
                    }
                }
                // start loading
                const img = new Image();
                img.crossOrigin = 'anonymous';
                let attempts = 0;
                const load = () => {
                    img.onload = () => {
                        imageCache[src] = img;
                        resolve(img);
                    };
                    img.onerror = () => {
                        attempts++;
                        if (attempts < maxRetries) {
                            // retry with cache buster
                            img.src = src + '?retry=' + attempts;
                        } else {
                            // fallback to default
                            const fallback = new Image();
                            fallback.crossOrigin = 'anonymous';
                            fallback.onload = () => {
                                imageCache[src] = fallback;
                                resolve(fallback);
                            };
                            fallback.onerror = () => resolve(null);
                            fallback.src = state.defaultAvatar;
                        }
                    };
                    img.src = src;
                };
                load();
                imageCache[src] = img;
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER FACTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function computeRadii() {
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            if (totalBet === 0) return;
            state.players.forEach(p => {
                const ratio = p.bet / totalBet;
                const r = 18 + ratio * 34;
                const newTarget = Math.min(Math.max(r, 14), 52);
                p.targetRadius = newTarget;
            });
        }

        function makePlayer(id, bet, name, pfp) {
            const half = state.arenaSize / 2;
            const radius = 18;
            let x, y, attempts = 0,
                overlap = true;
            while (overlap && attempts < 100) {
                x = half + (Math.random() - 0.5) * (state.arenaSize * 0.6);
                y = half + (Math.random() - 0.5) * (state.arenaSize * 0.6);
                overlap = state.players.some(p => Math.hypot(p.x - x, p.y - y) < p.radius + radius + 5);
                attempts++;
            }
            const avatarSrc = pfp || state.defaultAvatar;
            const p = {
                id,
                bet,
                name: name || 'player',
                pfp: avatarSrc,
                color: getColor(state.players.length + 1),
                radius: radius,
                displayRadius: radius,
                targetRadius: radius,
                mass: radius * radius * 1.2,
                x: x || half,
                y: y || half,
                vx: 0,
                vy: 0,
                alive: true,
                isPopping: true,
                popStartTime: performance.now(),
                popDuration: 550,
                pulseTime: 0,
                isPulsing: false,
                pulseStartTime: 0,
                pfpLoaded: false,
                pfpImg: null,
            };
            // Load avatar asynchronously
            loadImageWithFallback(avatarSrc).then(img => {
                if (img) {
                    p.pfpLoaded = true;
                    p.pfpImg = img;
                } else {
                    p.pfpLoaded = false;
                    p.pfpImg = null;
                }
                // Force a re-render if game is active
                if (state.gameState === 'playing' || state.gameState === 'idle') {
                    // We'll re-render on next frame anyway
                }
            });
            state.players.push(p);
            computeRadii();
            haptic('medium');
            updatePlayerList();
            return p;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER LIST UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updatePlayerList() {
            const alive = state.players.filter(p => p.alive);
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            let html = '';
            alive.forEach(p => {
                const chance = totalBet > 0 ? ((p.bet / totalBet) * 100).toFixed(1) : 0;
                const isYou = p.id === state.userId;
                html += `<div class="player-entry ${isYou ? 'you' : ''}">
                            <div class="pl-avatar"><img src="${p.pfp}" onerror="this.src='${state.defaultAvatar}'" /></div>
                            <span class="pl-name">${p.name}</span>
                            <span class="pl-bet">${p.bet}</span>
                            <span class="pl-chance">${chance}%</span>
                        </div>`;
            });
            playerListEl.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ANIMATION HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function easePopBounce(t) {
            if (t >= 1) return 1;
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        function getPopScale(player) {
            if (!player.isPopping) return 1;
            const elapsed = performance.now() - player.popStartTime;
            const progress = Math.min(elapsed / player.popDuration, 1);
            const scale = easePopBounce(progress);
            if (progress >= 1) {
                player.isPopping = false;
                return 1;
            }
            return scale;
        }

        function getPlayerDisplayRadius(player) {
            const diff = player.targetRadius - player.displayRadius;
            if (Math.abs(diff) < 0.01) {
                player.displayRadius = player.targetRadius;
                return player.displayRadius;
            }
            const speed = 8.0;
            player.displayRadius += diff * Math.min(1, speed * 0.016);
            return player.displayRadius;
        }

        function updatePlayerAnimations() {
            state.players.forEach(p => {
                getPlayerDisplayRadius(p);
                if (p.isPulsing) {
                    const elapsed = (performance.now() - p.pulseStartTime) / 1000;
                    if (elapsed > 0.6) {
                        p.isPulsing = false;
                        p.pulseTime = 0;
                    } else {
                        p.pulseTime = elapsed;
                    }
                }
            });
        }

        function triggerPulse(player) {
            player.isPulsing = true;
            player.pulseStartTime = performance.now();
            player.pulseTime = 0;
            haptic('light');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ANIMATED BALANCE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let balanceAnimInterval = null;

        function animateBalanceTo(target) {
            const current = parseInt(balanceEl.textContent) || state.balance;
            if (current === target) return;
            const diff = target - current;
            const steps = Math.min(Math.abs(diff), 30);
            const stepSize = diff / steps;
            let step = 0;

            if (balanceAnimInterval) clearInterval(balanceAnimInterval);

            balanceAnimInterval = setInterval(() => {
                step++;
                const newVal = Math.round(current + stepSize * step);
                if (step >= steps || Math.abs(newVal - target) < 1) {
                    balanceEl.textContent = target;
                    clearInterval(balanceAnimInterval);
                    balanceAnimInterval = null;
                } else {
                    balanceEl.textContent = newVal;
                }
            }, 30);
        }

        function updateBalance() {
            const target = Math.floor(state.balance);
            pBalance.textContent = target;
            animateBalanceTo(target);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BOT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const BOT_NAME = 'Bot';

        function spawnBot() {
            if (!state.botEnabled || state.botSpawned) return;
            if (state.gameState === 'playing' || state.gameState === 'finished') return;
            if (state.players.some(p => p.id.startsWith('bot_'))) return;
            if (state.players.length >= state.maxPlayers) return;
            const bet = Math.floor(Math.random() * 30) + 10;
            const botPfp = 'https://i.pravatar.cc/150?img=' + (Math.floor(Math.random() * 70) + 1);
            const bot = makePlayer('bot_' + Date.now(), bet, BOT_NAME, botPfp);
            state.pot += bet;
            state.botSpawned = true;
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            updatePlayerList();
            haptic('light');
        }

        function botAI(dt) {
            const bot = state.players.find(p => p.id.startsWith('bot_'));
            if (!bot || !bot.alive || state.gameState !== 'playing') return;
            bot.vx += (Math.random() - 0.5) * 1.2 * dt;
            bot.vy += (Math.random() - 0.5) * 1.2 * dt;
            const maxSp = speedForRadius(bot.displayRadius || bot.radius);
            const sp = Math.sqrt(bot.vx * bot.vx + bot.vy * bot.vy);
            if (sp > maxSp) {
                bot.vx = (bot.vx / sp) * maxSp;
                bot.vy = (bot.vy / sp) * maxSp;
            }
            if (sp < 3.0 && sp > 0.01) {
                const ratio = 3.0 / sp;
                bot.vx *= ratio;
                bot.vy *= ratio;
            }
        }

        function speedForRadius(radius) {
            const minR = 14,
                maxR = 52;
            const norm = Math.min(1, Math.max(0, (radius - minR) / (maxR - minR)));
            const speed = 6.0 - norm * 2.0;
            return speed;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOGIC (with prestart)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function startCountdown() {
            if (state.gameState !== 'idle') return;
            if (getAlive().length < 2) return;
            state.gameState = 'countdown';
            state.countdown = 3.0;
            state.countdownStartTime = performance.now();
            waitingText.style.display = 'none';
            countdownTimer.style.display = 'block';
            haptic('heavy');
            updateBetUI();
        }

        function startPrestart() {
            state.gameState = 'prestart';
            state.prestartTimer = 2.0;
            countdownTimer.textContent = 'GO!';
            haptic('heavy');
        }

        function startGame() {
            state.gameState = 'playing';
            state.gameTime = 0;
            state.openingTimer = 0;
            state.opening = null;
            state.winnerId = null;
            betOverlay.classList.add('hidden');
            waitingText.style.display = 'none';
            countdownTimer.style.display = 'none';

            const alive = getAlive();
            const half = state.arenaSize / 2;
            alive.forEach((p, i) => {
                const angle = (i / alive.length) * Math.PI * 2 + Math.random() * 0.3;
                const baseSpeed = speedForRadius(p.displayRadius || p.radius);
                const speed = baseSpeed * (0.9 + Math.random() * 0.2);
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.x = half + Math.cos(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.y = half + Math.sin(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.alive = true;
                p.isPopping = false;
            });
            state.openingTimer = 3.0 + Math.random() * 1.5;
            updatePlayerList();
        }

        function endGame(winnerId) {
            if (state.gameState === 'finished') return;
            state.gameState = 'finished';
            state.winnerId = winnerId;
            const winner = getPlayer(winnerId);

            if (winner) {
                const totalPot = state.pot;
                const winnerBet = winner.bet;
                const losersBets = totalPot - winnerBet;
                const commission = Math.floor(losersBets * 0.02);
                const winnings = totalPot - commission;

                if (winner.id === state.userId) {
                    state.balance += winnings;
                    state.wins++;
                } else {
                    state.losses++;
                }
                updateBalance();
                updateProfile();
                updateTopList();

                const randomGif = WIN_GIFS[Math.floor(Math.random() * WIN_GIFS.length)];
                winGif.src = randomGif;
                winAvatar.src = winner.pfp;
                winName.textContent = winner.name + ' wins!';
                winMultiplier.textContent = 'x' + (winnings / winnerBet).toFixed(1);

                winPanel.classList.add('show');
                haptic('heavy');

                state.pot = 0;
                state.opening = null;
                updatePlayerList();

                if (window.winTimeout) clearTimeout(window.winTimeout);
                window.winTimeout = setTimeout(() => {
                    hideWinPanelAndReset();
                }, 3000);

            } else {
                state.gameState = 'idle';
                state.players = [];
                state.botSpawned = false;
                state.opening = null;
                betOverlay.classList.remove('hidden');
                waitingText.style.display = 'block';
                countdownTimer.style.display = 'none';
                updateWaitingText();
                updateBetUI();
                updateStatsBar();
                updatePlayerList();
            }
        }

        function hideWinPanelAndReset() {
            winPanel.classList.remove('show');
            if (window.winTimeout) {
                clearTimeout(window.winTimeout);
                window.winTimeout = null;
            }
            state.players = [];
            state.gameState = 'idle';
            state.botSpawned = false;
            state.opening = null;
            state.pot = 0;
            betOverlay.classList.remove('hidden');
            waitingText.style.display = 'block';
            countdownTimer.style.display = 'none';
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            updatePlayerList();
            if (state.botEnabled) spawnBot();
        }

        winContinueBtn.addEventListener('click', () => {
            hideWinPanelAndReset();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PHYSICS (with haptic on bump)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updatePhysics(dt) {
            if (state.gameState !== 'playing') return;
            state.gameTime += dt;

            const alive = getAlive();
            if (alive.length <= 1) {
                if (alive.length === 1) endGame(alive[0].id);
                else {
                    state.gameState = 'idle';
                    state.players = [];
                    state.botSpawned = false;
                    state.opening = null;
                    betOverlay.classList.remove('hidden');
                    waitingText.style.display = 'block';
                    countdownTimer.style.display = 'none';
                    updateWaitingText();
                    updateBetUI();
                    updateStatsBar();
                    updatePlayerList();
                }
                return;
            }

            const size = state.arenaSize;
            const pts = state.perimeterPoints;
            const totalPts = pts.length;
            const half = size / 2;

            state.openingTimer -= dt;
            if (state.openingTimer <= 0) {
                if (!state.opening) {
                    const gameTime = state.gameTime;
                    let minGap, maxGap;
                    if (gameTime < 4) {
                        minGap = 0.08;
                        maxGap = 0.18;
                    } else {
                        minGap = 0.15;
                        maxGap = 0.35;
                    }
                    const gapSize = Math.floor((minGap + Math.random() * (maxGap - minGap)) * totalPts);
                    const startIdx = Math.floor(Math.random() * totalPts);
                    const endIdx = (startIdx + gapSize) % totalPts;
                    state.opening = {
                        startIdx: startIdx,
                        endIdx: endIdx,
                        flashCount: 0,
                        flashTimer: 0,
                        state: 'flashing',
                        _total: totalPts,
                    };
                    state.openingTimer = 3.5 + Math.random() * 2.5;
                    haptic('light');
                } else {
                    state.opening = null;
                    state.openingTimer = 1.5 + Math.random() * 2.0;
                }
            }

            const opening = state.opening;
            if (opening && opening.state === 'flashing') {
                opening.flashTimer += dt;
                if (opening.flashTimer > 0.25) {
                    opening.flashTimer = 0;
                    opening.flashCount++;
                    if (opening.flashCount >= 4) {
                        opening.state = 'open';
                        haptic('medium');
                    }
                }
            }

            function isInGap(idx) {
                if (!opening) return false;
                if (opening.state !== 'open') return false;
                const start = opening.startIdx;
                const end = opening.endIdx;
                if (start < end) {
                    return idx >= start && idx <= end;
                } else {
                    return idx >= start || idx <= end;
                }
            }

            const subSteps = 6;
            const subDt = dt / subSteps;

            for (let step = 0; step < subSteps; step++) {
                alive.forEach(p => {
                    p.x += p.vx * subDt * 60;
                    p.y += p.vy * subDt * 60;

                    const radius = p.displayRadius || p.radius;
                    for (let i = 0; i < totalPts; i++) {
                        const j = (i + 1) % totalPts;
                        if (opening && opening.state === 'open' && isInGap(i) && isInGap(j)) continue;
                        const ax = pts[i].x,
                            ay = pts[i].y;
                        const bx = pts[j].x,
                            by = pts[j].y;
                        const dx = bx - ax,
                            dy = by - ay;
                        const lenSq = dx * dx + dy * dy;
                        if (lenSq === 0) continue;
                        let t = ((p.x - ax) * dx + (p.y - ay) * dy) / lenSq;
                        t = Math.max(0, Math.min(1, t));
                        const nearX = ax + t * dx;
                        const nearY = ay + t * dy;
                        const distX = p.x - nearX;
                        const distY = p.y - nearY;
                        const dist = Math.sqrt(distX * distX + distY * distY);
                        if (dist < radius) {
                            const nx = distX / dist;
                            const ny = distY / dist;
                            const overlap = radius - dist;
                            p.x += nx * overlap;
                            p.y += ny * overlap;
                            const vn = p.vx * nx + p.vy * ny;
                            if (vn < 0) {
                                p.vx -= 2 * vn * nx;
                                p.vy -= 2 * vn * ny;
                            }
                            break;
                        }
                    }

                    if (opening && opening.state === 'open') {
                        const cx = half,
                            cy = half;
                        const dx = p.x - cx,
                            dy = p.y - cy;
                        const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                        const escapeThreshold = half * 1.2 + radius;
                        if (distFromCenter > escapeThreshold) {
                            let nearestGapIdx = -1;
                            let minDist = Infinity;
                            for (let i = 0; i < totalPts; i++) {
                                if (isInGap(i)) {
                                    const d = (p.x - pts[i].x) ** 2 + (p.y - pts[i].y) ** 2;
                                    if (d < minDist) {
                                        minDist = d;
                                        nearestGapIdx = i;
                                    }
                                }
                            }
                            if (nearestGapIdx >= 0) {
                                const angle = Math.atan2(dy, dx);
                                const gapAngle = Math.atan2(pts[nearestGapIdx].y - cy, pts[nearestGapIdx].x - cx);
                                let diff = Math.abs(angle - gapAngle);
                                diff = Math.min(diff, 2 * Math.PI - diff);
                                const vOut = p.vx * dx + p.vy * dy;
                                if (diff < 0.8 && vOut > 0) {
                                    p.alive = false;
                                    haptic('medium');
                                    updatePlayerList();
                                    return;
                                }
                            }
                        }
                    }
                });

                // Circle collisions with haptic
                for (let i = 0; i < alive.length; i++) {
                    for (let j = i + 1; j < alive.length; j++) {
                        const a = alive[i],
                            b = alive[j];
                        const dx = b.x - a.x,
                            dy = b.y - a.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const rA = a.displayRadius || a.radius;
                        const rB = b.displayRadius || b.radius;
                        const minDist = rA + rB;
                        if (dist < minDist && dist > 0.001) {
                            haptic('light');
                            const nx = dx / dist,
                                ny = dy / dist;
                            const overlap = (minDist - dist) * 0.5;
                            a.x -= nx * overlap;
                            a.y -= ny * overlap;
                            b.x += nx * overlap;
                            b.y += ny * overlap;
                            const dvx = a.vx - b.vx,
                                dvy = a.vy - b.vy;
                            const dvn = dvx * nx + dvy * ny;
                            if (dvn > 0) {
                                const impulse = 2 * dvn / (1 / a.mass + 1 / b.mass);
                                a.vx -= impulse / a.mass * nx;
                                a.vy -= impulse / a.mass * ny;
                                b.vx += impulse / b.mass * nx;
                                b.vy += impulse / b.mass * ny;
                            }
                        }
                    }
                }

                alive.forEach(p => {
                    const maxSp = speedForRadius(p.displayRadius || p.radius);
                    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (sp > maxSp) {
                        p.vx = (p.vx / sp) * maxSp;
                        p.vy = (p.vy / sp) * maxSp;
                    }
                    const minSp = 3.0;
                    if (sp < minSp && sp > 0.01) {
                        const ratio = minSp / sp;
                        p.vx *= ratio;
                        p.vy *= ratio;
                    }
                });
            }

            botAI(dt);
            updatePlayerList(); // update chances live
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            const w = state.arenaSize;
            const half = w / 2;
            ctx.clearRect(0, 0, w, w);

            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            const pts = state.perimeterPoints;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#1a1a1e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#28282e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            const opening = state.opening;
            const isFlashing = opening && opening.state === 'flashing';
            const isOpen = opening && opening.state === 'open';
            const total = pts.length;

            ctx.save();
            const hasGap = opening !== null && (isFlashing || isOpen);

            if (hasGap) {
                const start = opening.startIdx;
                const end = opening.endIdx;

                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;

                for (let i = 0; i < total; i++) {
                    const j = (i + 1) % total;
                    let inGap = false;
                    if (start < end) {
                        if (i >= start && i < end) inGap = true;
                        if (j >= start && j < end) inGap = true;
                    } else {
                        if (i >= start || i < end) inGap = true;
                        if (j >= start || j < end) inGap = true;
                    }
                    if (inGap) continue;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }

                if (isFlashing) {
                    const isRed = (opening.flashCount % 2 === 0);
                    ctx.save();

                    const flashColor = isRed ? '#ff0044' : 'rgba(160,160,176,0.25)';

                    let gapSegments = [];
                    if (start < end) {
                        for (let i = start; i < end; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                    } else {
                        for (let i = start; i < total; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                        for (let i = 0; i < end; i++) {
                            const j = (i + 1) % total;
                            gapSegments.push({ i, j });
                        }
                    }

                    ctx.strokeStyle = flashColor;
                    ctx.lineWidth = isRed ? 5 : 3;
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';

                    for (const seg of gapSegments) {
                        ctx.beginPath();
                        ctx.moveTo(pts[seg.i].x, pts[seg.i].y);
                        ctx.lineTo(pts[seg.j].x, pts[seg.j].y);
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            } else {
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.stroke();
            }

            ctx.restore();

            // ── PLAYERS ──
            state.players.forEach(p => {
                const isAlive = p.alive;
                const popScale = getPopScale(p);
                const radius = isAlive ? (p.displayRadius || p.radius) : (p.displayRadius || p.radius) * 0.5;
                const displayRadius = radius * popScale;
                const alpha = isAlive ? 1 : 0.2;

                let pulseScale = 1;
                if (p.isPulsing) {
                    const t = p.pulseTime;
                    if (t < 0.6) {
                        const phase = t / 0.6;
                        pulseScale = 1 + 0.12 * Math.sin(phase * Math.PI * 3) * (1 - phase);
                    }
                }
                const finalRadius = displayRadius * pulseScale;

                ctx.save();
                ctx.globalAlpha = alpha;

                if (p.pfpLoaded && p.pfpImg) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(finalRadius - 2, 2), 0, Math.PI * 2);
                    ctx.clip();
                    const drawSize = Math.max(finalRadius - 2, 2) * 2;
                    ctx.drawImage(p.pfpImg, p.x - (finalRadius - 2), p.y - (finalRadius - 2), drawSize, drawSize);
                    ctx.restore();
                } else {
                    // Fallback: colored circle with initial
                    ctx.fillStyle = p.color || '#a0a0b0';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(finalRadius - 2, 2), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.max(finalRadius * 0.5, 6)}px system-ui, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.name.charAt(0).toUpperCase(), p.x, p.y);
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, finalRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                ctx.stroke();

                ctx.restore();
            });

            ctx.shadowBlur = 0;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // UI UPDATES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateBalance() {
            const target = Math.floor(state.balance);
            pBalance.textContent = target;
            animateBalanceTo(target);
        }

        function updateProfile() {
            pWins.textContent = state.wins;
            pLosses.textContent = state.losses;
            const total = state.wins + state.losses;
            pWinrate.textContent = total > 0 ? Math.round((state.wins / total) * 100) + '%' : '0%';
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            if (state.pfp) profilePfp.src = state.pfp;
            updateBalance();
        }

        function updateStatsBar() {
            const alive = getAlive();
            statsPlayers.textContent = alive.length;
            statsPot.textContent = state.pot;
        }

        function updateWaitingText() {
            const alive = getAlive();
            if (alive.length === 0) {
                waitingText.innerHTML = '<span>waiting for players</span><div class="sub">place a bet to join</div>';
            } else {
                waitingText.innerHTML =
                    `<span>● ${alive.length} player${alive.length > 1 ? 's' : ''} ready</span><div class="sub">need ${Math.max(0, 2 - alive.length)} more to start</div>`;
            }
            if (alive.length >= 2 && state.gameState === 'idle') startCountdown();
            updateStatsBar();
        }

        function updateBetUI() {
            const existing = state.players.find(p => p.id === state.userId);
            const inGame = !!existing;
            const canBet = (state.gameState === 'idle' || state.gameState === 'countdown' || state.gameState === 'prestart');

            if (canBet) {
                betBtn.textContent = inGame ? 'increase' : 'join';
                betBtn.disabled = false;
                betInput.disabled = false;
            } else {
                betBtn.textContent = inGame ? 'in game' : 'waiting';
                betBtn.disabled = true;
                betInput.disabled = true;
            }

            if (existing) {
                currentBetDisplay.textContent = existing.bet;
            } else {
                currentBetDisplay.textContent = '0';
            }

            const val = parseInt(betInput.value) || 10;
            betAmountDisplay.textContent = Math.min(val, state.balance);
            if (betInput.value === '' || parseInt(betInput.value) < 10) {
                betInput.value = 10;
            }
        }

        function updateTopList() {
            const entries = [];
            entries.push({ name: state.username, pfp: state.pfp || '', wins: state.wins, score: state.balance,
                isUser: true });
            state.players.forEach(p => {
                if (p.id.startsWith('bot_')) {
                    entries.push({ name: p.name, pfp: p.pfp || '', wins: Math.floor(Math.random() * 8) + 1,
                        score: Math.floor(Math.random() * 300) + 50, isUser: false });
                }
            });
            const mock = ['CryptoKing', 'DiamondHands', 'BumpMaster', 'LuckyStar', 'MoonRider'];
            for (let i = 0; i < 4; i++) {
                if (entries.length < 14) {
                    entries.push({ name: mock[i % mock.length] + (i > 2 ? i : ''), pfp: 'https://i.pravatar.cc/100?img=' + (
                            i + 20), wins: Math.floor(Math.random() * 25) + 3, score: Math.floor(Math.random() *
                            1500) + 80, isUser: false });
                }
            }
            entries.sort((a, b) => b.score - a.score);
            if (entries.length === 0) { topList.innerHTML = '<div class="no-players-msg">no players yet</div>'; return; }
            let html = '';
            entries.slice(0, 18).forEach((e, i) => {
                const rank = i + 1;
                let rClass = 'rank';
                if (rank === 1) rClass += ' gold';
                else if (rank === 2) rClass += ' silver';
                else if (rank === 3) rClass += ' bronze';
                const tag = e.isUser ? ' (you)' : '';
                const pfpSrc = e.pfp || 'https://i.pravatar.cc/32?img=' + (i + 30);
                html += `<div class="top-entry" style="${e.isUser ? 'border-color:var(--primary);' : ''}">
                        <div class="${rClass}">#${rank}</div>
                        <img class="t-pfp" src="${pfpSrc}" alt="" />
                        <div class="t-name">${e.name}${tag}</div>
                        <div class="t-wins">● ${e.wins}</div>
                        <div class="t-score">${e.score}</div>
                    </div>`;
            });
            topList.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TAB SWITCHING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function switchTab(tabId) {
            if (state.currentTab === tabId) return;
            const oldTab = state.currentTab;
            state.currentTab = tabId;

            const oldEl = tabPages[oldTab];
            if (oldEl) {
                oldEl.classList.remove('active');
                oldEl.classList.add('exit');
                setTimeout(() => {
                    oldEl.classList.remove('exit');
                }, 350);
            }

            const newEl = tabPages[tabId];
            if (newEl) {
                setTimeout(() => {
                    newEl.classList.add('active');
                    if (tabId === 'profile') updateProfile();
                    if (tabId === 'top') updateTopList();
                }, 50);
            }

            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });

            haptic('light');
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const tab = this.dataset.tab;
                switchTab(tab);
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let lastTime = 0;
        let accumulator = 0;
        const fixedTimestep = 1 / 60;

        function gameLoop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            updatePlayerAnimations();

            if (state.gameState === 'playing') {
                accumulator += dt;
                while (accumulator >= fixedTimestep) {
                    updatePhysics(fixedTimestep);
                    accumulator -= fixedTimestep;
                }
            }

            if (state.gameState === 'countdown') {
                const elapsed = (performance.now() - state.countdownStartTime) / 1000;
                let remaining = Math.max(0, 3.0 - elapsed);
                if (remaining <= 0) {
                    startPrestart();
                } else {
                    const secs = Math.floor(remaining);
                    const ms = Math.floor((remaining - secs) * 100);
                    countdownTimer.textContent = secs + '.' + String(ms).padStart(2, '0');
                }
            }

            if (state.gameState === 'prestart') {
                state.prestartTimer -= dt;
                if (state.prestartTimer <= 0) {
                    startGame();
                } else {
                    countdownTimer.textContent = 'GO!';
                }
            }

            if (state.gameState === 'idle') {
                if (!state.botSpawned && state.players.length === 0) {
                    setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
                }
                if (getAlive().length >= 2) startCountdown();
            }

            updateStatsBar();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getPlayer(id) { return state.players.find(p => p.id === id); }

        function getAlive() { return state.players.filter(p => p.alive); }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        betBtn.addEventListener('click', () => {
            if (state.gameState !== 'idle' && state.gameState !== 'countdown' && state.gameState !== 'prestart') return;
            let addAmount = parseInt(betInput.value) || 10;
            if (addAmount < 10) { betInput.value = 10;
                addAmount = 10;
                haptic('light'); }
            if (addAmount > state.balance) { betInput.value = state.balance;
                addAmount = state.balance;
                haptic('light'); }

            const existing = state.players.find(p => p.id === state.userId);
            if (existing) {
                state.balance -= addAmount;
                existing.bet += addAmount;
                state.pot += addAmount;
                computeRadii();
                triggerPulse(existing);
                updateBalance();
                updateBetUI();
                updateProfile();
                updatePlayerList();
                haptic('medium');
            } else {
                if (addAmount > state.balance) { betInput.value = state.balance;
                    addAmount = state.balance;
                    haptic('light'); }
                const player = makePlayer(state.userId, addAmount, state.username, state.pfp);
                state.balance -= addAmount;
                state.pot += addAmount;
                updateBalance();
                updateBetUI();
                updateWaitingText();
                updateProfile();
                updatePlayerList();
                haptic('medium');
                if (!state.botSpawned && state.botEnabled) {
                    setTimeout(() => { if (state.botEnabled && (state.gameState === 'idle' || state.gameState ===
                            'countdown' || state.gameState === 'prestart')) spawnBot(); }, 400);
                }
            }
            betInput.value = 10;
            updateBetUI();
        });

        betInput.addEventListener('input', () => {
            let val = parseInt(betInput.value) || 0;
            if (val < 10) betInput.value = 10;
            if (val > state.balance) betInput.value = state.balance;
            betAmountDisplay.textContent = (parseInt(betInput.value) || 10);
            if (betInput.value === '' || parseInt(betInput.value) < 10) betInput.value = 10;
        });

        betInput.value = 10;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                state.username = u.username || u.first_name || 'player';
                state.userId = u.id?.toString() || state.userId;
                state.pfp = u.photo_url || '';
                if (state.pfp) {
                    try { new URL(state.pfp); } catch (_) { state.pfp = ''; }
                }
            } else {
                state.username = 'test_user';
                state.pfp = 'https://i.pravatar.cc/100?img=69';
            }
            usernameDisplay.textContent = '@' + state.username;
            if (state.pfp) {
                profilePfp.src = state.pfp;
                // Preload into cache
                loadImageWithFallback(state.pfp);
            } else {
                profilePfp.src = state.defaultAvatar;
            }
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            updateBalance();
            updateProfile();
            updateTopList();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
            Object.keys(tabPages).forEach(key => {
                tabPages[key].classList.toggle('active', key === 'pvp');
            });
            document.getElementById('tabs').style.pointerEvents = 'auto';
            tabBtns.forEach(b => b.style.pointerEvents = 'auto');
            requestAnimationFrame(gameLoop);
            statusDot.className = 'online';
        }
        init();

        window.__state = state;
        console.log('◆ dllump – perfect: PFPs fixed, player list, timer top-right, prestart, haptic on bumps');
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Stars Payment</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--tg-theme-bg-color, #17212b);
  color: var(--tg-theme-text-color, white);
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  width: 90%;
  max-width: 360px;
  text-align: center;
  padding: 28px;
  border-radius: 22px;
  background: var(--tg-theme-secondary-bg-color, #202d3b);
}
.star {
  font-size: 65px;
  margin-bottom: 12px;
}
h2 {
  margin: 5px 0;
  font-size: 24px;
}
p {
  color: var(--tg-theme-hint-color, #aab5c4);
  font-size: 14px;
}
.price {
  font-size: 30px;
  font-weight: bold;
  margin: 25px 0;
}
button {
  border: none;
  width: 100%;
  padding: 16px;
  border-radius: 13px;
  background: #3390ec;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
}
#status {
  margin-top: 18px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
  <div class="star">⭐</div>
  <h2>Get your Stars</h2>
  <p>Complete your purchase securely through Telegram.</p>

  <div class="price">10 ⭐</div>

  <button id="payButton">Pay 10 Stars</button>
  <div id="status"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const button = document.getElementById("payButton");
const status = document.getElementById("status");

// Insert your backend-generated Telegram invoice link here.
const INVOICE_URL = "YOUR_INVOICE_URL";

button.addEventListener("click", () => {
  if (!INVOICE_URL || INVOICE_URL === "YOUR_INVOICE_URL") {
    status.textContent = "Payment invoice is not configured.";
    return;
  }

  button.disabled = true;
  status.textContent = "Opening Telegram payment...";

  tg.openInvoice(INVOICE_URL, (result) => {
    button.disabled = false;

    if (result === "paid") {
      status.textContent = "✅ Payment successful!";
      tg.HapticFeedback.notificationOccurred("success");
    } else if (result === "cancelled") {
      status.textContent = "Payment cancelled.";
    } else if (result === "failed") {
      status.textContent = "❌ Payment failed.";
    } else {
      status.textContent = "Payment closed.";
    }
  });
});
</script>

</body>
</html>

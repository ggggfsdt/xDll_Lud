<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>dllump · bump arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --bg: #08080a;
            --surface: #121214;
            --surface2: #1a1a1e;
            --surface3: #242428;
            --primary: #4CAF50;
            --primary-dim: rgba(76, 175, 80, 0.25);
            --primary-glow: rgba(76, 175, 80, 0.45);
            --text: #e8e8e8;
            --text2: #888;
            --border: #2a2a2e;
            --gold: #c8a84e;
            --gold-dim: rgba(200, 168, 78, 0.2);
            --red: #d45a5a;
            --green: #5ac88a;
            --radius: 16px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --shadow: 0 8px 48px rgba(0, 0, 0, 0.8);
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 440px;
            margin: 0 auto;
            background: var(--bg);
            overflow: hidden;
        }
        /* top bar */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 52px;
            z-index: 10;
            gap: 8px;
        }
        #balance-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            padding: 3px 14px 3px 6px;
            border-radius: 28px;
            border: 1px solid var(--border);
        }
        #diamond-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
            animation: diamondGlow 2.8s ease-in-out infinite;
            display: block;
        }
        @keyframes diamondGlow {
            0%,
            100% { filter: drop-shadow(0 0 6px rgba(200, 168, 78, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(200, 168, 78, 0.7)) brightness(1.15); }
        }
        #balance {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            font-variant-numeric: tabular-nums;
        }
        #top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            transition: 0.3s;
        }
        #status-dot.offline {
            background: var(--red);
            box-shadow: 0 0 12px var(--red);
        }
        #username-display {
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        .tab-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, visibility 0.35s ease;
            overflow: hidden;
            background: var(--bg);
            will-change: transform, opacity;
        }
        .tab-page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 2;
        }
        .tab-page.exit {
            opacity: 0;
            transform: translateX(-30px);
            z-index: 1;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s 0.3s;
        }

        #pvp-page {
            background: var(--bg);
        }
        #arena-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 10px 0 10px;
            min-height: 0;
        }
        #game-canvas {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius);
            background: var(--surface);
            touch-action: none;
            display: block;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(76, 175, 80, 0.05);
        }

        #countdown-timer {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.4), 0 0 40px rgba(0, 0, 0, 0.8);
            z-index: 3;
            pointer-events: none;
            display: none;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px 10px 14px;
            flex-shrink: 0;
            color: var(--text2);
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border-top: 1px solid var(--border);
            margin-top: 0;
        }
        #stats-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #stats-bar .stat-item .icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        #stats-bar .stat-item .value {
            color: #fff;
            font-weight: 700;
        }
        #stats-bar .stat-item .label {
            color: var(--text2);
            font-size: 12px;
            margin-right: 2px;
        }

        #waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            text-align: center;
            color: var(--text2);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.7;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            line-height: 1.6;
        }
        #waiting-text .sub {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 2px;
        }

        #winner-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 7;
            border-radius: var(--radius);
            flex-direction: column;
            gap: 6px;
            padding: 20px;
        }
        #winner-overlay.show {
            display: flex;
        }
        #winner-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 40px var(--gold-dim);
            text-align: center;
        }
        #winner-sub {
            font-size: 15px;
            color: var(--text2);
            margin-top: 2px;
        }
        #winner-close-btn {
            margin-top: 14px;
            padding: 10px 36px;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--primary-glow);
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        #winner-close-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }

        #bet-overlay {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            z-index: 5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: 0.3s;
            flex-wrap: wrap;
            justify-content: center;
            min-width: 280px;
        }
        #bet-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(16px);
        }
        #bet-info {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0px;
            min-width: 70px;
        }
        #bet-info .label {
            font-size: 9px;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.6px;
        }
        #bet-info .value {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
        }
        #bet-input {
            width: 60px;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface3);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }
        #bet-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 24px var(--primary-dim);
        }
        #bet-btn {
            padding: 6px 18px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 24px var(--primary-glow);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        #bet-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }
        #bet-btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        #current-bet-display {
            color: var(--text2);
            font-size: 12px;
            width: 100%;
            text-align: center;
            margin-top: 2px;
            border-top: 1px solid var(--border);
            padding-top: 4px;
        }
        #current-bet-display span {
            color: var(--gold);
            font-weight: 700;
        }

        #profile-page {
            background: var(--bg);
            padding: 20px 16px 10px;
            overflow-y: auto;
            align-items: center;
        }
        .profile-card {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px 20px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
        }
        .profile-pfp {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--surface2);
            border: 2px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 40px var(--primary-dim);
        }
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-top: 2px;
        }
        .profile-username {
            font-size: 14px;
            color: var(--text2);
        }
        .profile-status {
            font-size: 13px;
            padding: 2px 18px;
            border-radius: 30px;
            background: var(--surface2);
            color: var(--text2);
            border: 1px solid var(--border);
            margin-top: 2px;
        }
        .profile-divider {
            width: 70%;
            height: 1px;
            background: var(--border);
            margin: 6px 0 4px;
        }
        .profile-stats {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            width: 100%;
            justify-content: center;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-item .lbl {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        .stat-item .num.win {
            color: var(--green);
        }
        .stat-item .num.loss {
            color: var(--red);
        }
        .stat-item .num.rate {
            color: var(--primary);
        }
        #p-balance {
            color: var(--gold);
            font-weight: 700;
        }

        #top-page {
            background: var(--bg);
            padding: 14px 14px 10px;
            overflow-y: auto;
        }
        #top-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .top-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border-radius: 12px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .top-entry .rank {
            font-size: 16px;
            font-weight: 800;
            color: var(--text2);
            min-width: 28px;
            text-align: center;
        }
        .top-entry .rank.gold {
            color: var(--gold);
        }
        .top-entry .rank.silver {
            color: #b8b8c8;
        }
        .top-entry .rank.bronze {
            color: #cd8a5a;
        }
        .top-entry .t-pfp {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .top-entry .t-name {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .top-entry .t-wins {
            font-size: 12px;
            color: var(--text2);
            white-space: nowrap;
        }
        .top-entry .t-score {
            font-weight: 700;
            color: var(--gold);
            font-size: 14px;
            white-space: nowrap;
        }

        #tabs {
            display: flex;
            flex-shrink: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
            padding-top: 2px;
            z-index: 10;
            position: relative;
        }
        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            gap: 1px;
            position: relative;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .tab-btn .tab-icon {
            font-size: 20px;
            line-height: 1.2;
            transition: 0.2s;
            opacity: 0.7;
        }
        .tab-btn.active {
            color: #ffffff !important;
        }
        .tab-btn.active .tab-icon {
            opacity: 1;
            transform: translateY(-1px);
            color: #ffffff !important;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 30%;
            right: 30%;
            height: 2px;
            border-radius: 0 0 4px 4px;
            background: #ffffff;
            opacity: 0;
            transition: 0.3s;
        }
        .tab-btn.active::after {
            opacity: 1;
            left: 15%;
            right: 15%;
        }
        .tab-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .tab-btn.active .tab-icon svg {
            stroke: #ffffff !important;
        }

        .no-players-msg {
            text-align: center;
            color: var(--text2);
            padding: 40px 0;
            opacity: 0.4;
            font-size: 14px;
        }

        @media (max-width: 400px) {
            #balance-wrap { padding: 2px 10px 2px 4px; }
            #balance { font-size: 15px; }
            #diamond-icon { width: 22px; height: 22px; }
            #bet-overlay { padding: 6px 12px; gap: 6px; bottom: 12px; min-width: auto; width: calc(100% - 24px); }
            #bet-input { width: 48px; font-size: 13px; padding: 4px 4px; }
            #bet-btn { padding: 4px 12px; font-size: 12px; }
            #bet-info .value { font-size: 12px; }
            .profile-card { padding: 16px 14px 20px; }
            .profile-pfp { width: 60px; height: 60px; }
            .profile-name { font-size: 17px; }
            .stat-item .num { font-size: 18px; }
            #winner-text { font-size: 22px; }
            #username-display { max-width: 60px; font-size: 11px; }
            #countdown-timer { font-size: 16px; top: 4px; right: 4px; }
            #stats-bar { font-size: 12px; padding: 4px 10px; }
            #stats-bar .stat-item .icon { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- top bar -->
        <div id="topbar">
            <div id="balance-wrap">
                <img id="diamond-icon" src="https://i.postimg.cc/gjf8MC89/Snimok-ekrana-2026-07-07-143049-Photoroom.png" alt="diamond" />
                <span id="balance">1000</span>
            </div>
            <div id="top-right">
                <span id="username-display">player</span>
                <div id="status-dot"></div>
            </div>
        </div>

        <!-- main -->
        <div id="main">
            <div id="pvp-page" class="tab-page active">
                <div id="arena-wrap">
                    <canvas id="game-canvas"></canvas>
                    <div id="countdown-timer">3.00</div>
                    <div id="waiting-text"><span>waiting for players</span><div class="sub">place a bet to join</div></div>
                    <div id="winner-overlay">
                        <div id="winner-text">winner</div>
                        <div id="winner-sub">+0</div>
                        <button id="winner-close-btn">play again</button>
                    </div>
                    <div id="bet-overlay">
                        <div id="bet-info">
                            <span class="label">add</span>
                            <span class="value" id="bet-amount-display">10</span>
                        </div>
                        <input type="number" id="bet-input" value="10" min="1" max="9999" />
                        <button id="bet-btn">join</button>
                        <div id="current-bet-display">your bet: <span id="current-bet-value">0</span></div>
                    </div>
                </div>
                <div id="stats-bar">
                    <div class="stat-item">
                        <span class="label">Players</span>
                        <span class="value" id="stats-players">0</span>
                    </div>
                    <div class="stat-item">
                        <img src="https://i.postimg.cc/gjf8MC89/Snimok-ekrana-2026-07-07-143049-Photoroom.png" class="icon" alt="⭐" />
                        <span class="value" id="stats-pot">0</span>
                    </div>
                </div>
            </div>

            <div id="profile-page" class="tab-page">
                <div class="profile-card fade-in">
                    <img class="profile-pfp" id="profile-pfp" src="" alt="avatar" />
                    <div class="profile-name" id="profile-name">Player</div>
                    <div class="profile-username" id="profile-username">@username</div>
                    <div class="profile-status" id="profile-status">online</div>
                    <div class="profile-divider"></div>
                    <div class="profile-stats">
                        <div class="stat-item"><div class="num win" id="p-wins">0</div><div class="lbl">wins</div></div>
                        <div class="stat-item"><div class="num loss" id="p-losses">0</div><div class="lbl">losses</div></div>
                        <div class="stat-item"><div class="num rate" id="p-winrate">0%</div><div class="lbl">winrate</div></div>
                    </div>
                    <div class="profile-divider"></div>
                    <div style="font-size:13px;color:var(--text2);opacity:0.6;margin-top:2px;">balance: <span id="p-balance" style="color:var(--gold);font-weight:700;">1000</span></div>
                </div>
            </div>

            <div id="top-page" class="tab-page">
                <div id="top-list"><div class="no-players-msg">no players yet</div></div>
            </div>
        </div>

        <!-- tabs -->
        <div id="tabs">
            <button class="tab-btn active" data-tab="pvp">
                <span class="tab-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M6 8 L18 8 L16 20 L8 20 Z" /><path d="M10 8 L14 8" /><path d="M12 8 L12 3" /><path d="M8 3 L10 6" /><path d="M16 3 L14 6" /></svg></span>PvP</button>
            <button class="tab-btn" data-tab="profile">
                <span class="tab-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><circle cx="12" cy="8" r="5" /><path d="M4 20 L4 18 C4 14 7 12 12 12 C17 12 20 14 20 18 L20 20" /></svg></span>Profile</button>
            <button class="tab-btn" data-tab="top">
                <span class="tab-icon"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M12 3 L14.5 8.5 L20.5 9.5 L16 13.5 L17 19.5 L12 16.5 L7 19.5 L8 13.5 L3.5 9.5 L9.5 8.5 L12 3 Z" /></svg></span>Top</button>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TELEGRAM
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand();
            tg.enableClosingConfirmation(); }

        function haptic(style = 'light') {
            try {
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
                else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
            } catch (_) {}
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STATE

            players: [],

            pot: 0,
            arenaSize: 0,

            winnerId: null,
            countdown: 3.0,
            countdownStartTime: 0,
            openingTimer: 0,

            gameTime: 0,
            lastTime: 0,

        };

        // DOM refs
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const balanceEl = document.getElementById('balance');
        const usernameDisplay = document.getElementById('username-display');
        const statusDot = document.getElementById('status-dot');

        };

        // Colors – vibrant for circles
        const COLORS = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD',
            '#D4A5A5', '#9B59B6', '#FF8C00', '#00B894', '#E17055',
            '#0984E3', '#FDCB6E', '#E84393', '#00CEC9', '#6C5CE7'
        ];

        function getColor(i) { return COLORS[i % COLORS.length]; }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CANVAS SIZING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width - 16, rect.height - 16, 440);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            state.arenaSize = size;
            state.cornerRadius = size * 0.15;
            ctx.scale(dpr, dpr);
            const half = size / 2;
            state.players.forEach(p => {
                if (p.x === undefined || p.x === 0) {
                    p.x = half + (Math.random() - 0.5) * (size * 0.4);
                    p.y = half + (Math.random() - 0.5) * (size * 0.4);
                }
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ROUNDED RECT SDF (ACCURATE HITBOX)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function sdfRoundedRect(px, py, size, r) {
            const half = size / 2;
            const cx = size / 2,
                cy = size / 2;
            const dx = Math.abs(px - cx);
            const dy = Math.abs(py - cy);
            const qx = dx - half + r;
            const qy = dy - half + r;
            if (qx < 0 && qy < 0) {
                return -Math.min(Math.max(qx, qy), 0);
            }
            return Math.sqrt(Math.max(qx, 0) * Math.max(qx, 0) + Math.max(qy, 0) * Math.max(qy, 0)) - r;
        }

        function normalRoundedRect(px, py, size, r) {
            const half = size / 2;
            const cx = size / 2,
                cy = size / 2;
            const dx = px - cx,
                dy = py - cy;
            const adx = Math.abs(dx),
                ady = Math.abs(dy);
            const qx = adx - half + r;
            const qy = ady - half + r;
            if (qx < 0 && qy < 0) {
                const distX = half - r - adx;
                const distY = half - r - ady;
                if (distX < distY) return { nx: Math.sign(dx), ny: 0 };
                else return { nx: 0, ny: Math.sign(dy) };
            }
            const eps = 0.02;
            const d0 = sdfRoundedRect(px, py, size, r);
            const ddx = sdfRoundedRect(px + eps, py, size, r) - d0;
            const ddy = sdfRoundedRect(px, py + eps, size, r) - d0;
            const len = Math.sqrt(ddx * ddx + ddy * ddy);
            if (len < 0.0001) return { nx: 0, ny: -1 };
            return { nx: ddx / len, ny: ddy / len };
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER FACTORY
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function computeRadii() {
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            if (totalBet === 0) return;
            state.players.forEach(p => {
                const ratio = p.bet / totalBet;
                const r = 18 + ratio * 34;
                p.radius = Math.min(Math.max(r, 14), 52);
                p.mass = p.radius * p.radius * 1.2;
            });
        }

        function makePlayer(id, bet, name, pfp) {
            const half = state.arenaSize / 2;
            const radius = 18;
            let x, y, attempts = 0,
                overlap = true;
            while (overlap && attempts < 100) {
                x = half + (Math.random() - 0.5) * (state.arenaSize * 0.7);
                y = half + (Math.random() - 0.5) * (state.arenaSize * 0.7);
                overlap = state.players.some(p => Math.hypot(p.x - x, p.y - y) < p.radius + radius + 5);
                attempts++;
            }
            const p = {
                id,
                bet,
                name: name || 'player',
                pfp: pfp || '',
                color: getColor(state.players.length + 1),
                radius: radius,
                mass: radius * radius * 1.2,
                x: x || half,
                y: y || half,
                vx: 0,
                vy: 0,
                alive: true,
            };
            state.players.push(p);
            computeRadii();
            return p;
        }

        function getPlayer(id) { return state.players.find(p => p.id === id); }

        function getAlive() { return state.players.filter(p => p.alive); }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // BOT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const BOT_NAME = 'Bot';
        const BOT_PFP = 'https://i.pravatar.cc/100?img=7';

        function spawnBot() {
            if (!state.botEnabled || state.botSpawned) return;
            if (state.gameState === 'playing' || state.gameState === 'finished') return;
            if (state.players.some(p => p.id.startsWith('bot_'))) return;
            if (state.players.length >= state.maxPlayers) return;
            const bet = Math.floor(Math.random() * 30) + 8;
            const bot = makePlayer('bot_' + Date.now(), bet, BOT_NAME, BOT_PFP);
            state.botSpawned = true;
            updateWaitingText();
            updateBetUI();
            haptic('light');
        }

        function botAI(dt) {
            const bot = state.players.find(p => p.id.startsWith('bot_'));
            if (!bot || !bot.alive || state.gameState !== 'playing') return;
            bot.vx += (Math.random() - 0.5) * 2.0 * dt;
            bot.vy += (Math.random() - 0.5) * 2.0 * dt;
            const maxSp = speedForRadius(bot.radius);
            const sp = Math.sqrt(bot.vx * bot.vx + bot.vy * bot.vy);
            if (sp > maxSp) {
                bot.vx = (bot.vx / sp) * maxSp;
                bot.vy = (bot.vy / sp) * maxSp;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SPEED SCALING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function speedForRadius(radius) {
            const minR = 14,
                maxR = 52;
            const minSpeed = 3.0,
                maxSpeed = 8.5;
            const norm = (radius - minR) / (maxR - minR);
            const speed = maxSpeed - (maxSpeed - minSpeed) * Math.pow(norm, 1.6);
            return Math.max(minSpeed, Math.min(maxSpeed, speed));
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOGIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function startCountdown() {
            if (state.gameState !== 'idle') return;
            if (getAlive().length < 2) return;
            state.gameState = 'countdown';
            state.countdown = 3.0;
            state.countdownStartTime = performance.now();
            waitingText.style.display = 'none';
            countdownTimer.style.display = 'block';
            haptic('heavy');
            updateBetUI();
        }

        function startGame() {
            state.gameState = 'playing';
            state.gameTime = 0;
            state.openingGrowTimer = 3.0;
            state.openingTimer = 0;
            state.opening = null;
            state.winnerId = null;
            winnerOverlay.classList.remove('show');
            betOverlay.classList.add('hidden');
            waitingText.style.display = 'none';
            countdownTimer.style.display = 'none';

            const alive = getAlive();
            const half = state.arenaSize / 2;
            alive.forEach((p, i) => {
                const angle = (i / alive.length) * Math.PI * 2 + Math.random() * 0.3;
                const baseSpeed = speedForRadius(p.radius);
                const speed = baseSpeed * (0.8 + Math.random() * 0.6);
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.x = half + Math.cos(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.y = half + Math.sin(angle) * (state.arenaSize * 0.15 + Math.random() * 15);
                p.alive = true;
            });
            state.openingTimer = 2.0 + Math.random() * 1.5;
        }

        function endGame(winnerId) {
            if (state.gameState === 'finished') return;
            state.gameState = 'finished';
            state.winnerId = winnerId;
            const winner = getPlayer(winnerId);
            if (winner) {
                const winnings = Math.floor(state.pot * 0.95);
                if (winner.id === state.userId) {
                    state.balance += winnings;
                    state.wins++;
                } else {
                    state.losses++;
                }
                updateBalance();
                updateProfile();
                winnerText.textContent = winner.name + ' wins!';
                winnerSub.textContent = '+' + winnings;
                winnerOverlay.classList.add('show');
                haptic('heavy');
                updateTopList();
                state.pot = 0;
                state.opening = null;
                setTimeout(() => {
                    state.players = [];
                    state.gameState = 'idle';
                    state.botSpawned = false;
                    winnerOverlay.classList.remove('show');
                    betOverlay.classList.remove('hidden');
                    waitingText.style.display = 'block';
                    countdownTimer.style.display = 'none';
                    updateWaitingText();
                    updateBetUI();
                    updateProfile();
                    updateStatsBar();
                    setTimeout(() => { if (state.botEnabled) spawnBot(); }, 600);
                }, 3000);
            } else {
                state.gameState = 'idle';
                state.players = [];
                state.botSpawned = false;
                state.opening = null;
                betOverlay.classList.remove('hidden');
                waitingText.style.display = 'block';
                countdownTimer.style.display = 'none';
                updateWaitingText();
                updateBetUI();
                updateStatsBar();
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PHYSICS – FIXED SDF COLLISION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updatePhysics(dt) {
            if (state.gameState !== 'playing') return;
            const alive = getAlive();
            if (alive.length <= 1) {
                if (alive.length === 1) endGame(alive[0].id);
                else {
                    state.gameState = 'idle';
                    state.players = [];
                    state.botSpawned = false;
                    state.opening = null;
                    betOverlay.classList.remove('hidden');
                    waitingText.style.display = 'block';
                    countdownTimer.style.display = 'none';
                    updateWaitingText();
                    updateBetUI();
                    updateStatsBar();
                }
                return;
            }

            state.gameTime += dt;
            state.openingGrowTimer -= dt;
            if (state.openingGrowTimer <= 0 && state.opening && state.opening.state === 'open') {
                state.openingGrowTimer = 3.0;
                let gap = state.opening.end - state.opening.start;
                let newGap = Math.min(gap + 0.04, 0.65);
                let start = state.opening.start - (newGap - gap) / 2;
                let end = state.opening.end + (newGap - gap) / 2;
                if (start < 0) start = 0;
                if (end > 1) end = 1;
                state.opening.start = start;
                state.opening.end = end;
                state.opening.gapSize = (end - start) * state.arenaSize;
            }

            if (state.opening && state.opening.state === 'flashing') {
                state.opening.flashTimer += dt;
                if (state.opening.flashTimer > 0.3) {
                    state.opening.flashTimer = 0;
                    state.opening.flashPulses--;
                    if (state.opening.flashPulses <= 0) {
                        state.opening.state = 'open';
                        state.opening.flashPulses = 0;
                        state.opening.flashTimer = 0;
                        state.opening.gapSize = (state.opening.end - state.opening.start) * state.arenaSize;
                    }
                }
            }

            const size = state.arenaSize;
            const r = state.cornerRadius;
            const opening = state.opening;
            const subSteps = 6;
            const subDt = dt / subSteps;

            for (let step = 0; step < subSteps; step++) {
                alive.forEach(p => {
                    p.x += p.vx * subDt * 60;
                    p.y += p.vy * subDt * 60;

                    // ---- SDF COLLISION (CORRECT OVERLAP) ----
                    const d = sdfRoundedRect(p.x, p.y, size, r);
                    // Overlap if the absolute distance from center to border is less than radius
                    if (Math.abs(d) < p.radius) {
                        const normal = normalRoundedRect(p.x, p.y, size, r);
                        // Push the circle out of the wall
                        const overlap = p.radius - Math.abs(d);
                        // If d < 0 (inside), push outward (positive normal); else push inward
                        if (d < 0) {
                            p.x += normal.nx * overlap;
                            p.y += normal.ny * overlap;
                        } else {
                            p.x -= normal.nx * overlap;
                            p.y -= normal.ny * overlap;
                        }
                        // Reflect velocity
                        const vn = p.vx * normal.nx + p.vy * normal.ny;
                        // If moving into the wall, reflect
                        if ((d < 0 && vn < 0) || (d >= 0 && vn > 0)) {
                            const restitution = 0.85;
                            p.vx -= (1 + restitution) * vn * normal.nx;
                            p.vy -= (1 + restitution) * vn * normal.ny;
                            // Add a tiny damping to prevent jitter
                            p.vx *= 0.995;
                            p.vy *= 0.995;
                        }
                    }

                    // ---- OPENING ELIMINATION ----
                    const dOut = sdfRoundedRect(p.x, p.y, size, r);
                    if (dOut > 2 && opening && opening.state === 'open') {
                        const side = opening.side;
                        const start = opening.start * size;
                        const end = opening.end * size;
                        let inGap = false;
                        if (side === 'left' || side === 'right') {
                            inGap = (p.y > start && p.y < end);
                        } else {
                            inGap = (p.x > start && p.x < end);
                        }
                        let movingOut = false;
                        if (side === 'left' && p.vx < 0) movingOut = true;
                        else if (side === 'right' && p.vx > 0) movingOut = true;
                        else if (side === 'top' && p.vy < 0) movingOut = true;
                        else if (side === 'bottom' && p.vy > 0) movingOut = true;
                        const gapLen = (opening.end - opening.start) * size;
                        const canFit = p.radius * 2 < gapLen - 1;
                        if (inGap && movingOut && canFit) {
                            p.alive = false;
                            haptic('medium');
                            return;
                        }
                    }
                });

                // ---- CIRCLE COLLISIONS ----
                for (let i = 0; i < alive.length; i++) {
                    for (let j = i + 1; j < alive.length; j++) {
                        const a = alive[i],
                            b = alive[j];
                        const dx = b.x - a.x,
                            dy = b.y - a.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = a.radius + b.radius;
                        if (dist < minDist && dist > 0.001) {
                            const nx = dx / dist,
                                ny = dy / dist;
                            const overlap = (minDist - dist) * 0.5;
                            a.x -= nx * overlap;
                            a.y -= ny * overlap;
                            b.x += nx * overlap;
                            b.y += ny * overlap;
                            const dvx = a.vx - b.vx,
                                dvy = a.vy - b.vy;
                            const dvn = dvx * nx + dvy * ny;
                            if (dvn > 0) {
                                const restitution = 0.85;
                                const impulse = (1 + restitution) * dvn / (1 / a.mass + 1 / b.mass);
                                a.vx -= impulse / a.mass * nx;
                                a.vy -= impulse / a.mass * ny;
                                b.vx += impulse / b.mass * nx;
                                b.vy += impulse / b.mass * ny;
                            }
                        }
                    }
                }

                // ---- SPEED CAP ----
                alive.forEach(p => {
                    const maxSp = speedForRadius(p.radius);
                    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (sp > maxSp) {
                        p.vx = (p.vx / sp) * maxSp;
                        p.vy = (p.vy / sp) * maxSp;
                    }
                    const minSp = 0.6;
                    if (sp < minSp && sp > 0) {
                        p.vx = (p.vx / sp) * minSp;
                        p.vy = (p.vy / sp) * minSp;
                    }
                });
            }

            // ---- OPENING TIMER ----
            state.openingTimer -= dt;
            if (state.openingTimer <= 0) {
                if (!state.opening) {
                    const sides = ['top', 'right', 'bottom', 'left'];
                    const side = sides[Math.floor(Math.random() * sides.length)];
                    let gapSize = 0.12 + Math.random() * 0.45;
                    let start = Math.random() * (1 - gapSize);
                    let end = start + gapSize;
                    start = Math.max(0, Math.min(1 - gapSize, start));
                    end = start + gapSize;
                    state.opening = {
                        side: side,
                        start: start,
                        end: end,
                        state: 'flashing',
                        flashPulses: 4,
                        flashTimer: 0,
                        gapSize: (end - start) * state.arenaSize,
                    };
                    state.openingTimer = 3.0 + Math.random() * 3.0;
                    haptic('light');
                } else {
                    state.opening = null;
                    state.openingTimer = 0.8 + Math.random() * 2.2;
                }
            }

            botAI(dt);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER – dark rim behind, red flash on gap
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            const w = state.arenaSize,
                half = w / 2;
            const r = state.cornerRadius || w * 0.15;
            ctx.clearRect(0, 0, w, w);

            // background: very dark
            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            // Dark rim (distinct from background)
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 35;
            ctx.fillStyle = '#1e1e22';
            drawRoundedRect(ctx, 0, 0, w, w, r);
            ctx.fill();
            ctx.restore();

            // Main arena surface (lighter gray)
            ctx.save();
            ctx.fillStyle = '#28282e';
            drawRoundedRect(ctx, 0, 0, w, w, r);
            ctx.fill();
            ctx.restore();

            // Border
            const bw = 6;
            ctx.save();
            ctx.strokeStyle = 'rgba(160,160,176,0.3)';
            ctx.lineWidth = bw;

            const opening = state.opening;
            const hasGap = opening && (opening.state === 'flashing' || opening.state === 'open');
            const flash = opening && opening.state === 'flashing' && (opening.flashPulses % 2 === 1);

            if (hasGap) {
                const side = opening.side;
                const start = opening.start * w;
                const end = opening.end * w;
                // Draw four sides with rounded corners, skipping gap
                // Top
                if (side !== 'top') {
                    ctx.beginPath();
                    ctx.moveTo(r, 0);
                    ctx.lineTo(w - r, 0);
                    ctx.quadraticCurveTo(w, 0, w, r);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(r, 0);
                    ctx.lineTo(start, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(end, 0);
                    ctx.lineTo(w - r, 0);
                    ctx.quadraticCurveTo(w, 0, w, r);
                    ctx.stroke();
                }
                // Right
                if (side !== 'right') {
                    ctx.beginPath();
                    ctx.moveTo(w, r);
                    ctx.lineTo(w, w - r);
                    ctx.quadraticCurveTo(w, w, w - r, w);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(w, r);
                    ctx.lineTo(w, start);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(w, end);
                    ctx.lineTo(w, w - r);
                    ctx.quadraticCurveTo(w, w, w - r, w);
                    ctx.stroke();
                }
                // Bottom
                if (side !== 'bottom') {
                    ctx.beginPath();
                    ctx.moveTo(w - r, w);
                    ctx.lineTo(r, w);
                    ctx.quadraticCurveTo(0, w, 0, w - r);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(w - r, w);
                    ctx.lineTo(end, w);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(start, w);
                    ctx.lineTo(r, w);
                    ctx.quadraticCurveTo(0, w, 0, w - r);
                    ctx.stroke();
                }
                // Left
                if (side !== 'left') {
                    ctx.beginPath();
                    ctx.moveTo(0, w - r);
                    ctx.lineTo(0, r);
                    ctx.quadraticCurveTo(0, 0, r, 0);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, w - r);
                    ctx.lineTo(0, end);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, start);
                    ctx.lineTo(0, r);
                    ctx.quadraticCurveTo(0, 0, r, 0);
                    ctx.stroke();
                }
            } else {
                drawRoundedRect(ctx, 0, 0, w, w, r);
                ctx.stroke();
            }

            // ---- RED FLASH: change the segment color to red ----
            if (flash) {
                const side = opening.side;
                const start = opening.start * w;
                const end = opening.end * w;
                ctx.save();
                // Draw a thick red line on the gap segment
                ctx.shadowColor = 'rgba(255, 50, 50, 0.9)';
                ctx.shadowBlur = 50;
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = bw + 8;
                if (side === 'top') {
                    ctx.beginPath();
                    ctx.moveTo(start, bw / 2);
                    ctx.lineTo(end, bw / 2);
                    ctx.stroke();
                } else if (side === 'bottom') {
                    ctx.beginPath();
                    ctx.moveTo(start, w - bw / 2);
                    ctx.lineTo(end, w - bw / 2);
                    ctx.stroke();
                } else if (side === 'left') {
                    ctx.beginPath();
                    ctx.moveTo(bw / 2, start);
                    ctx.lineTo(bw / 2, end);
                    ctx.stroke();
                } else if (side === 'right') {
                    ctx.beginPath();
                    ctx.moveTo(w - bw / 2, start);
                    ctx.lineTo(w - bw / 2, end);
                    ctx.stroke();
                }
                ctx.restore();
            }
            ctx.restore();

            // ---- PLAYERS ----
            state.players.forEach(p => {
                const isAlive = p.alive;
                const radius = isAlive ? p.radius : p.radius * 0.5;
                const alpha = isAlive ? 1 : 0.2;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.strokeStyle = p.color || '#a0a0b0';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = 'rgba(255,255,255,0.1)';
                ctx.shadowBlur = 8;
                ctx.stroke();

                if (p.pfp && isAlive) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = p.pfp;
                    if (img.complete && img.naturalWidth > 0) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, radius - 4, 0, Math.PI * 2);
                        ctx.clip();
                        ctx.drawImage(img, p.x - (radius - 4), p.y - (radius - 4), (radius - 4) * 2, (radius - 4) * 2);
                    } else {
                        ctx.fillStyle = p.color || '#a0a0b0';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, radius - 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.font = `${radius*0.5}px system-ui`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(p.name.charAt(0).toUpperCase(), p.x, p.y);
                    }
                } else {
                    ctx.fillStyle = p.color || '#a0a0b0';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius - 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `${radius*0.5}px system-ui`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.name.charAt(0).toUpperCase(), p.x, p.y);
                }
                ctx.restore();
            });

            ctx.shadowBlur = 0;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // UI UPDATES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateBalance() {
            balanceEl.textContent = Math.floor(state.balance);
            pBalance.textContent = Math.floor(state.balance);
        }

        function updateProfile() {
            pWins.textContent = state.wins;
            pLosses.textContent = state.losses;
            const total = state.wins + state.losses;
            pWinrate.textContent = total > 0 ? Math.round((state.wins / total) * 100) + '%' : '0%';
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            if (state.pfp) profilePfp.src = state.pfp;
            updateBalance();
        }

        function updateStatsBar() {
            const alive = getAlive();
            statsPlayers.textContent = alive.length;
            statsPot.textContent = state.pot;
        }

        function updateWaitingText() {
            const alive = getAlive();
            if (alive.length === 0) {
                waitingText.innerHTML = '<span>waiting for players</span><div class="sub">place a bet to join</div>';
            } else {
                waitingText.innerHTML =
                    `<span>● ${alive.length} player${alive.length>1?'s':''} ready</span><div class="sub">need ${Math.max(0,2-alive.length)} more to start</div>`;
            }
            if (alive.length >= 2 && state.gameState === 'idle') startCountdown();
            updateStatsBar();
        }

        function updateBetUI() {
            const existing = state.players.find(p => p.id === state.userId);
            const inGame = !!existing;
            const canBet = (state.gameState === 'idle' || state.gameState === 'countdown');

            if (canBet) {
                betBtn.textContent = inGame ? 'increase' : 'join';
                betBtn.disabled = false;
                betInput.disabled = false;
            } else {
                betBtn.textContent = inGame ? 'in game' : 'waiting';
                betBtn.disabled = true;
                betInput.disabled = true;
            }

            if (existing) {
                currentBetDisplay.textContent = existing.bet;
            } else {
                currentBetDisplay.textContent = '0';
            }

            const val = parseInt(betInput.value) || 10;
            betAmountDisplay.textContent = Math.min(val, state.balance);
            if (betInput.value === '' || parseInt(betInput.value) === 0) {
                betInput.value = 10;
            }
        }

        function updateTopList() {
            const entries = [];
            entries.push({ name: state.username, pfp: state.pfp || '', wins: state.wins, score: state.balance,
                isUser: true });
            state.players.forEach(p => {
                if (p.id.startsWith('bot_')) {
                    entries.push({ name: p.name, pfp: p.pfp || '', wins: Math.floor(Math.random() * 8) + 1,
                        score: Math.floor(Math.random() * 300) + 50, isUser: false });
                }
            });
            const mock = ['CryptoKing', 'DiamondHands', 'BumpMaster', 'LuckyStar', 'MoonRider'];
            for (let i = 0; i < 4; i++) {
                if (entries.length < 14) {
                    entries.push({ name: mock[i % mock.length] + (i > 2 ? i : ''), pfp: 'https://i.pravatar.cc/100?img=' + (
                            i + 20), wins: Math.floor(Math.random() * 25) + 3, score: Math.floor(Math.random() *
                            1500) + 80, isUser: false });
                }
            }
            entries.sort((a, b) => b.score - a.score);
            if (entries.length === 0) { topList.innerHTML = '<div class="no-players-msg">no players yet</div>'; return; }
            let html = '';
            entries.slice(0, 18).forEach((e, i) => {
                const rank = i + 1;
                let rClass = 'rank';
                if (rank === 1) rClass += ' gold';
                else if (rank === 2) rClass += ' silver';
                else if (rank === 3) rClass += ' bronze';
                const tag = e.isUser ? ' (you)' : '';
                html += `<div class="top-entry" style="${e.isUser?'border-color:var(--primary);':''}">
                        <div class="${rClass}">#${rank}</div>
                        <img class="t-pfp" src="${e.pfp||'https://i.pravatar.cc/100?img='+(i+30)}" alt="" />
                        <div class="t-name">${e.name}${tag}</div>
                        <div class="t-wins">● ${e.wins}</div>
                        <div class="t-score">${e.score}</div>
                    </div>`;
            });
            topList.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TAB SWITCHING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function switchTab(tabId) {
            if (state.currentTab === tabId) return;
            const oldTab = state.currentTab;
            state.currentTab = tabId;

            const oldEl = tabPages[oldTab];
            if (oldEl) {
                oldEl.classList.remove('active');
                oldEl.classList.add('exit');
                setTimeout(() => {
                    oldEl.classList.remove('exit');
                }, 350);
            }

            const newEl = tabPages[tabId];
            if (newEl) {
                setTimeout(() => {
                    newEl.classList.add('active');
                    if (tabId === 'profile') updateProfile();
                    if (tabId === 'top') updateTopList();
                }, 50);
            }

            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });

            haptic('light');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let lastTime = 0;

        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            if (state.gameState === 'playing') updatePhysics(dt);

            if (state.gameState === 'countdown') {
                const elapsed = (performance.now() - state.countdownStartTime) / 1000;
                let remaining = Math.max(0, 3.0 - elapsed);
                if (remaining <= 0) {
                    startGame();
                } else {
                    const secs = Math.floor(remaining);
                    const ms = Math.floor((remaining - secs) * 100);
                    countdownTimer.textContent = secs + '.' + String(ms).padStart(2, '0');
                }
            }

            if (state.gameState === 'idle') {
                if (!state.botSpawned && state.players.length === 0) {
                    setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
                }
                if (getAlive().length >= 2) startCountdown();
            }

            updateStatsBar();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        betBtn.addEventListener('click', () => {
            if (state.gameState !== 'idle' && state.gameState !== 'countdown') return;
            let addAmount = parseInt(betInput.value) || 10;
            if (addAmount < 1) { betInput.value = 1;
                addAmount = 1;
                haptic('light'); }
            if (addAmount > state.balance) { betInput.value = state.balance;
                addAmount = state.balance;
                haptic('light'); }

            const existing = state.players.find(p => p.id === state.userId);
            if (existing) {
                state.balance -= addAmount;
                existing.bet += addAmount;
                state.pot += addAmount;
                computeRadii();
                updateBalance();
                updateBetUI();
                updateProfile();
                haptic('medium');
            } else {
                if (addAmount > state.balance) { betInput.value = state.balance;
                    addAmount = state.balance;
                    haptic('light'); }
                const player = makePlayer(state.userId, addAmount, state.username, state.pfp);
                state.balance -= addAmount;
                state.pot += addAmount;
                updateBalance();
                updateBetUI();
                updateWaitingText();
                updateProfile();
                haptic('medium');
                if (!state.botSpawned && state.botEnabled) {
                    setTimeout(() => { if (state.botEnabled && (state.gameState === 'idle' || state.gameState ===
                            'countdown')) spawnBot(); }, 400);
                }
            }
            betInput.value = 10;
            updateBetUI();
        });

        betInput.addEventListener('input', () => {
            let val = parseInt(betInput.value) || 0;
            if (val < 0) betInput.value = 0;
            if (val > state.balance) betInput.value = state.balance;
            betAmountDisplay.textContent = (parseInt(betInput.value) || 0);
            if (betInput.value === '') betInput.value = 10;
        });

        betInput.value = 10;

        winnerCloseBtn.addEventListener('click', () => {
            state.gameState = 'idle';
            state.players = [];
            state.botSpawned = false;
            state.opening = null;
            winnerOverlay.classList.remove('show');
            betOverlay.classList.remove('hidden');
            waitingText.style.display = 'block';
            countdownTimer.style.display = 'none';
            updateWaitingText();
            updateBetUI();
            updateStatsBar();
            haptic('light');
            setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 600);
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                switchTab(tab);
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                state.username = u.username || u.first_name || 'player';
                state.userId = u.id?.toString() || state.userId;
                state.pfp = u.photo_url || '';
            } else {
                state.username = 'test_user';
                state.pfp = 'https://i.pravatar.cc/100?img=69';
            }
            usernameDisplay.textContent = '@' + state.username;
            if (state.pfp) profilePfp.src = state.pfp;
            else profilePfp.src = 'https://i.pravatar.cc/100?img=69';
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            updateBalance();
            updateProfile();
            updateTopList();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setTimeout(() => { if (state.botEnabled && state.gameState === 'idle') spawnBot(); }, 800);
            Object.keys(tabPages).forEach(key => {
                tabPages[key].classList.toggle('active', key === 'pvp');
            });
            requestAnimationFrame(gameLoop);
            statusDot.className = 'online';
        }
        init();

        window.__state = state;
        console.log('◆ dllump – fixed SDF overlap, speed preserved, diamond animated');
    </script>
</body>
</html>

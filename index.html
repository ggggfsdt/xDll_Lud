        // WEBSOCKET CONNECTION

        // PFP SYSTEM (copied from original)

        function generateDefaultAvatar(initial, colorIndex) {
            const size = 128;
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx2 = c.getContext('2d');
            const colors = ['#5b8def', '#50c890', '#e06060', '#d4af37', '#c084e0', '#f0a070', '#60c0d0', '#e8a0a0'];
            const col = colors[colorIndex % colors.length];
            const grad = ctx2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            grad.addColorStop(0, lightenColor(col, 60));
            grad.addColorStop(1, col);
            ctx2.beginPath();
            ctx2.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
            ctx2.fillStyle = grad;
            ctx2.fill();
            ctx2.beginPath();
            ctx2.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
            ctx2.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx2.lineWidth = 2;
            ctx2.stroke();
            const letter = (initial || '?').charAt(0).toUpperCase();
            ctx2.fillStyle = 'rgba(255,255,255,0.95)';
            ctx2.font = `bold ${size * 0.48}px system-ui, -apple-system, sans-serif`;
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'middle';
            ctx2.shadowColor = 'rgba(0,0,0,0.15)';
            ctx2.shadowBlur = 8;
            ctx2.fillText(letter, size / 2, size / 2 + 3);
            ctx2.shadowBlur = 0;
            const img = new Image();
            img.src = c.toDataURL('image/png');
            return img;
        }

        function lightenColor(hex, amt) {
            let r = parseInt(hex.slice(1, 2), 16) * 17 || parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(2, 3), 16) * 17 || parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(3, 4), 16) * 17 || parseInt(hex.slice(5, 7), 16);
            r = Math.min(255, r + amt);
            g = Math.min(255, g + amt);
            b = Math.min(255, b + amt);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        const pfpCache = new Map();

        function loadPlayerPFP(player) {
            const src = player.pfp || '';
            if (!src) return;
            if (pfpCache.has(src)) {
                const cached = pfpCache.get(src);
                if (cached.loaded && cached.img) { player.pfpImg = cached.img;
                    player.pfpLoaded = true; return; }
                if (cached.promise) { cached.promise.then(img => { if (img) { player.pfpImg = img;
                            player.pfpLoaded = true; } }); return; }
            }
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => { pfpCache.set(src, { img, loaded: true, promise: null });
                player.pfpImg = img;
                player.pfpLoaded = true;
                updateUI(); };
            img.onerror = () => { pfpCache.set(src, { img: null, loaded: false, promise: null });
                player.pfpLoaded = false; };
            img.src = src;
            const promise = new Promise(res => {});
            pfpCache.set(src, { img: null, loaded: false, promise });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PERIMETER GENERATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generatePerimeter(size, cornerRadius, numPoints = 300) {
            const half = size / 2;
            const r = Math.min(cornerRadius, half);
            const points = [];
            const sections = [
                { type: 'line', x1: -half + r, y1: -half, x2: half - r, y2: -half },
                { type: 'arc', cx: half - r, cy: -half + r, start: -Math.PI / 2, end: 0 },
                { type: 'line', x1: half, y1: -half + r, x2: half, y2: half - r },
                { type: 'arc', cx: half - r, cy: half - r, start: 0, end: Math.PI / 2 },
                { type: 'line', x1: half - r, y1: half, x2: -half + r, y2: half },
                { type: 'arc', cx: -half + r, cy: half - r, start: Math.PI / 2, end: Math.PI },
                { type: 'line', x1: -half, y1: half - r, x2: -half, y2: -half + r },
                { type: 'arc', cx: -half + r, cy: -half + r, start: Math.PI, end: 3 * Math.PI / 2 }
            ];
            let totalLen = 0;
            const segLengths = sections.map(seg => {
                if (seg.type === 'line') {
                    const dx = seg.x2 - seg.x1,
                        dy = seg.y2 - seg.y1;
                    return Math.sqrt(dx * dx + dy * dy);
                } else {
                    return r * (seg.end - seg.start);
                }
            });
            totalLen = segLengths.reduce((a, b) => a + b, 0);
            const step = totalLen / numPoints;
            let accumulated = 0,
                segIdx = 0;
            for (let i = 0; i < numPoints; i++) {
                const target = i * step;
                while (accumulated + segLengths[segIdx] < target) {
                    accumulated += segLengths[segIdx];
                    segIdx = (segIdx + 1) % sections.length;
                }
                const localT = (target - accumulated) / segLengths[segIdx];
                const seg = sections[segIdx];
                let px, py;
                if (seg.type === 'line') {
                    px = seg.x1 + localT * (seg.x2 - seg.x1);
                    py = seg.y1 + localT * (seg.y2 - seg.y1);
                } else {
                    const angle = seg.start + localT * (seg.end - seg.start);
                    px = seg.cx + r * Math.cos(angle);
                    py = seg.cy + r * Math.sin(angle);
                }
                points.push({ x: px + half, y: py + half });
            }
            return points;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CANVAS SIZING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let arenaSize = 0,
            cornerRadius = 0,
            perimeterPoints = [];

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const size = Math.min(rect.width - 16, rect.height - 16, 440);
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            arenaSize = size;
            cornerRadius = size * 0.15;
            ctx.scale(dpr, dpr);
            if (perimeterPoints.length === 0) {
                perimeterPoints = generatePerimeter(size, cornerRadius, 300);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER — draws server state
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            if (!game) return;
            const w = arenaSize;
            const half = w / 2;
            ctx.clearRect(0, 0, w, w);

            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            const pts = perimeterPoints;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#1a1a1e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#28282e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            const opening = game.opening;
            const isFlashing = opening && opening.state === 'flashing';
            const isOpen = opening && opening.state === 'open';
            const total = pts.length;

            ctx.save();
            const hasGap = opening !== null && (isFlashing || isOpen);
            if (hasGap) {
                const start = opening.startIdx,
                    end = opening.endIdx;
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                for (let i = 0; i < total; i++) {
                    const j = (i + 1) % total;
                    let inGap = false;
                    if (start < end) {
                        if (i >= start && i < end) inGap = true;
                        if (j >= start && j < end) inGap = true;
                    } else {
                        if (i >= start || i < end) inGap = true;
                        if (j >= start || j < end) inGap = true;
                    }
                    if (inGap) continue;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
                if (isFlashing) {
                    const isRed = (opening.flashCount % 2 === 0);
                    ctx.save();
                    const flashColor = isRed ? '#ff0044' : 'rgba(160,160,176,0.25)';
                    let gapSegments = [];
                    if (start < end) {
                        for (let i = start; i < end; i++) gapSegments.push({ i, j: (i + 1) % total });
                    } else {
                        for (let i = start; i < total; i++) gapSegments.push({ i, j: (i + 1) % total });
                        for (let i = 0; i < end; i++) gapSegments.push({ i, j: (i + 1) % total });
                    }
                    ctx.strokeStyle = flashColor;
                    ctx.lineWidth = isRed ? 5 : 3;
                    ctx.shadowBlur = 0;
                    for (const seg of gapSegments) {
                        ctx.beginPath();
                        ctx.moveTo(pts[seg.i].x, pts[seg.i].y);
                        ctx.lineTo(pts[seg.j].x, pts[seg.j].y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            } else {
                ctx.strokeStyle = 'rgba(160,160,176,0.3)';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();

            // ── PLAYERS ──
            game.players.forEach(p => {
                if (!p.alive) return;
                const radius = p.radius || 18;
                const drawRadius = Math.max(radius - 1, 1);

                // ensure avatar
                if (!p.pfpImg) {
                    const def = generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', 0);
                    p.pfpImg = def;
                    p.pfpLoaded = true;
                    loadPlayerPFP(p);
                }

                ctx.save();
                if (p.pfpImg) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    const size = drawRadius * 2;
                    ctx.drawImage(p.pfpImg, p.x - drawRadius, p.y - drawRadius, size, size);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fillStyle = '#555';
                    ctx.fill();
                }
                ctx.restore();

                ctx.save();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                const isYou = p.id === myPlayerId;
                ctx.strokeStyle = isYou ? 'rgba(255,255,255,1.0)' : 'rgba(255,255,255,0.35)';
                ctx.lineWidth = isYou ? 2.5 : 1.5;
                ctx.stroke();
                ctx.restore();
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // UPDATE UI from server state
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateUI() {
            if (!game) return;
            const g = game;
            const alive = g.players.filter(p => p.alive);
            const totalBet = g.players.reduce((s, p) => s + p.bet, 0);

            // player list
            let html = '';
            alive.forEach(p => {
                const chance = totalBet > 0 ? ((p.bet / totalBet) * 100).toFixed(1) : 0;
                const isYou = p.id === myPlayerId;
                html += `<div class="pl-entry ${isYou ? 'you' : ''}">
                            <div class="pl-avatar"><img src="${p.pfp || ''}" onerror="this.src=''" /></div>
                            <span class="pl-name">${p.name}</span>
                            <span class="pl-bet">${p.bet}</span>
                            <span class="pl-chance">${chance}%</span>
                        </div>`;
            });
            playerListContainer.innerHTML = html;

            statsPlayers.textContent = alive.length;
            statsPot.textContent = g.pot;

            // waiting / frog
            if (g.state === 'idle') {
                if (alive.length === 0) {
                    waitingText.innerHTML = '<span>waiting for players</span><div class="sub">place a bet to join</div>';
                } else {
                    waitingText.innerHTML =
                        `<span>● ${alive.length} player${alive.length > 1 ? 's' : ''} ready</span><div class="sub">need ${Math.max(0, 2 - alive.length)} more to start</div>`;
                }
                frogGif.classList.toggle('show', alive.length < 2);
                waitingText.style.display = (alive.length < 2) ? 'block' : 'none';
            } else {
                waitingText.style.display = 'none';
                frogGif.classList.remove('show');
            }

            // countdown
            if (g.state === 'countdown') {
                const elapsed = (Date.now() - g.countdownStart) / 1000;
                let remaining = Math.max(0, 3.0 - elapsed);
                countdownTimer.style.display = 'block';
                countdownTimer.textContent = remaining.toFixed(2);
            } else if (g.state === 'prestart') {
                countdownTimer.style.display = 'block';
                countdownTimer.textContent = 'GO!';
            } else if (g.state === 'playing' || g.state === 'finished') {
                countdownTimer.style.display = 'none';
            } else {
                countdownTimer.style.display = 'none';
            }

            // bet overlay
            const myPlayer = g.players.find(p => p.id === myPlayerId);
            const shouldHide = g.state === 'playing' || g.state === 'finished';
            betOverlayWrap.classList.toggle('hidden', shouldHide);
            playerListContainer.classList.toggle('shift-up', shouldHide);

            if (myPlayer) {
                currentBetDisplay.textContent = myPlayer.bet;
                localState.balance = myPlayer.balance;
                balanceEl.textContent = localState.balance;
                pBalance.textContent = localState.balance;
                betBtn.textContent = g.state === 'idle' ? 'increase' : 'waiting';
                betBtn.disabled = g.state !== 'idle';
                betInput.disabled = g.state !== 'idle';
            } else {
                currentBetDisplay.textContent = '0';
                betBtn.textContent = 'join';
                betBtn.disabled = g.state !== 'idle';
                betInput.disabled = g.state !== 'idle';
            }

            // win panel
            if (g.state === 'finished' && g.winnerId) {
                const winner = g.players.find(p => p.id === g.winnerId);
                if (winner && !winPanel.classList.contains('show')) {
                    const winnings = g.pot || 10;
                    winGif.src = WIN_GIFS[Math.floor(Math.random() * WIN_GIFS.length)];
                    winAvatar.src = winner.pfp || '';
                    winName.textContent = winner.name + ' wins!';
                    winMultiplier.textContent = 'x' + (winnings / (winner.bet || 1)).toFixed(1);
                    winPanel.classList.add('show');
                    if (winner.id === myPlayerId) playVictorySound();
                    // history
                    const history = window._winHistory || [];
                    history.unshift({ name: winner.name, pfp: winner.pfp });
                    if (history.length > 8) history.pop();
                    window._winHistory = history;
                    let hhtml = '';
                    history.forEach(entry => {
                        hhtml +=
                            `<div class="win-entry"><img src="${entry.pfp || ''}" onerror="this.src=''" /></div>`;
                    });
                    winHistoryEl.innerHTML = hhtml;
                }
            } else {
                winPanel.classList.remove('show');
            }

            // profile
            if (myPlayer) {
                profileName.textContent = myPlayer.name;
                profileUsername.textContent = '@' + myPlayer.name;
                if (myPlayer.pfp) profilePfp.src = myPlayer.pfp;
                pBalance.textContent = myPlayer.balance;
            }

            // top
            updateTopUI();

            if (arenaSize === 0) resizeCanvas();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TOP UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateTopUI() {
            if (!game) return;
            const players = [...game.players].sort((a, b) => b.balance - a.balance);
            const top3 = players.slice(0, 3);

            const podiumOrder = [
                { player: top3[2], cls: 'bronze', label: '🥉', base: 'bronze', colClass: 'p3' },
                { player: top3[0], cls: 'gold', label: '🥇', base: 'gold', colClass: 'p1' },
                { player: top3[1], cls: 'silver', label: '🥈', base: 'silver', colClass: 'p2' }
            ];
            let pHtml = '';
            podiumOrder.forEach(info => {
                const p = info.player;
                if (!p) return;
                pHtml += `<div class="podium-col ${info.colClass}">
                            <div class="rank-badge ${info.cls}">${info.label}</div>
                            <img class="podium-pfp ${info.cls}" src="${p.pfp || ''}" onerror="this.src=''" />
                            <div class="podium-name">${p.name}</div>
                            <div class="podium-prize">${p.balance}</div>
                            <div class="podium-stats">bet: ${p.bet}</div>
                            <div class="podium-base ${info.base}"></div>
                        </div>`;
            });
            podiumEl.innerHTML = pHtml;

            const rest = players.slice(3);
            let lHtml = '';
            rest.forEach((p, idx) => {
                const rank = idx + 4;
                let rClass = 'rank';
                if (rank === 4) rClass += ' gold';
                else if (rank === 5) rClass += ' silver';
                else if (rank === 6) rClass += ' bronze';
                lHtml += `<div class="top-entry">
                            <div class="${rClass}">#${rank}</div>
                            <img class="t-pfp" src="${p.pfp || ''}" onerror="this.src=''" />
                            <div class="t-name">${p.name}</div>
                            <div class="t-wins">bet: ${p.bet}</div>
                            <div class="t-score">${p.balance}</div>
                            <div class="t-prize">${p.balance}</div>
                        </div>`;
            });
            topList.innerHTML = lHtml;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // VICTORY SOUND
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let audioCtx = null;
        let victorySoundPlaying = false;

        function playVictorySound() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (victorySoundPlaying) return;
                victorySoundPlaying = true;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                const durations = [0.12, 0.12, 0.12, 0.2];
                const startTimes = [0, 0.14, 0.28, 0.45];
                for (let i = 0; i < notes.length; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[i], now + startTimes[i]);
                    gain.gain.setValueAtTime(0.18, now + startTimes[i]);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + startTimes[i] + durations[i]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + startTimes[i]);
                    osc.stop(now + startTimes[i] + durations[i]);
                }
                setTimeout(() => { victorySoundPlaying = false; }, 800);
            } catch (e) { victorySoundPlaying = false; }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let lastTime = 0;

        function gameLoop(timestamp) {
            if (lastTime === 0) lastTime = timestamp;
            lastTime = timestamp;
            render();
            requestAnimationFrame(gameLoop);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // WEBSOCKET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function connect() {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                statusDot.className = 'online';
                const name = localState.username;
                const pfp = localState.pfp;
                ws.send(JSON.stringify({ type: 'join', name, pfp }));
            };
            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'joined') {
                        myPlayerId = data.id;
                    } else if (data.type === 'state') {
                        game = data.game;
                        // ensure all players have default avatar
                        game.players.forEach(p => {
                            if (!p.pfpImg) {
                                const def = generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', 0);
                                p.pfpImg = def;
                                p.pfpLoaded = true;
                                loadPlayerPFP(p);
                            }
                        });
                        updateUI();
                    }
                } catch (err) { console.error(err); }
            };
            ws.onclose = () => {
                statusDot.className = 'offline';
                setTimeout(connect, 2000);
            };
            ws.onerror = () => { statusDot.className = 'offline'; };
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        betBtn.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN || !game || game.state !== 'idle') return;
            let amount = parseInt(betInput.value) || 10;
            if (amount < 10) amount = 10;
            const myPlayer = game.players.find(p => p.id === myPlayerId);
            if (myPlayer && amount > myPlayer.balance) amount = myPlayer.balance;
            if (amount < 10) return;
            ws.send(JSON.stringify({ type: 'bet', amount }));
            betInput.value = 10;
        });

        betInput.addEventListener('input', () => {
            let val = parseInt(betInput.value) || 0;
            if (val < 10) betInput.value = 10;
            const myPlayer = game ? game.players.find(p => p.id === myPlayerId) : null;
            if (myPlayer && val > myPlayer.balance) betInput.value = myPlayer.balance;
            betAmountDisplay.textContent = (parseInt(betInput.value) || 10);
        });

        betToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            betOverlay.classList.toggle('collapsed');
            haptic('light');
        });

        winContinueBtn.addEventListener('click', () => { winPanel.classList.remove('show'); });

        reloadPfpBtn.addEventListener('click', function() {
            const user = game ? game.players.find(p => p.id === myPlayerId) : null;
            if (user) {
                const src = user.pfp;
                if (pfpCache.has(src)) pfpCache.delete(src);
                loadPlayerPFP(user);
                haptic('medium');
            } else if (localState.pfp) {
                const src = localState.pfp;
                if (pfpCache.has(src)) pfpCache.delete(src);
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => { profilePfp.src = src;
                    haptic('medium'); };
                img.onerror = () => { profilePfp.src = '';
                    haptic('light'); };
                img.src = src;
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TABS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let currentTab = 'pvp';
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const tab = this.dataset.tab;
                if (tab === currentTab) return;
                const oldTab = currentTab;
                currentTab = tab;
                const oldEl = tabPages[oldTab];
                if (oldEl) { oldEl.classList.remove('active');
                    oldEl.classList.add('exit');
                    setTimeout(() => oldEl.classList.remove('exit'), 350); }
                const newEl = tabPages[tab];
                if (newEl) {
                    setTimeout(() => {
                        newEl.classList.add('active');
                        if (tab === 'top') updateTopUI();
                    }, 50);
                }
                tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                haptic('light');
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function init() {
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                localState.username = u.username || u.first_name || 'player';
                localState.userId = u.id?.toString() || localState.userId;
                localState.pfp = u.photo_url || '';
                if (localState.pfp) {
                    try { new URL(localState.pfp); } catch (_) { localState.pfp = ''; }
                }
            } else {
                localState.username = 'test_user';
                localState.pfp = '';
            }
            usernameDisplay.textContent = '@' + localState.username;
            profileName.textContent = localState.username;
            profileUsername.textContent = '@' + localState.username;
            if (localState.pfp) profilePfp.src = localState.pfp;

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            connect();
            requestAnimationFrame(gameLoop);
            statusDot.className = 'connecting';
        }

        init();
        console.log('✅ Online client ready – connect to server at ' + WS_URL);
    </script>
</body>
</html>

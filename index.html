    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ENHANCED PFP LOADING WITH MULTIPLE FALLBACK STRATEGIES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const pfpCache = new Map();
        const imageCanvas = document.createElement('canvas');
        imageCanvas.width = 256;
        imageCanvas.height = 256;
        
        // Image proxy services (in case direct load fails)
        const PROXY_SERVICES = [
            (url) => url, // Try direct first
            (url) => `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=256&h=256&fit=cover`,
            (url) => `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=256&h=256`,
        ];

        function createColoredFallback(seed) {
            // Create a deterministic colored circle based on the seed
            const ctx = imageCanvas.getContext('2d');
            const hue = (seed * 137.508) % 360; // Golden angle for color distribution
            ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
            ctx.beginPath();
            ctx.arc(128, 128, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Add initials placeholder
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', 128, 128);
            
            const dataUrl = imageCanvas.toDataURL('image/png');
            const img = new Image();
            img.src = dataUrl;
            img._isFallback = true;
            return img;
        }

        function loadImage(src, maxRetries = 3, proxyIndex = 0) {
            return new Promise((resolve) => {
                if (!src) {
                    resolve(createColoredFallback(1));
                    return;
                }

                // Check cache first
                if (pfpCache.has(src)) {
                    const cached = pfpCache.get(src);
                    if (cached.loaded) {
                        resolve(cached.img);
                        return;
                    }
                    if (cached.promise) {
                        cached.promise.then(resolve);
                        return;
                    }
                }

                const img = new Image();
                let attempts = 0;
                let resolved = false;

                const doLoad = () => {
                    // Always set crossOrigin for external URLs
                    if (!src.startsWith('data:') && !src.startsWith('blob:')) {
                        img.crossOrigin = 'anonymous';
                    }

                    img.onload = () => {
                        if (resolved) return;
                        resolved = true;
                        // Verify the image actually loaded
                        if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                            pfpCache.set(src, { img, loaded: true, promise: null });
                            resolve(img);
                        } else {
                            // Image loaded but is empty
                            attempts++;
                            if (attempts < maxRetries && proxyIndex < PROXY_SERVICES.length) {
                                const nextProxy = PROXY_SERVICES[proxyIndex + 1];
                                if (nextProxy) {
                                    loadImage(src, maxRetries, proxyIndex + 1).then(resolve);
                                } else {
                                    resolve(createColoredFallback(hashCode(src)));
                                }
                            } else {
                                resolve(createColoredFallback(hashCode(src)));
                            }
                        }
                    };

                    img.onerror = () => {
                        if (resolved) return;
                        attempts++;
                        
                        // Try next proxy service
                        if (proxyIndex + 1 < PROXY_SERVICES.length) {
                            resolved = true;
                            loadImage(src, maxRetries, proxyIndex + 1).then(resolve);
                        } else if (attempts < maxRetries) {
                            // Retry with timestamp cache bust
                            const separator = src.includes('?') ? '&' : '?';
                            img.src = src + separator + 't=' + Date.now();
                        } else {
                            if (resolved) return;
                            resolved = true;
                            resolve(createColoredFallback(hashCode(src)));
                        }
                    };

                    // Apply proxy URL if available
                    const proxyFn = PROXY_SERVICES[proxyIndex];
                    img.src = proxyFn ? proxyFn(src) : src;
                };

                // Set cache entry
                const promise = new Promise((res) => {});
                pfpCache.set(src, { img: null, loaded: false, promise });

                doLoad();

                // Timeout guard (8 seconds)
                const timeoutId = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        resolve(createColoredFallback(hashCode(src)));
                    }
                }, 8000);

                // Cleanup on resolution
                const originalResolve = resolve;
                resolve = (val) => {
                    clearTimeout(timeoutId);
                    originalResolve(val);
                };
            });
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash);
        }

        let state = {
            userId: '123456',
            username: 'player',
            pfp: '',
            balance: 1000,
            wins: 0,
            losses: 0,
            pot: 0,
            players: [],
            arenaSize: 400,
            perimeterPoints: [],
            gameState: 'idle',
            opening: null,
            botEnabled: true,
            botSpawned: false,
            winnerId: null,
            countdown: 3.0,
            countdownStartTime: 0,

            openingTimer: 0,
            gameTime: 0,
            lastTime: 0,
            currentTab: 'pvp',
            defaultAvatar: 'https://i.pravatar.cc/150?img=0',
            winHistory: [],
            maxHistory: 8,
            topPlayers: [],
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const profilePfp = document.getElementById('profile-pfp');
        const profileName = document.getElementById('profile-name');
        const profileUsername = document.getElementById('profile-username');
        const pWins = document.getElementById('p-wins');
        const pLosses = document.getElementById('p-losses');
        const pWinrate = document.getElementById('p-winrate');
        const pBalance = document.getElementById('p-balance');
        const usernameDisplay = document.getElementById('username-display');
        const balanceEl = document.getElementById('balance');
        const waitingText = document.getElementById('waiting-text');
        const countdownTimer = document.getElementById('countdown-timer');
        const statsPlayers = document.getElementById('stats-players');
        const statsPot = document.getElementById('stats-pot');
        const betBtn = document.getElementById('bet-btn');
        const betInput = document.getElementById('bet-input');
        const betAmountDisplay = document.getElementById('current-bet-value');
        const winPanel = document.getElementById('win-panel');
        const winAvatar = document.getElementById('win-avatar');
        const winName = document.getElementById('win-name');
        const winMultiplier = document.getElementById('win-multiplier');
        const winContinueBtn = document.getElementById('win-continue-btn');
        const playerListContainer = document.getElementById('player-list-container');
        const reloadPfpBtn = document.getElementById('reload-pfp-btn');
        const addBotBtn = document.getElementById('add-bot-btn');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPages = {
            pvp: document.getElementById('pvp-page'),
            profile: document.getElementById('profile-page'),
            top: document.getElementById('top-page'),
        };

        const WIN_GIFS = [
            'https://i.postimg.cc/rmQPRSzF/ezgif-20d222277768f496.gif',
            'https://i.postimg.cc/NfyzL2tt/ezgif-2378686847977dc7.gif',
        ];

        let defaultAvatarImg = null;
        loadImage(state.defaultAvatar).then(img => { defaultAvatarImg = img; });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PERIMETER & CANVAS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function generatePerimeter(size, cornerRadius, numPoints = 300) {
            const half = size / 2;
            const r = Math.min(cornerRadius, half);
            const points = [];
            const sections = [
                { type: 'line', x1: -half + r, y1: -half, x2: half - r, y2: -half },
                { type: 'arc', cx: half - r, cy: -half + r, start: -Math.PI / 2, end: 0 },
                { type: 'line', x1: half, y1: -half + r, x2: half, y2: half - r },
                { type: 'arc', cx: half - r, cy: half - r, start: 0, end: Math.PI / 2 },
                { type: 'line', x1: half - r, y1: half, x2: -half + r, y2: half },
                { type: 'arc', cx: -half + r, cy: half - r, start: Math.PI / 2, end: Math.PI },
                { type: 'line', x1: -half, y1: half - r, x2: -half, y2: -half + r },
                { type: 'arc', cx: -half + r, cy: -half + r, start: Math.PI, end: 3 * Math.PI / 2 }
            ];

            let totalLen = 0;
            const segLengths = sections.map(seg => {
                if (seg.type === 'line') {
                    const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
                    return Math.sqrt(dx * dx + dy * dy);
                } else {
                    return r * (seg.end - seg.start);
                }
            });
            totalLen = segLengths.reduce((a, b) => a + b, 0);

            const step = totalLen / numPoints;
            let accumulated = 0;
            let segIdx = 0;
            for (let i = 0; i < numPoints; i++) {
                const target = i * step;
                while (accumulated + segLengths[segIdx] < target) {
                    accumulated += segLengths[segIdx];
                    segIdx = (segIdx + 1) % sections.length;
                }
                const localT = (target - accumulated) / segLengths[segIdx];
                const seg = sections[segIdx];
                let px, py;
                if (seg.type === 'line') {
                    px = seg.x1 + localT * (seg.x2 - seg.x1);
                    py = seg.y1 + localT * (seg.y2 - seg.y1);
                } else {
                    const angle = seg.start + localT * (seg.end - seg.start);
                    px = seg.cx + r * Math.cos(angle);
                    py = seg.cy + r * Math.sin(angle);
                }
                points.push({ x: px + half, y: py + half });
            }
            return points;
        }

        function resizeCanvas() {
            const wrap = document.getElementById('arena-wrap');
            const size = Math.min(wrap.clientWidth, wrap.clientHeight);
            state.arenaSize = size;
            canvas.width = size;
            canvas.height = size;
            state.perimeterPoints = generatePerimeter(size, 20);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLAYER FACTORY WITH IMPROVED PFP LOADING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function makePlayer(id, bet, name, pfp) {
            const half = state.arenaSize / 2;
            const radius = 18;
            let x = half, y = half;
            
            const avatarSrc = pfp || state.defaultAvatar;
            const p = {
                id,
                bet,
                name: name || 'player',
                pfp: avatarSrc,
                radius: radius,
                displayRadius: radius,
                targetRadius: radius,
                mass: radius * radius * 1.2,
                x: x,
                y: y,
                vx: 0,
                vy: 0,
                alive: true,
                isPopping: true,
                popStartTime: performance.now(),
                popDuration: 550,
                pulseTime: 0,
                isPulsing: false,
                pfpLoaded: false,
                pfpImg: null,
            };

            // Load PFP with enhanced error handling
            loadImage(avatarSrc).then(img => {
                if (img && img.naturalWidth > 0) {
                    p.pfpLoaded = true;
                    p.pfpImg = img;
                    console.log(`✓ PFP loaded for ${name}:`, avatarSrc);
                } else {
                    console.warn(`⚠ PFP failed for ${name}, using fallback`);
                    p.pfpLoaded = true;
                    p.pfpImg = img || defaultAvatarImg;
                }
                updatePlayerList();
            }).catch(err => {
                console.error(`✗ PFP error for ${name}:`, err);
                p.pfpLoaded = true;
                p.pfpImg = defaultAvatarImg;
                updatePlayerList();
            });

            state.players.push(p);
            computeRadii();
            updatePlayerList();
            return p;
        }

        function computeRadii() {
            const totalBet = state.players.reduce((s, p) => s + p.bet, 0);
            if (totalBet === 0) return;
            state.players.forEach(p => {
                const ratio = p.bet / totalBet;
                const r = 18 + ratio * 34;
                p.targetRadius = Math.min(Math.max(r, 14), 52);
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER WITH IMPROVED PFP DRAWING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            const w = state.arenaSize;
            const half = w / 2;
            ctx.clearRect(0, 0, w, w);

            const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, w);

            const pts = state.perimeterPoints;
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#1a1a1e';
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();

            // Draw border
            ctx.save();
            ctx.strokeStyle = 'rgba(160,160,176,0.3)';
            ctx.lineWidth = 5;
            if (pts.length > 0) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();

            // ── DRAW PLAYERS WITH PFP ──
            state.players.forEach(p => {
                if (!p.alive) return;
                const radius = p.displayRadius || p.radius;
                
                ctx.save();

                // Get image to draw
                let imgToDraw = null;
                if (p.pfpImg && p.pfpImg.naturalWidth > 0) {
                    imgToDraw = p.pfpImg;
                } else if (defaultAvatarImg && defaultAvatarImg.naturalWidth > 0) {
                    imgToDraw = defaultAvatarImg;
                }

                // Draw circular clip
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.closePath();

                ctx.save();
                ctx.clip();

                // Draw image inside circle
                if (imgToDraw) {
                    const imgSize = radius * 2;
                    ctx.drawImage(imgToDraw, p.x - radius, p.y - radius, imgSize, imgSize);
                } else {
                    // Fallback colored circle
                    ctx.fillStyle = '#444';
                    ctx.fill();
                }
                ctx.restore();

                // Draw outline
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                const isYou = p.id === state.userId;
                ctx.strokeStyle = isYou ? 'rgba(255,255,255,1.0)' : 'rgba(255,255,255,0.4)';
                ctx.lineWidth = isYou ? 2.5 : 1.5;
                ctx.stroke();

                ctx.restore();
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // UI UPDATES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateBalance() {
            balanceEl.textContent = state.balance;
            pBalance.textContent = state.balance;
        }

        function updateProfile() {
            pWins.textContent = state.wins;
            pLosses.textContent = state.losses;
            const total = state.wins + state.losses;
            pWinrate.textContent = total > 0 ? Math.round((state.wins / total) * 100) + '%' : '0%';
            if (state.pfp) profilePfp.src = state.pfp;
        }

        function updateBetUI() {
            betAmountDisplay.textContent = betInput.value || 10;
        }

        function updatePlayerList() {
            const alive = state.players.filter(p => p.alive);
            if (alive.length === 0) {
                playerListContainer.innerHTML = '';
                return;
            }
            let html = '';
            alive.forEach(p => {
                const pfpSrc = p.pfp || state.defaultAvatar;
                html += `<div class="player-card">
                    <img src="${pfpSrc}" onerror="this.src='${state.defaultAvatar}'" />
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-bet">Bet: ${p.bet}</div>
                    </div>
                </div>`;
            });
            playerListContainer.innerHTML = html;
            statsPlayers.textContent = state.players.length;
            statsPot.textContent = state.pot;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME LOOP & EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function gameLoop() {
            render();
            updateBetUI();
            requestAnimationFrame(gameLoop);
        }

        betBtn.addEventListener('click', () => {
            let amount = parseInt(betInput.value) || 10;
            if (amount < 10) amount = 10;
            if (amount > state.balance) amount = state.balance;
            
            const existing = state.players.find(p => p.id === state.userId);
            if (existing) {
                state.balance -= amount;
                existing.bet += amount;
                state.pot += amount;
                computeRadii();
            } else {
                state.balance -= amount;
                state.pot += amount;
                makePlayer(state.userId, amount, state.username, state.pfp);
            }
            
            updateBalance();
            updateBetUI();
            updateProfile();
            updatePlayerList();
            betInput.value = 10;
        });

        // Tab switching
        const switchTab = (tabId) => {
            Object.keys(tabPages).forEach(key => {
                tabPages[key].classList.toggle('active', key === tabId);
            });
            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            state.currentTab = tabId;
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        reloadPfpBtn.addEventListener('click', () => {
            if (state.pfp) {
                pfpCache.delete(state.pfp);
                loadImage(state.pfp).then(img => {
                    if (img && img.naturalWidth > 0) {
                        profilePfp.src = state.pfp;
                    }
                });
            }
        });

        addBotBtn.addEventListener('click', () => {
            const botName = 'Bot #' + Math.floor(Math.random() * 1000);
            const botPfp = 'https://i.pravatar.cc/150?img=' + Math.floor(Math.random() * 70);
            makePlayer('bot_' + Date.now(), 100, botName, botPfp);
            state.pot += 100;
            updatePlayerList();
        });

        // Initialize
        function init() {
            const tg = window.Telegram?.WebApp;
            if (tg?.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                state.username = u.username || u.first_name || 'player';
                state.userId = u.id?.toString() || state.userId;
                state.pfp = u.photo_url || '';
            } else {
                state.username = 'test_user';
                state.pfp = 'https://i.pravatar.cc/100?img=69';
            }

            usernameDisplay.textContent = '@' + state.username;
            profileName.textContent = state.username;
            profileUsername.textContent = '@' + state.username;
            profilePfp.src = state.pfp || state.defaultAvatar;
            
            updateBalance();
            updateProfile();
            updatePlayerList();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(gameLoop);
        }

        init();
        console.log('✓ dllump · PFP Viewer v2 initialized');
    </script>
</body>
</html>

        // ─── SHARED HELPERS ────────────────────────────────────────────
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function easeOutBack(t) { const c1=1.70158,c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
        function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
        function lightenColor(hex,amt) {
            let r=parseInt(hex.slice(1,2),16)*17||parseInt(hex.slice(1,3),16);
            let g=parseInt(hex.slice(2,3),16)*17||parseInt(hex.slice(3,5),16);
            let b=parseInt(hex.slice(3,4),16)*17||parseInt(hex.slice(5,7),16);
            r=Math.min(255,r+amt); g=Math.min(255,g+amt); b=Math.min(255,b+amt);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }
        function hexToRgba(hex,alpha) { if(!hex) return `rgba(120,120,120,${alpha})`; const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${alpha})`; }
        const PUCK_RENDER_RADIUS = 10;

        // ─── PFP CACHE ──────────────────────────────────────────────────
        const pfpCache = new Map();
        function generateDefaultAvatar(initial,colorIndex) {
            const size=128; const c=document.createElement('canvas'); c.width=size; c.height=size;
            const ctx2=c.getContext('2d'); const colors=state.colors; const col=colors[colorIndex%colors.length];
            const grad=ctx2.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
            grad.addColorStop(0,lightenColor(col,60)); grad.addColorStop(1,col);
            ctx2.beginPath(); ctx2.arc(size/2,size/2,size/2-2,0,Math.PI*2); ctx2.fillStyle=grad; ctx2.fill();
            ctx2.beginPath(); ctx2.arc(size/2,size/2,size/2-2,0,Math.PI*2);
            ctx2.strokeStyle='rgba(255,255,255,0.2)'; ctx2.lineWidth=2; ctx2.stroke();
            const letter=(initial||'?').charAt(0).toUpperCase();
            ctx2.fillStyle='rgba(255,255,255,0.95)'; ctx2.font=`bold ${size*0.48}px system-ui, sans-serif`;
            ctx2.textAlign='center'; ctx2.textBaseline='middle'; ctx2.shadowColor='rgba(0,0,0,0.15)'; ctx2.shadowBlur=8;
            ctx2.fillText(letter,size/2,size/2+3); ctx2.shadowBlur=0;
            const img=new Image(); img.src=c.toDataURL('image/png'); return img;
        }
        function loadPlayerPFP(player) {
            const src = player.pfp || state.defaultAvatar;
            if (pfpCache.has(src)) { const cached=pfpCache.get(src); if(cached.loaded&&cached.img){ player.pfpImg=cached.img; return; } }
            const img=new Image(); let attempts=0; const maxAttempts=3;
            const doLoad=()=>{
                img.onload=()=>{ pfpCache.set(src,{img,loaded:true}); player.pfpImg=img; updatePlayerList(); };
                img.onerror=()=>{ attempts++; if(attempts<maxAttempts){ const sep=src.includes('?')?'&':'?'; img.src=src+sep+'retry='+attempts+'t='+Date.now(); } else { pfpCache.set(src,{img:null,loaded:false}); } };
                img.src=src;
            };
            pfpCache.set(src,{img:null,loaded:false}); doLoad();
        }
        const icePfpCache = pfpCache;
        function loadIcePlayerPFP(player) {
            const src = player.pfp || state.defaultAvatar;
            if (icePfpCache.has(src)) { const cached=icePfpCache.get(src); if(cached.loaded&&cached.img){ player.pfpImg=cached.img; return; } }
            const img=new Image(); let attempts=0; const maxAttempts=3;
            img.onload=()=>{ icePfpCache.set(src,{img,loaded:true}); player.pfpImg=img; };
            img.onerror=()=>{ attempts++; if(attempts<maxAttempts){ const sep=src.includes('?')?'&':'?'; img.src=src+sep+'retry='+attempts+'t='+Date.now(); } else { icePfpCache.set(src,{img:null,loaded:false}); } };
            icePfpCache.set(src,{img:null,loaded:false}); img.src=src;
        }

        // ─── CANVAS RESIZE ─────────────────────────────────────────────
        function resizeCanvas() {
            const rect=canvas.parentElement.getBoundingClientRect();
            const size=Math.min(rect.width-16, rect.height-16, 440);
            const dpr=window.devicePixelRatio||1;
            canvas.width=size*dpr; canvas.height=size*dpr; canvas.style.width=size+'px'; canvas.style.height=size+'px';
            state.arenaSize=size; ctx.setTransform(dpr,0,0,dpr,0,0);
        }
        function resizeIceCanvas() {
            const rect=iceCanvas.parentElement.getBoundingClientRect();
            const size=Math.min(rect.width-16, rect.height-16, 440);
            const dpr=window.devicePixelRatio||1;
            iceCanvas.width=size*dpr; iceCanvas.height=size*dpr; iceCanvas.style.width=size+'px'; iceCanvas.style.height=size+'px';
            iceState.arenaSize=size; iceCtx.setTransform(dpr,0,0,dpr,0,0);
        }
        function scaleFactor(){ return state.arenaSize / SERVER_ARENA_SIZE; }
        function iceScaleFactor(){ return iceState.arenaSize / SERVER_ARENA_SIZE; }

        // ─── SOCKET ─────────────────────────────────────────────────────
        const socket = (typeof io !== 'undefined') ? io(SERVER_URL, { transports: ['websocket','polling'] }) : null;
        function setOnline(isOnline){ statusDot.classList.toggle('offline',!isOnline); }

        if(!socket){ console.error('Socket.IO failed to load'); setOnline(false); } else {
            socket.on('connect', ()=>{
                setOnline(true);
                const initData = tg?.initData || '';
                socket.emit('join', { initData }, (res)=>{
                    if(!res?.ok){ waitingText.innerHTML=`<span style="color:var(--red)">Could not connect</span><div class="sub">${res?.error||'try reopening'}</div>`; return; }
                    state.userId=res.user.id; state.username=res.user.username; state.pfp=res.user.pfp;
                    state.balance=res.user.balance; state.wins=res.user.wins; state.losses=res.user.losses;
                    state.anonymous=!!res.user.anonymous; anonToggle.checked=state.anonymous;
                    SERVER_ARENA_SIZE=res.arena.size; state.perimeterPoints=res.arena.perimeter; state.cornerRadius=res.arena.cornerRadius;
                    if(res.iceArena){ iceState.perimeterPoints=res.iceArena.perimeter; iceState.cornerRadius=res.iceArena.cornerRadius; }
                    if(Array.isArray(res.recentWinners)&&res.recentWinners.length){
                        state.winHistory=res.recentWinners.slice(0,state.maxHistory).map(w=>({name:w.name,pfp:w.pfp,timestamp:Date.now()}));
                        updateWinHistoryUI();
                    }
                    if(Array.isArray(res.iceRecentWinners)&&res.iceRecentWinners.length){
                        iceState.winHistory=res.iceRecentWinners.slice(0,8).map(w=>({name:w.name,pfp:w.pfp}));
                        updateIceWinHistoryUI();
                    }
                    if (res.icePlayers && Array.isArray(res.icePlayers)) {
                        iceState.players = res.icePlayers.map(p => ({
                            id: p.id, name: p.name, pfp: p.pfp,
                            pfpImg: generateDefaultAvatar(p.name ? p.name.charAt(0) : '?', 0),
                            x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2,
                            color: p.color, bet: p.bet,
                        }));
                        iceState.pot = res.icePot || 0;
                        iceState.players.forEach(p => loadIcePlayerPFP(p));
                        updateIceStatsBar();
                        updateIceBetUI();
                        updateIceWaitingText();
                        updateIceBetOverlayVisibility();
                        document.getElementById('ice-stats-pot').textContent = iceState.pot;
                    }
                    usernameDisplay.textContent='@'+state.username; profileName.textContent=state.username;
                    profileUsername.textContent='@'+state.username; profilePfp.src=state.pfp||state.defaultAvatar;
                    updateBalance(); updateProfile(); refreshLeaderboard();
                    if(window._topRefreshInterval) clearInterval(window._topRefreshInterval);
                    window._topRefreshInterval=setInterval(refreshLeaderboard,30000);
                });
            });
            socket.on('disconnect',()=>setOnline(false));
            socket.on('connect_error',()=>setOnline(false));
            socket.on('state',(snapshot)=>{ applyServerState(snapshot); });
            socket.on('roundEnd',(payload)=>{ handleRoundEnd(payload); });
            socket.on('iceState',(snapshot)=>{ applyIceServerState(snapshot); });
            socket.on('iceRoundEnd',(payload)=>{ handleIceRoundEnd(payload); });
        }

        // ─── applyServerState (unchanged) ─────────────────────────────
        function applyServerState(snapshot) {
            const prevGameState=state.gameState;
            state.gameState=snapshot.gameState; state.pot=snapshot.pot; state.countdownStartTime=snapshot.countdownStartTime;
            state.opening=snapshot.opening;
            const seen=new Set(); const isCountdown=(state.gameState==='countdown'||state.gameState==='prestart');
            snapshot.players.forEach(sp=>{
                seen.add(sp.id);
                let local=state.players.find(p=>p.id===sp.id);
                if(!local){
                    const colorIdx=state.players.length%state.colors.length;
                    local={ id:sp.id, name:sp.name, pfp:sp.pfp, pfpImg:generateDefaultAvatar(sp.name?sp.name.charAt(0):'?',colorIdx),
                        isPopping:true, popStartTime:performance.now(), popDuration:550,
                        isPulsing:false, pulseTime:0, pulseStartTime:0,
                        homeX:sp.x, homeY:sp.y, spawnStartX:sp.x+(Math.random()-0.5)*80, spawnStartY:sp.y+(Math.random()-0.5)*80,
                        spawnProgress:0, isSpawning:true, spawnStartTime:performance.now(), spawnDuration:2000,
                        x:sp.x, y:sp.y };
                    state.players.push(local);
                    loadPlayerPFP(local);
                } else {
                    local.homeX=sp.x; local.homeY=sp.y;
                    if(isCountdown){
                        if(!local.isSpawning){
                            local.spawnStartX=local.x; local.spawnStartY=local.y;
                            local.spawnStartTime=performance.now(); local.spawnDuration=2000;
                            local.isSpawning=true; local.spawnProgress=0;
                        }
                    } else {
                        if(!local.isSpawning){ local.x=sp.x; local.y=sp.y; }
                    }
                    if(sp.bet>local.bet){ local.isPulsing=true; local.pulseStartTime=performance.now(); local.pulseTime=0; }
                }
                local.name=sp.name; local.bet=sp.bet; local.color=sp.color; local.displayRadius=sp.displayRadius; local.alive=sp.alive;
            });
            state.players=state.players.filter(p=>seen.has(p.id));
            if(state.gameState==='playing'||state.gameState==='finished'){
                state.players.forEach(p=>{ p.isSpawning=false; p.x=p.homeX; p.y=p.homeY; });
            }
            detectBumpsForHaptics();
            if(prevGameState!=='idle'&&state.gameState==='idle'){ waitingText.style.display='block'; countdownTimer.style.display='none'; timerProgressWrap.classList.remove('visible'); }
            if(state.gameState==='countdown'){ countdownTimer.style.display='block'; timerProgressWrap.classList.add('visible'); }
            if(state.gameState==='playing'||state.gameState==='finished'){
                countdownTimer.style.display=state.gameState==='countdown'?'block':countdownTimer.style.display;
                if(state.gameState==='playing') timerProgressWrap.classList.remove('visible');
            }
            updateStatsBar(); updateBetUI(); updateWaitingText(); updateBetOverlayVisibility(); updatePlayerList(); updateFrogVisibility();
        }

        function detectBumpsForHaptics() {
            if(state.gameState!=='playing'){ touchingIds=new Set(); return; }
            const me=getPlayer(state.userId);
            if(!me||!me.alive){ touchingIds=new Set(); return; }
            const nowTouching=new Set();
            state.players.forEach(p=>{
                if(p.id===me.id||!p.alive) return;
                const dx=p.x-me.x, dy=p.y-me.y;
                const dist=Math.sqrt(dx*dx+dy*dy);
                const minDist=(me.displayRadius||18)+(p.displayRadius||18);
                if(dist<minDist) nowTouching.add(p.id);
            });
            let isNewBump=false;
            nowTouching.forEach(id=>{ if(!touchingIds.has(id)) isNewBump=true; });
            if(isNewBump) haptic('medium');
            touchingIds=nowTouching;
        }
        let touchingIds=new Set();

        function getPlayer(id){ return state.players.find(p=>p.id===id); }
        function getAlive(){ return state.players.filter(p=>p.alive); }

        function updateStatsBar(){ statsPlayers.textContent=getAlive().length; statsPot.textContent=state.pot; }
        function updateWaitingText(){
            const alive=getAlive();
            if(alive.length===0){ waitingText.innerHTML='<span>waiting for players</span><div class="sub">place a bet to join</div>'; }
            else { waitingText.innerHTML=`<span>● ${alive.length} player${alive.length>1?'s':''} ready</span>`; }
            updateFrogVisibility();
        }
        function updateFrogVisibility(){
            const alive=getAlive();
            const showFrog=alive.length<2&&state.gameState==='idle';
            frogGif.classList.toggle('show',showFrog);
            waitingText.style.display=showFrog?'none':'block';
        }
        function updateBetOverlayVisibility(){
            const shouldHide=state.gameState==='playing'||state.gameState==='finished';
            betOverlayWrap.classList.toggle('hidden',shouldHide);
            playerListContainer.classList.toggle('shift-up',shouldHide);
        }
        function updatePlayerList(){
            const alive=getAlive();
            const totalBet=state.players.reduce((s,p)=>s+p.bet,0);
            if(alive.length===0){ playerListContainer.innerHTML=''; return; }
            let html='';
            alive.forEach(p=>{
                const chance=totalBet>0?((p.bet/totalBet)*100).toFixed(1):0;
                const isYou=p.id===state.userId;
                const topInfo=state.topPlayerIds.get(p.id);
                let crown='';
                if(topInfo){ if(topInfo.rank===1) crown='👑'; else if(topInfo.rank===2) crown='👑'; }
                html+=`<div class="pl-entry ${isYou?'you':''}">
                            <div class="pl-avatar"><img src="${p.pfp}" onerror="this.src='${state.defaultAvatar}'" /></div>
                            <span class="pl-name">${crown} ${p.name}</span>
                            <span class="pl-bet">${p.bet}</span>
                            <span class="pl-chance">${chance}%</span>
                        </div>`;
            });
            playerListContainer.innerHTML=html;
        }

        function easePopBounce(t){ if(t>=1)return 1; const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
        function getPopScale(player){
            if(!player.isPopping) return 1;
            const elapsed=performance.now()-player.popStartTime;
            const progress=Math.min(elapsed/player.popDuration,1);
            if(progress>=1){ player.isPopping=false; return 1; }
            return easePopBounce(progress);
        }
        function updatePlayerAnimations(){
            const now=performance.now();
            state.players.forEach(p=>{
                if(p.isPulsing){
                    const elapsed=(now-p.pulseStartTime)/1000;
                    if(elapsed>0.6){ p.isPulsing=false; p.pulseTime=0; } else p.pulseTime=elapsed;
                }
                if(p.isSpawning&&p.homeX!==undefined){
                    const elapsed=now-p.spawnStartTime;
                    const progress=Math.min(elapsed/p.spawnDuration,1);
                    const eased=easeOutCubic(progress);
                    p.x=p.spawnStartX+(p.homeX-p.spawnStartX)*eased;
                    p.y=p.spawnStartY+(p.homeY-p.spawnStartY)*eased;
                    p.spawnProgress=eased;
                    if(progress>=1){ p.isSpawning=false; p.x=p.homeX; p.y=p.homeY; }
                }
            });

        function applyIceServerState(snapshot) {
            const prevGameState=iceState.gameState;
            const oldPuckX = iceState.puck.x;
            const oldPuckY = iceState.puck.y;

            iceState.gameState=snapshot.gameState;
            iceState.pot=snapshot.pot;
            iceState.countdownStartTime=snapshot.countdownStartTime;
            iceState.spinStartTime=snapshot.spinStartTime;
            iceState.spinDuration=snapshot.spinDuration;
            iceState.spinFinalAngle=snapshot.spinFinalAngle;

            // Store previous position for interpolation
            iceState.puckPrevX = oldPuckX;
            iceState.puckPrevY = oldPuckY;
            iceState.puck.x = snapshot.puck.x;
            iceState.puck.y = snapshot.puck.y;
            iceState.puckUpdateTime = Date.now();

            // ─── VIBRATION: REMOVED ─────────────────────────────────────
            // (No haptic feedback for ice arena collisions)

            // Reset idle puck
            if (snapshot.gameState !== 'idle' || snapshot.players.length > 0) {
                iceState.idlePuckInitialized = false;
            }

            if(snapshot.gameState==='spinning' && prevGameState!=='spinning'){
                iceState.puckVisible=true;
                iceState.puckPopStart=performance.now();
                iceState.puckScale=0;
                iceState.zoom=1; iceState.isZoomingIn=false; iceState.isZoomingOut=false; iceState.zoomLocked=false; iceState.zoomOutTriggered=false;
            }
            if(snapshot.gameState==='sliding' && prevGameState!=='sliding'){
                iceState.slideStartTime=performance.now();
                iceState.zoom=1; iceState.isZoomingIn=false; iceState.isZoomingOut=false; iceState.zoomLocked=false; iceState.zoomOutTriggered=false;
            }
            if(snapshot.gameState==='finished' && prevGameState!=='finished'){
                if(iceState.zoom>1.1 && !iceState.zoomOutTriggered){
                    iceState.zoomOutTriggered=true;
                    iceState.isZoomingOut=true;
                    iceState.isZoomingIn=false;
                    iceState.zoomStartTime=performance.now();
                    iceState.zoomTarget=1;
                }
            }
            if(snapshot.gameState==='idle' && prevGameState!=='idle'){
                iceState.puckVisible=false; iceState.puckScale=1;
                iceState.zoom=1; iceState.isZoomingIn=false; iceState.isZoomingOut=false; iceState.zoomLocked=false; iceState.zoomOutTriggered=false;
                iceState.pfpPop.clear();
                iceState.showOwnerName = false;
                iceState.currentOwnerName = '';
            }

            const seen=new Set();
            snapshot.players.forEach(sp=>{
                seen.add(sp.id);
                let local=iceState.players.find(p=>p.id===sp.id);
                if(!local){
                    const colorIdx=iceState.players.length%state.colors.length;
                    local={ id:sp.id, name:sp.name, pfp:sp.pfp, pfpImg:generateDefaultAvatar(sp.name?sp.name.charAt(0):'?',colorIdx),
                        x1:sp.x1, y1:sp.y1, x2:sp.x2, y2:sp.y2, color:sp.color, bet:sp.bet };
                    iceState.players.push(local);
                    loadIcePlayerPFP(local);
                    iceState.pfpPop.set(sp.id, { startTime: performance.now(), duration: 400 });
                } else {
                    if(Math.abs(local.bet - sp.bet) > 5){
                        iceState.pfpPop.set(sp.id, { startTime: performance.now(), duration: 400 });
                    }
                    local.x1=sp.x1; local.y1=sp.y1; local.x2=sp.x2; local.y2=sp.y2;
                    local.color=sp.color; local.bet=sp.bet;
                }
                local.name=sp.name;
            });
            iceState.players=iceState.players.filter(p=>seen.has(p.id));

            if(prevGameState!=='idle' && iceState.gameState==='idle'){
                iceState.winnerId=null;
                iceWaitingText.style.display='block';
                iceTimerWrap.style.display='none';
                iceTimerProgressWrap.classList.remove('visible');

            const steps=Math.min(Math.abs(diff),40);
            const stepSize=diff/steps;
            let step=0;
            if(balanceAnimInterval){ clearInterval(balanceAnimInterval); balanceAnimInterval=null; }
            balanceAnimInterval=setInterval(()=>{
                step++;
                const newVal=Math.round(current+stepSize*step);
                if(step>=steps||Math.abs(newVal-target)<1){
                    balanceEl.textContent=target;
                    clearInterval(balanceAnimInterval);
                    balanceAnimInterval=null;
                } else balanceEl.textContent=newVal;
            },25);

        function playVictorySound(){
            try {
                if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
                if(victorySoundPlaying) return;
                victorySoundPlaying=true;
                const now=audioCtx.currentTime;
                const notes=[523.25,659.25,783.99];
                const startTimes=[0,0.08,0.16];
                const durations=[0.3,0.3,0.5];
                for(let i=0;i<notes.length;i++){
                    const osc=audioCtx.createOscillator();
                    const gain=audioCtx.createGain();
                    osc.frequency.value=notes[i];
                    osc.type='sine';
                    gain.gain.setValueAtTime(0.18,now+startTimes[i]);
                    gain.gain.exponentialRampToValueAtTime(0.001,now+startTimes[i]+durations[i]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now+startTimes[i]);
                    osc.stop(now+startTimes[i]+durations[i]);
                }
                setTimeout(()=>{ victorySoundPlaying=false; },800);
            } catch(e){ victorySoundPlaying=false; }
        }

                img.onerror=()=>{ profilePfp.src=state.defaultAvatar; haptic('light'); };
                img.src=state.pfp;
            }
        });
        anonToggle.addEventListener('change',()=>{
            if(!socket||!socket.connected){ anonToggle.checked=state.anonymous; return; }
            const enabled=anonToggle.checked;
            anonToggle.disabled=true;
            socket.emit('setAnonymous',{enabled},(res)=>{
                anonToggle.disabled=false;
                if(!res?.ok){ anonToggle.checked=state.anonymous; console.warn('setAnonymous failed:',res?.error); return; }
                state.anonymous=res.anonymous; haptic('light');
            });
        });

        function switchTab(tabId){
            if(state.currentTab===tabId) return;
            const oldTab=state.currentTab;
            state.currentTab=tabId;
            const oldEl=tabPages[oldTab];
            if(oldEl){ oldEl.classList.remove('active'); oldEl.classList.add('exit'); setTimeout(()=>{ oldEl.classList.remove('exit'); },350); }
            const newEl=tabPages[tabId];
            if(newEl){ newEl.classList.add('active'); newEl.classList.remove('exit'); if(tabId==='profile') updateProfile(); if(tabId==='top') refreshLeaderboard(); }
            tabBtns.forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tabId));
            haptic('light');
        }
        tabBtns.forEach(btn=>{
            btn.addEventListener('click',function(e){ e.stopPropagation(); switchTab(this.dataset.tab); });
        });

        function render(){
            const w=state.arenaSize;
            const half=w/2;
            const s=scaleFactor();
            ctx.clearRect(0,0,w,w);
            const grad=ctx.createRadialGradient(half,half,0,half,half,half);
            grad.addColorStop(0,'rgba(10,10,10,0.85)');
            grad.addColorStop(1,'rgba(0,0,0,0.95)');
            ctx.fillStyle=grad; ctx.fillRect(0,0,w,w);
            const pts=state.perimeterPoints.map(p=>({x:p.x*s,y:p.y*s}));
            ctx.save();
            ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=30;
            ctx.fillStyle='rgba(26,26,30,0.80)';
            if(pts.length>0){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath(); ctx.fill(); }
            ctx.restore();
            ctx.save();
            ctx.fillStyle='rgba(40,40,46,0.60)';
            if(pts.length>0){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath(); ctx.fill(); }
            ctx.restore();
            const opening=state.opening;
            const isFlashing=opening&&opening.state==='flashing';
            const isOpen=opening&&opening.state==='open';
            const total=pts.length;
            ctx.save();
            const hasGap=opening!==null&&(isFlashing||isOpen);
            if(hasGap&&total>0){
                const start=opening.startIdx, end=opening.endIdx;
                ctx.strokeStyle='rgba(160,160,176,0.3)'; ctx.lineWidth=5;
                for(let i=0;i<total;i++){
                    const j=(i+1)%total;
                    let inGap=false;
                    if(start<end){ if(i>=start&&i<end) inGap=true; if(j>=start&&j<end) inGap=true; } else { if(i>=start||i<end) inGap=true; if(j>=start||j<end) inGap=true; }
                    if(inGap) continue;
                    ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
                }
                if(isFlashing){
                    const isRed=(opening.flashCount%2===0);
                    ctx.save();
                    const flashColor=isRed?'#ff0044':'rgba(160,160,176,0.25)';
                    let gapSegments=[];
                    if(start<end){ for(let i=start;i<end;i++) gapSegments.push({i,j:(i+1)%total}); }
                    else { for(let i=start;i<total;i++) gapSegments.push({i,j:(i+1)%total}); for(let i=0;i<end;i++) gapSegments.push({i,j:(i+1)%total}); }
                    ctx.strokeStyle=flashColor; ctx.lineWidth=isRed?5:3; ctx.shadowBlur=0; ctx.shadowColor='transparent';
                    for(const seg of gapSegments){ ctx.beginPath(); ctx.moveTo(pts[seg.i].x,pts[seg.i].y); ctx.lineTo(pts[seg.j].x,pts[seg.j].y); ctx.stroke(); }
                    ctx.restore();
                }
            } else if(total>0){
                ctx.strokeStyle='rgba(160,160,176,0.25)'; ctx.lineWidth=5;
                ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
                for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
                ctx.closePath(); ctx.stroke();
            }
            ctx.restore();
            state.players.forEach(p=>{
                if(!p.alive) return;
                const px=p.x*s, py=p.y*s;
                const popScale=getPopScale(p);
                const radius=(p.displayRadius||18)*s*VISUAL_RADIUS_SCALE;
                const displayRadius=radius*popScale;
                let pulseScale=1;
                if(p.isPulsing){ const t=p.pulseTime; if(t<0.6){ const phase=t/0.6; pulseScale=1+0.12*Math.sin(phase*Math.PI*3)*(1-phase); } }
                const finalRadius=displayRadius*pulseScale;
                const drawRadius=Math.max(finalRadius-1,1);
                const topInfo=state.topPlayerIds.get(p.id);
                let borderColor='rgba(255,255,255,0.35)'; let borderWidth=1.5; let shadowColor='transparent', shadowBlur=0;
                if(topInfo){
                    if(topInfo.rank===1){ borderColor='#FFD700'; borderWidth=3.5; shadowColor='rgba(255,215,0,0.6)'; shadowBlur=18; }
                    else if(topInfo.rank===2){ borderColor='#C0C0C0'; borderWidth=3.0; shadowColor='rgba(192,192,192,0.5)'; shadowBlur=14; }
                }
                ctx.save();
                ctx.beginPath(); ctx.arc(px,py,drawRadius,0,Math.PI*2); ctx.closePath(); ctx.clip();
                if(p.pfpImg&&p.pfpImg.complete&&p.pfpImg.naturalWidth>0){
                    const size=drawRadius*2;
                    ctx.drawImage(p.pfpImg,px-drawRadius,py-drawRadius,size,size);
                } else {
                    ctx.fillStyle=p.color||'#555';
                    ctx.fillRect(px-drawRadius,py-drawRadius,drawRadius*2,drawRadius*2);
                    ctx.fillStyle='#fff';
                    ctx.font=`${drawRadius*0.5}px system-ui, sans-serif`;
                    ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText((p.name||'?').charAt(0).toUpperCase(),px,py+1);
                }
                ctx.restore();
                ctx.save();
                ctx.shadowBlur=shadowBlur; ctx.shadowColor=shadowColor;
                ctx.beginPath(); ctx.arc(px,py,finalRadius,0,Math.PI*2);
                ctx.strokeStyle=borderColor; ctx.lineWidth=borderWidth; ctx.stroke();
                ctx.shadowBlur=0;
                ctx.restore();
            });
        }

        // ─── RENDER ICE – with visual rotation pattern ──────────────
        function renderIce() {
            const w = iceState.arenaSize;
            if (!w) return;
            const half = w / 2;
            const s = iceScaleFactor();

            iceCtx.clearRect(0, 0, w, w);
            const grad = iceCtx.createRadialGradient(half, half, 0, half, half, half);
            grad.addColorStop(0, 'rgba(12,16,22,0.85)');
            grad.addColorStop(1, 'rgba(2,4,8,0.95)');
            iceCtx.fillStyle = grad;
            iceCtx.fillRect(0, 0, w, w);

            const showIdle = (iceState.players.length === 0 && iceState.gameState === 'idle');
            if (showIdle) {
                const cx = w / 2;
                const cy = w / 2;
                const puckRadius = 10 * s;
                iceCtx.save();
                iceCtx.shadowColor = 'rgba(180, 220, 255, 0.7)';
                iceCtx.shadowBlur = 12;
                iceCtx.strokeStyle = '#eaf6ff';
                iceCtx.lineWidth = 2.5;
                iceCtx.beginPath();
                iceCtx.arc(cx, cy, puckRadius, 0, Math.PI * 2);
                iceCtx.stroke();
                const crossSize = puckRadius * 0.75;
                iceCtx.shadowBlur = 0;
                iceCtx.globalAlpha = 0.65;
                iceCtx.lineWidth = 2.0;
                iceCtx.strokeStyle = '#eaf6ff';
                iceCtx.beginPath();
                iceCtx.moveTo(cx - crossSize, cy);
                iceCtx.lineTo(cx + crossSize, cy);
                iceCtx.moveTo(cx, cy - crossSize);
                iceCtx.lineTo(cx, cy + crossSize);
                iceCtx.stroke();
                iceCtx.globalAlpha = 1;
                iceCtx.restore();
                return;
            }

            // Regular game rendering
            const pts = iceState.perimeterPoints.map(p => ({ x: p.x * s, y: p.y * s }));
            if (pts.length === 0) return;
            const perimeterPath = new Path2D();
            perimeterPath.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) perimeterPath.lineTo(pts[i].x, pts[i].y);
            perimeterPath.closePath();

            const now = performance.now();
            let zoomTx = 0, zoomTy = 0, zoomSc = 1;
            const puck = iceState.puck;

            // Zoom logic
            if (iceState.gameState === 'sliding') {
                const slideElapsed = (now - iceState.slideStartTime) / 1000;
                if (slideElapsed > 6.0 && !iceState.isZoomingOut && !iceState.zoomLocked) {
                    if (!iceState.isZoomingIn && iceState.zoom < 1.7) {
                        iceState.isZoomingIn = true;
                        iceState.zoomStartTime = now;
                        iceState.zoomTarget = 1.8;
                    }
                }
            }
            if (iceState.isZoomingOut) {
                const elapsed = (now - iceState.zoomStartTime) / 1000;
                const progress = Math.min(elapsed / iceState.zoomDuration, 1);
                const eased = easeInOutCubic(progress);
                iceState.zoom = iceState.zoomTarget + (1 - iceState.zoomTarget) * (1 - eased);
                if (progress >= 1) {
                    iceState.isZoomingOut = false;
                    iceState.zoom = 1;
                    iceState.zoomLocked = false;
                    iceState.zoomOutTriggered = false;
                }
            }
            if (iceState.isZoomingIn) {
                const elapsed = (now - iceState.zoomStartTime) / 1000;
                const progress = Math.min(elapsed / iceState.zoomDuration, 1);
                const eased = easeInOutCubic(progress);
                iceState.zoom = 1 + (iceState.zoomTarget - 1) * eased;
                if (progress >= 1) {
                    iceState.isZoomingIn = false;
                    iceState.zoomLocked = true;
                    iceState.zoom = iceState.zoomTarget;
                }
            }

            // Interpolate puck position
            let renderPuckX = puck.x;
            let renderPuckY = puck.y;
            if (iceState.puckUpdateTime > 0) {
                const elapsed = (Date.now() - iceState.puckUpdateTime) / 1000;
                const lerpFactor = Math.min(elapsed * 30, 1);
                renderPuckX = iceState.puckPrevX + (puck.x - iceState.puckPrevX) * lerpFactor;
                renderPuckY = iceState.puckPrevY + (puck.y - iceState.puckPrevY) * lerpFactor;
            }

            // Calculate speed for owner name
            const speed = Math.sqrt(
                Math.pow(renderPuckX - iceState.puckPrevX, 2) +
                Math.pow(renderPuckY - iceState.puckPrevY, 2)
            );

            // Apply zoom
            if (iceState.zoom > 1.01) {
                const puckScreenX = renderPuckX * s;
                const puckScreenY = renderPuckY * s;
                const cx = half, cy = half;
                zoomTx = (cx - puckScreenX) * iceState.zoom + cx - cx * iceState.zoom;
                zoomTy = (cy - puckScreenY) * iceState.zoom + cy - cy * iceState.zoom;
                zoomSc = iceState.zoom;
                iceCtx.save();
                iceCtx.translate(zoomTx, zoomTy);
                iceCtx.scale(zoomSc, zoomSc);
            }

            // Draw perimeter and segments
            iceCtx.save();
            iceCtx.shadowColor = 'rgba(0,0,0,0.9)';
            iceCtx.shadowBlur = 30;
            iceCtx.fillStyle = 'rgba(20,28,38,0.85)';
            iceCtx.fill(perimeterPath);
            iceCtx.restore();

            iceCtx.save();
            iceCtx.clip(perimeterPath);

            // Player segments with rotation pattern
            iceState.players.forEach((p, index) => {
                const x1 = p.x1 * s;
                const y1 = p.y1 * s;
                const x2 = p.x2 * s;
                const y2 = p.y2 * s;
                const segW = x2 - x1;
                const segH = y2 - y1;
                const isWinner = (iceState.gameState === 'finished' && iceState.winnerId === p.id);

                // Fill segment
                const gradRect = iceCtx.createLinearGradient(x1, y1, x2, y2);
                gradRect.addColorStop(0, lightenColor(p.color, isWinner ? 70 : 40));
                gradRect.addColorStop(1, p.color);
                iceCtx.globalAlpha = isWinner ? 1 : 0.93;
                iceCtx.fillStyle = gradRect;
                iceCtx.fillRect(x1, y1, segW, segH);
                iceCtx.globalAlpha = 1;

                // Winner border
                if (isWinner) {
                    iceCtx.save();
                    iceCtx.strokeStyle = 'rgba(255,255,255,0.85)';
                    iceCtx.lineWidth = 3;
                    iceCtx.shadowColor = hexToRgba(p.color, 0.8);
                    iceCtx.shadowBlur = 16;
                    iceCtx.strokeRect(x1 + 1.5, y1 + 1.5, segW - 3, segH - 3);
                    iceCtx.restore();
                }

                // ─── VISUAL ROTATION PATTERN ──────────────────────────
                // Alternate between normal (grid) and rotated (diagonal) lines.
                const useDiagonal = (index % 2 === 0);
                iceCtx.save();
                iceCtx.globalAlpha = 0.25;
                iceCtx.strokeStyle = 'rgba(255,255,255,0.4)';
                iceCtx.lineWidth = 2;
                if (useDiagonal) {
                    // Diagonal lines (45°)
                    const gap = Math.min(segW, segH) * 0.25;
                    // Draw two diagonal lines crossing the cell
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1, y1 + gap);
                    iceCtx.lineTo(x1 + gap, y1);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x2 - gap, y2);
                    iceCtx.lineTo(x2, y2 - gap);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1 + segW * 0.5 - gap * 0.5, y1 + segH * 0.5 - gap * 0.5);
                    iceCtx.lineTo(x1 + segW * 0.5 + gap * 0.5, y1 + segH * 0.5 + gap * 0.5);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1 + segW * 0.5 + gap * 0.5, y1 + segH * 0.5 - gap * 0.5);
                    iceCtx.lineTo(x1 + segW * 0.5 - gap * 0.5, y1 + segH * 0.5 + gap * 0.5);
                    iceCtx.stroke();
                } else {
                    // Horizontal and vertical grid lines
                    const gapX = segW * 0.3;
                    const gapY = segH * 0.3;
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1 + gapX, y1);
                    iceCtx.lineTo(x1 + gapX, y2);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x2 - gapX, y1);
                    iceCtx.lineTo(x2 - gapX, y2);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1, y1 + gapY);
                    iceCtx.lineTo(x2, y1 + gapY);
                    iceCtx.stroke();
                    iceCtx.beginPath();
                    iceCtx.moveTo(x1, y2 - gapY);
                    iceCtx.lineTo(x2, y2 - gapY);
                    iceCtx.stroke();
                }
                iceCtx.restore();

                // PFP circle
                const centerX = (x1 + x2) / 2;
                const centerY = (y1 + y2) / 2;
                const avatarR = Math.min(segW, segH) * 0.32;
                let pfpScale = 1;
                const popData = iceState.pfpPop.get(p.id);
                if (popData) {
                    const elapsed = (now - popData.startTime) / 1000;
                    const progress = Math.min(elapsed / (popData.duration / 1000), 1);
                    if (progress < 1) {
                        pfpScale = easeOutBack(progress);
                        pfpScale = Math.min(1.2, Math.max(0, pfpScale));
                    } else {
                        iceState.pfpPop.delete(p.id);
                    }
                }
                const drawR = avatarR * pfpScale;
                const cx = centerX;
                const cy = centerY;
                iceCtx.save();
                iceCtx.beginPath();
                iceCtx.arc(cx, cy, drawR, 0, Math.PI * 2);
                iceCtx.closePath();
                iceCtx.clip();
                if (p.pfpImg && p.pfpImg.complete && p.pfpImg.naturalWidth > 0) {
                    iceCtx.drawImage(p.pfpImg, cx - drawR, cy - drawR, drawR * 2, drawR * 2);
                } else {
                    iceCtx.fillStyle = p.color || '#555';
                    iceCtx.fillRect(cx - drawR, cy - drawR, drawR * 2, drawR * 2);
                }
                iceCtx.restore();

                // Divider lines (thin borders between cells)
                iceCtx.save();
                iceCtx.globalAlpha = 0.15;
                iceCtx.strokeStyle = 'rgba(255,255,255,0.15)';
                iceCtx.lineWidth = 2;
                iceCtx.beginPath();
                iceCtx.moveTo(x2, y1);
                iceCtx.lineTo(x2, y2);
                iceCtx.moveTo(x1, y2);
                iceCtx.lineTo(x2, y2);
                iceCtx.stroke();
                iceCtx.restore();
                iceCtx.globalAlpha = 1;
            });
            iceCtx.restore();

            // Rink border
            iceCtx.save();
            iceCtx.strokeStyle = 'rgba(160,190,220,0.35)';
            iceCtx.lineWidth = 4;
            iceCtx.stroke(perimeterPath);
            iceCtx.restore();

            // Spinning arrow
            if (iceState.gameState === 'spinning' && iceState.spinStartTime) {
                const elapsed = (Date.now() - iceState.spinStartTime) / 1000;
                const t = Math.min(1, elapsed / (iceState.spinDuration || 1));
                const extraSpins = 4;
                const angle = iceState.spinFinalAngle - (1 - easeOutCubic(t)) * (extraSpins * Math.PI * 2);
                const arrowLen = Math.min(w * 0.18, 45);
                const headSize = Math.min(arrowLen * 0.4, 12);
                iceCtx.save();
                iceCtx.translate(half, half);
                iceCtx.rotate(angle);
                iceCtx.strokeStyle = '#e8f4ff';
                iceCtx.lineWidth = 2.5;
                iceCtx.shadowColor = 'rgba(139,197,255,0.8)';
                iceCtx.shadowBlur = 12;
                iceCtx.beginPath();
                iceCtx.moveTo(0, 0);
                iceCtx.lineTo(arrowLen - headSize * 0.6, 0);
                iceCtx.stroke();
                iceCtx.fillStyle = '#e8f4ff';
                iceCtx.shadowBlur = 16;
                iceCtx.beginPath();
                iceCtx.moveTo(arrowLen, 0);
                iceCtx.lineTo(arrowLen - headSize, -headSize * 0.5);
                iceCtx.lineTo(arrowLen - headSize, headSize * 0.5);
                iceCtx.closePath();
                iceCtx.fill();
                iceCtx.restore();
            }

            // Puck
            if (iceState.puckVisible) {
                let scale = 1;
                if (iceState.puckPopStart) {
                    const elapsedPop = (performance.now() - iceState.puckPopStart) / 1000;
                    const duration = 0.4;
                    const progress = Math.min(elapsedPop / duration, 1);
                    if (progress < 1) {
                        scale = easeOutBack(progress);
                        scale = Math.min(1.2, Math.max(0, scale));
                    } else {
                        scale = 1;
                        iceState.puckPopStart = 0;
                    }
                }
                let px, py;
                if (iceState.gameState === 'spinning') {
                    px = half;
                    py = half;
                } else {
                    px = renderPuckX * s;
                    py = renderPuckY * s;
                }
                const puckRadius = PUCK_RENDER_RADIUS * s * scale;
                iceCtx.save();
                iceCtx.shadowColor = 'rgba(180,220,255,0.9)';
                iceCtx.shadowBlur = 14;
                iceCtx.strokeStyle = '#eaf6ff';
                iceCtx.lineWidth = 2.5;
                iceCtx.beginPath();
                iceCtx.arc(px, py, puckRadius, 0, Math.PI * 2);
                iceCtx.stroke();
                const crossSize = puckRadius * 0.75;
                iceCtx.shadowBlur = 0;
                iceCtx.globalAlpha = 0.65;
                iceCtx.lineWidth = 2.0;
                iceCtx.strokeStyle = '#eaf6ff';
                iceCtx.beginPath();
                iceCtx.moveTo(px - crossSize, py);
                iceCtx.lineTo(px + crossSize, py);
                iceCtx.moveTo(px, py - crossSize);
                iceCtx.lineTo(px, py + crossSize);
                iceCtx.stroke();
                iceCtx.globalAlpha = 1;
                iceCtx.restore();

                // Owner name under puck
                const speedThreshold = 2.0;
                const isSlow = speed < speedThreshold && iceState.gameState === 'sliding';
                let ownerName = '';
                if (iceState.players.length > 0 && iceState.gameState === 'sliding') {
                    const pxLocal = renderPuckX;
                    const pyLocal = renderPuckY;
                    for (const p of iceState.players) {
                        if (pxLocal >= p.x1 && pxLocal <= p.x2 && pyLocal >= p.y1 && pyLocal <= p.y2) {
                            ownerName = p.name || 'Player';
                            break;
                        }
                    }
                }
                if (isSlow && ownerName) {
                    iceState.currentOwnerName = ownerName;
                    iceState.showOwnerName = true;
                    iceState.nameFadeIn = Math.min(1, iceState.nameFadeIn + 0.03);
                } else if (!isSlow || !ownerName) {
                    iceState.nameFadeIn = Math.max(0, iceState.nameFadeIn - 0.02);
                    if (iceState.nameFadeIn <= 0) {
                        iceState.showOwnerName = false;
                    }
                }
                if (iceState.showOwnerName && iceState.currentOwnerName && iceState.nameFadeIn > 0.1) {
                    const alpha = iceState.nameFadeIn * 0.55;
                    const fontSize = Math.max(9, Math.min(14, puckRadius * 0.9));
                    iceCtx.save();
                    iceCtx.globalAlpha = alpha;
                    iceCtx.textAlign = 'center';
                    iceCtx.textBaseline = 'top';
                    iceCtx.font = `bold ${fontSize}px system-ui, sans-serif`;
                    iceCtx.fillStyle = 'rgba(255,255,255,0.85)';
                    iceCtx.shadowColor = 'rgba(0,0,0,0.9)';
                    iceCtx.shadowBlur = 6;
                    let displayName = iceState.currentOwnerName;
                    if (displayName.length > 10) displayName = displayName.slice(0, 9) + '…';
                    const textY = py + puckRadius + 4;
                    iceCtx.fillText(displayName, px, textY);
                    iceCtx.restore();
                }
            }

            // Restore zoom if used
            if (iceState.zoom > 1.01) {
                iceCtx.restore();
            }
        }

        function renderLoop(){
            updatePlayerAnimations();
            const now=Date.now();
            if(state.gameState==='countdown'&&state.countdownStartTime){
                const elapsed=(now-state.countdownStartTime)/1000;
                const remaining=Math.max(0,10.0-elapsed);
                const secs=Math.floor(remaining);
                const ms=Math.floor((remaining-secs)*100);
                countdownTimer.textContent=secs+'.'+String(ms).padStart(2,'0');
                const progress=Math.min(1,elapsed/10.0)*100;
                timerProgress.style.width=progress+'%';
                timerProgressWrap.classList.add('visible');
            } else if(state.gameState==='prestart'){ countdownTimer.textContent='GO!'; timerProgress.style.width='100%'; timerProgressWrap.classList.add('visible'); }
            else if(state.gameState==='idle'){ timerProgressWrap.classList.remove('visible'); }

            if(iceState.gameState==='countdown'&&iceState.countdownStartTime){
                const elapsed=(now-iceState.countdownStartTime)/1000;
                const remaining=Math.max(0,10.0-elapsed);
                const secs=Math.floor(remaining);
                const ms=Math.floor((remaining-secs)*100);
                iceCountdownTimer.textContent=secs+'.'+String(ms).padStart(2,'0');
                iceTimerProgress.style.width=(Math.min(1,elapsed/10.0)*100)+'%';
                iceTimerProgressWrap.classList.add('visible');
            } else if(iceState.gameState==='spinning'){ iceCountdownTimer.textContent='🌀'; iceTimerProgress.style.width='100%'; }
            else if(iceState.gameState==='idle'){ iceTimerProgressWrap.classList.remove('visible'); }

            render(); renderIce();
            requestAnimationFrame(renderLoop);
        }

        function init(){
            if(tg?.initDataUnsafe?.user){ const u=tg.initDataUnsafe.user; state.username=u.username||u.first_name||'player'; state.pfp=u.photo_url||''; } else state.username='player';
            usernameDisplay.textContent='@'+state.username;
            profilePfp.src=state.pfp||state.defaultAvatar;
            profileName.textContent=state.username;
            profileUsername.textContent='@'+state.username;
            resizeCanvas(); resizeIceCanvas();
            window.addEventListener('resize',()=>{ resizeCanvas(); resizeIceCanvas(); });
            Object.keys(tabPages).forEach(key=>tabPages[key].classList.toggle('active',key==='pvp'));
            document.getElementById('tabs').style.pointerEvents='auto';
            tabBtns.forEach(b=>b.style.pointerEvents='auto');
            requestAnimationFrame(renderLoop);
            setOnline(false);
        }
        init();
        window.__state=state;
    </script>

    <!-- ═══ LOADING SCREEN CONTROLLER (unchanged) ═══ -->
    <script>
        (function() {
            'use strict';

            const GIFS = [
                'https://i.postimg.cc/7Z5LvW39/ezgif-4113ebc5948a7fca.gif',
                'https://i.postimg.cc/tJRXBSCb/ezgif-4de2b661e14101c5.gif',
                'https://i.postimg.cc/J7dVw4Pf/ezgif-26d00414e9a7afa6.gif'
            ];

            const loadingScreen = document.getElementById('loading-screen');
            const grid = document.getElementById('loading-grid');
            const mergedSquare = document.getElementById('merged-square');
            const pulseRing = document.getElementById('pulse-ring');
            const loadingText = document.getElementById('loading-text');

            const selectedGif = GIFS[Math.floor(Math.random() * GIFS.length)];
            let squares = [];
            let squareSize = 0, gapSize = 0, gridSize = 0;

            function measureGrid() {
                const rect = grid.getBoundingClientRect();
                gridSize = rect.width;
                const computedStyle = getComputedStyle(grid);
                gapSize = parseFloat(computedStyle.gap) || 8;
                squareSize = (gridSize - gapSize * 2) / 3;
            }

            function buildGrid() {
                grid.innerHTML = '';
                squares = [];
                for (let i = 0; i < 9; i++) {
                    const sq = document.createElement('div');
                    sq.className = 'load-square';
                    const img = document.createElement('img');
                    img.className = 'gif-bg';
                    img.src = selectedGif;
                    img.alt = '';
                    img.loading = 'lazy';
                    sq.appendChild(img);
                    grid.appendChild(sq);
                    squares.push(sq);
                }
            }

            function runPop() {
                return new Promise((resolve) => {
                    let done = 0;
                    squares.forEach((sq, i) => {
                        const delay = 60 + i * 50;
                        setTimeout(() => {
                            sq.classList.add('pop');
                            done++;
                            if (done === squares.length) {
                                setTimeout(resolve, 350);
                            }
                        }, delay);
                    });
                    setTimeout(resolve, 1400);
                });
            }

            function runSlide() {
                return new Promise((resolve) => {
                    measureGrid();
                    const gridRect = grid.getBoundingClientRect();
                    const cx = gridRect.left + gridRect.width / 2;
                    const cy = gridRect.top + gridRect.height / 2;

                    squares.forEach((sq) => {
                        const r = sq.getBoundingClientRect();
                        const dx = cx - (r.left + r.width / 2);
                        const dy = cy - (r.top + r.height / 2);
                        sq.dataset.tx = dx;
                        sq.dataset.ty = dy;
                    });

                    squares.forEach((sq, i) => {
                        const dx = parseFloat(sq.dataset.tx);
                        const dy = parseFloat(sq.dataset.ty);
                        const delay = i * 30;
                        setTimeout(() => {
                            sq.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.02)';
                            sq.style.borderRadius = '20px';
                            sq.style.boxShadow = '0 8px 40px rgba(0,0,0,0.8), 0 0 60px rgba(76,175,80,0.08)';
                            sq.style.zIndex = '5';
                            sq.classList.add('slide');
                        }, delay);
                    });

                    setTimeout(resolve, squares.length * 30 + 950);
                });
            }

            function runMerge() {
                return new Promise((resolve) => {
                    measureGrid();
                    const gridRect = grid.getBoundingClientRect();
                    const cx = gridRect.left + gridRect.width / 2;
                    const cy = gridRect.top + gridRect.height / 2;
                    const mergedSize = squareSize * 1.8;

                    mergedSquare.style.width = mergedSize + 'px';
                    mergedSquare.style.height = mergedSize + 'px';
                    mergedSquare.style.left = (cx - mergedSize / 2 - gridRect.left) + 'px';
                    mergedSquare.style.top = (cy - mergedSize / 2 - gridRect.top) + 'px';

                    const mergedImg = document.createElement('img');
                    mergedImg.className = 'gif-bg';
                    mergedImg.src = selectedGif;
                    mergedImg.alt = '';
                    mergedSquare.innerHTML = '';
                    mergedSquare.appendChild(mergedImg);

                    squares.forEach((sq, i) => {
                        setTimeout(() => {
                            sq.style.transition = 'transform 0.5s ease, opacity 0.4s ease, border-radius 0.4s ease';
                            sq.style.transform = 'scale(0.3)';
                            sq.style.opacity = '0';
                            sq.style.borderRadius = '30px';
                            sq.style.zIndex = '0';
                        }, i * 20);
                    });

                    setTimeout(() => {
                        mergedSquare.classList.add('show');
                        setTimeout(() => {
                            pulseRing.classList.add('pulse');
                        }, 300);
                        loadingText.style.opacity = '0.4';
                        resolve();
                    }, 500);
                });
            }

            function runFadeOut() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        setTimeout(resolve, 950);
                    }, 2200);
                });
            }

            async function start() {
                buildGrid();
                measureGrid();
                await runPop();
                await runSlide();
                await runMerge();
                await runFadeOut();
                console.log('Loading complete.');
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(start, 200);
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(start, 200);
                });
            }

        })();
    </script>
